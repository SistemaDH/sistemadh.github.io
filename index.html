  <!--
    A MARCA DA MESA.

    O ícone de 32 entra mais perto do desenho de propósito: naquele tamanho a
    moldura vira borrão e some com tudo, e o que se reconhece numa aba é a
    adaga com a chama. Os de 180/192/512 respiram.

    O manifesto é o que faz "adicionar à tela inicial" virar um aplicativo de
    verdade — nome, ícone e tela cheia sem a barra do navegador. Numa mesa de
    jogo isso é a diferença entre abrir a ficha num toque e caçar uma aba.
  -->
  <link rel="icon" type="image/png" sizes="32x32" href="assets/marca/icone-32.png" />
  <link rel="apple-touch-icon" href="assets/marca/icone-180.png" />
  <link rel="manifest" href="manifest.webmanifest" />
