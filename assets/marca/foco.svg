<!--
  FOCO — a marca do recurso do Artista Marcial.

  Ela precisa dizer "compostura, clareza e controle" e, ao mesmo tempo, não se
  confundir com a Esperança, que fica logo acima dela na ficha. A Esperança é
  uma EXPLOSÃO de raios; o Foco é o contrário disso: um centro parado, com
  tudo apontando para dentro.

  São três anéis concêntricos e um núcleo cheio, mais quatro marcas cardeais
  curtas por fora. O desenho se lê inteiro a 28px — que é o tamanho em que ele
  vive — e a silhueta é redonda, contra os losangos da Esperança: a trilha se
  conta pelo FORMATO antes da cor.

  Usada como máscara CSS (só o alfa importa), então tudo aqui é preenchimento
  sólido com fill-rule="evenodd" fazendo os vazados.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <path fill-rule="evenodd" d="
    M 112,512 A 400,400 0 1 0 912,512 A 400,400 0 1 0 112,512 Z
    M 184,512 A 328,328 0 1 0 840,512 A 328,328 0 1 0 184,512 Z

    M 256,512 A 256,256 0 1 0 768,512 A 256,256 0 1 0 256,512 Z
    M 320,512 A 192,192 0 1 0 704,512 A 192,192 0 1 0 320,512 Z

    M 388,512 A 124,124 0 1 0 636,512 A 124,124 0 1 0 388,512 Z

    M 488,24  L 536,24  L 536,96  L 488,96  Z
    M 488,928 L 536,928 L 536,1000 L 488,1000 Z
    M 24,488  L 96,488  L 96,536  L 24,536  Z
    M 928,488 L 1000,488 L 1000,536 L 928,536 Z
  "/>
</svg>
