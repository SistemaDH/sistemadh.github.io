name: Lote 8 - Consumiveis Resultado Manual E8

on:
  push:
    branches: [tmp-lote8-consumiveis-resultado-e8-sol]

permissions:
  contents: write

env:
  BASE_SHA: 6fd131d943b4d64f0f2fc87189dc82788ceae69d

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materializar consumiveis E8
        run: |
          python3 tools/lote8-consumiveis-resultado-e8.py
          node tools/gerar-44-equipamento.mjs
          node tools/gerar-47-contadores.mjs
          node tools/gerar-48-criacao.mjs
          node tools/gerar-41-dominios.mjs
          node tools/gerar-4B-descanso.mjs
          python3 -c "from pathlib import Path; p=Path('docs/HANDOFF.md'); p.write_text(p.read_text(encoding='utf-8').rstrip()+'\n',encoding='utf-8')"
          git diff --check
          node --check js/telas/ficha.js

      - name: Conferir catalogo, resolucao manual e auditoria E8
        run: |
          python3 - <<'PY'
          import json, subprocess
          ids={'consumivel-41','consumivel-51'}
          eq=json.load(open('data/equipamentos.json',encoding='utf-8'))
          xs={x['id']:x for x in eq.get('consumiveis',[]) if x.get('id') in ids}
          assert set(xs)==ids,(set(xs),ids)
          assert xs['consumivel-41']['efeitoConsumivel']['tipo']=='resultado-dado-faixas'
          assert xs['consumivel-41']['efeitoConsumivel']['dado']=='d6'
          assert xs['consumivel-51']['efeitoConsumivel']['tipo']=='recuperar-tudo-e-ganhar-com-dado'
          assert xs['consumivel-51']['efeitoConsumivel']['dado']=='d4'
          for ident,x in xs.items():
              assert x.get('automacao',{}).get('classificacao')=='consumivel-resultado-manual-e8',ident
              assert x.get('automacao',{}).get('rolaNoApp') is False,ident
              assert x.get('efeitoConsumivel',{}).get('rolaNoApp') is False,ident
          texto=open('backend/4C_Ajustes.gs',encoding='utf-8').read()
          for agulha in ["tipo === 'resultado-dado-faixas'", "tipo === 'recuperar-tudo-e-ganhar-com-dado'", 'const lerResultadoManual = function()']:
              assert agulha in texto,agulha
          out=subprocess.check_output(['python3','tools/auditar-pendencias-lote8.py'],text=True)
          print(out)
          for x in xs.values():
              linha='| consumiveis | '+x['nome']+' | candidato mecânico |'
              assert linha not in out,linha
          print('E8 OK: Seiva/Ceia estruturadas, entrada manual preservada e fora dos candidatos.')
          PY

      - name: Testes backend
        run: node tools/testes-backend.mjs

      - name: Instalar Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Testes E2E
        run: node tools/testes-e2e.mjs

      - name: Conferir gerados e CSS
        run: |
          node tools/conferir-gerados.mjs
          node tools/conferir-css.mjs
          git diff --check

      - name: Proteger contra concorrencia
        run: |
          git fetch origin 'refs/heads/ediçãoclaude:refs/remotes/origin/ediçãoclaude'
          ATUAL="$(git rev-parse 'origin/ediçãoclaude')"
          echo "ediçãoclaude atual: $ATUAL"
          echo "base esperada:       $BASE_SHA"
          test "$ATUAL" = "$BASE_SHA"

      - name: Commitar funcional e limpar temporarios
        run: |
          rm tools/lote8-consumiveis-resultado-e8.py
          rm .github/workflows/lote8-consumiveis-resultado-e8.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo 'Nenhuma mudança funcional para commit.'; exit 1; } || true
          git commit -m 'feat: integrar consumiveis de resultado manual'
          git push origin HEAD:tmp-lote8-consumiveis-resultado-e8-sol
