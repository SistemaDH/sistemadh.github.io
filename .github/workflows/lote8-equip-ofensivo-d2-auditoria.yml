name: Lote 8 - Equipamento Ofensivo D2

on:
  push:
    branches: [tmp-lote8-equip-ofensivo-d2-sol]

permissions:
  contents: write

env:
  BASE_SHA: 8563718a027b7448835979ad268d3a659f9e953c

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materializar D2
        run: |
          python3 tools/lote8-equip-ofensivo-d2.py
          node tools/gerar-44-equipamento.mjs
          node tools/gerar-41-dominios.mjs
          node tools/gerar-47-contadores.mjs
          node tools/gerar-4B-descanso.mjs
          git diff --check

      - name: Conferir D2 e auditoria
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('data/equipamentos.json',encoding='utf-8'))
          ach=[]
          def walk(x):
            if isinstance(x,dict):
              c=x.get('caracteristica')
              if isinstance(c,dict) and c.get('nome') in {'Versátil','Egoísta','Tiro rápido'}:
                ach.append((x,c))
              for v in x.values(): walk(v)
            elif isinstance(x,list):
              for v in x: walk(v)
          walk(d)
          por={n:[(i,c) for i,c in ach if c.get('nome')==n] for n in ('Versátil','Egoísta','Tiro rápido')}
          assert len(por['Versátil']) == 8, len(por['Versátil'])
          assert len(por['Egoísta']) == 1, len(por['Egoísta'])
          assert len(por['Tiro rápido']) == 4, len(por['Tiro rápido'])
          assert all(c.get('automacao') and (c.get('efeitoEquipamento') or {}).get('perfilAlternativo') for _,c in por['Versátil'])
          assert all(c.get('automacao') and (c.get('efeitoEquipamento') or {}).get('usoAtivo') for n in ('Egoísta','Tiro rápido') for _,c in por[n])
          adv=[i for i,c in por['Versátil'] if i.get('id')=='primaria-t3-avancado-nome-cortado-incompleto'][0]
          assert adv.get('nome') == 'Cetro avançado', adv.get('nome')
          assert 'Avançado (nome cortado/incompleto)' in (adv.get('aliases') or [])
          print('D2 invariantes OK:', {k:len(v) for k,v in por.items()})
          PY
          python3 tools/auditar-pendencias-lote8.py
          node --check js/telas/ficha.js

      - name: Testes backend
        run: node tools/testes-backend.mjs

      - name: Instalar Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Testes E2E
        run: node tools/testes-e2e.mjs

      - name: Conferir gerados e CSS
        run: |
          node tools/conferir-gerados.mjs
          node tools/conferir-css.mjs
          git diff --check

      - name: Proteger contra concorrencia
        run: |
          git fetch origin 'refs/heads/ediçãoclaude:refs/remotes/origin/ediçãoclaude'
          ATUAL="$(git rev-parse 'origin/ediçãoclaude')"
          echo "ediçãoclaude atual: $ATUAL"
          echo "base esperada:       $BASE_SHA"
          test "$ATUAL" = "$BASE_SHA"

      - name: Commitar funcional e limpar temporarios
        run: |
          rm tools/lote8-equip-ofensivo-d2.py
          rm .github/workflows/lote8-equip-ofensivo-d2-auditoria.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo 'Nenhuma mudança funcional para commit.'; exit 1; } || true
          git commit -m 'feat: fechar equipamento ofensivo D2'
          git push origin HEAD:tmp-lote8-equip-ofensivo-d2-sol
