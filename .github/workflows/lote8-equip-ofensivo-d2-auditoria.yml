name: Lote 8 - Auditoria Equipamento Ofensivo D2

on:
  push:
    branches: [tmp-lote8-equip-ofensivo-d2-sol]

permissions:
  contents: read

jobs:
  auditar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detalhar D2
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('data/equipamentos.json',encoding='utf-8'))
          achados=[]
          def walk(x):
            if isinstance(x,dict):
              c=x.get('caracteristica')
              if isinstance(c,dict) and ((c.get('nome')=='Versátil') or c.get('nome') in {'Egoísta','Tiro rápido'}):
                achados.append(x)
              for v in x.values(): walk(v)
            elif isinstance(x,list):
              for v in x: walk(v)
          walk(d)
          for x in achados:
            print('ITEM_JSON',json.dumps({k:x.get(k) for k in ('id','nome','categoria','tier','atributo','alcance','dano','maos','caracteristica')},ensure_ascii=False))
          PY
          echo '--- OURO ---'
          grep -n -A80 -B5 'function ajustarOuroDaFicha_' backend/4C_Ajustes.gs
          echo '--- NORMALIZACAO OURO ---'
          grep -n -A70 -B5 'function ouroNormalizado_' backend/44_Equipamento.gs || true
