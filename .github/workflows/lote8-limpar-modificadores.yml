name: Lote 8 - limpar artefatos de modificadores

on:
  push:
    branches:
      - 'ediçãoclaude'

permissions:
  contents: write

jobs:
  limpar:
    if: ${{ contains(github.event.head_commit.message, '[cleanup-modificadores]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'ediçãoclaude'
          fetch-depth: 0
      - name: Remover somente artefatos temporários deste bloco
        run: |
          git rm -f --ignore-unmatch \
            .github/workflows/lote8-auditar-modificadores.yml \
            .github/workflows/lote8-fixar-humanos.yml \
            .github/workflows/lote8-fixar-modificadores-2.yml \
            .github/workflows/lote8-fixar-modificadores-3.yml \
            .github/workflows/lote8-fixar-modificadores-4.yml \
            .github/workflows/lote8-modificadores-derivados.yml \
            .github/workflows/lote8-limpar-modificadores.yml \
            tools/.lote8-run-modificadores \
            tools/.lote8-run-modificadores-2 \
            tools/.lote8-run-modificadores-3 \
            tools/.lote8-run-modificadores-4 \
            tools/lote8-auditar-modificadores.py \
            tools/lote8-implementar-modificadores-derivados.py
          git diff --check
      - name: Commitar faxina
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: limpar artefatos temporários dos modificadores'
          git push origin HEAD:'ediçãoclaude'
