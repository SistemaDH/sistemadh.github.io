name: Lote 8 - auditar modificadores Core

on:
  push:
    branches:
      - 'ediçãoclaude'
  workflow_dispatch:

jobs:
  auditar:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-auditoria-modificadores]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'ediçãoclaude'
      - name: Inventariar modificadores numéricos
        run: python3 tools/lote8-auditar-modificadores.py
