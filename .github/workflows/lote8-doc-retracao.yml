name: Lote 8 - docs Retração

on:
  push:
    branches:
      - 'ediçãoclaude'

permissions:
  contents: write

jobs:
  registrar:
    if: ${{ contains(github.event.head_commit.message, '[run-lote8-doc-retracao]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'ediçãoclaude'
          fetch-depth: 0
      - name: Registrar checkpoint
        run: |
          python3 tools/lote8-doc-retracao.py
          git diff --check
      - name: Proteger contra concorrência
        run: |
          git fetch origin 'ediçãoclaude'
          test "$(git rev-parse 'origin/ediçãoclaude')" = "$GITHUB_SHA"
      - name: Commitar docs e limpar temporários
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f tools/lote8-doc-retracao.py
          git rm -f .github/workflows/lote8-doc-retracao.yml
          git add -A
          git diff --cached --check
          git commit -m 'docs: registrar Retração e auditoria do Pequenino'
          git push origin HEAD:'ediçãoclaude'
