name: Lote 8 - Lâmina N1-N4
on:
  push:
    branches: ["tmp-lote8-blade-n1-n4"]
permissions:
  contents: write
jobs:
  validar:
    if: contains(github.event.head_commit.message, '[run-lote8-blade-n1-n4]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materializar Lâmina N1-N4
        run: |
          python3 tools/lote8-blade-n1-n4.py
          python3 tools/lote8-blade-n1-n4-hotfix.py
          node tools/gerar-41-dominios.mjs
          node tools/gerar-47-contadores.mjs
          node tools/gerar-48-criacao.mjs
      - name: Checkers e sintaxe
        run: |
          python3 tools/conferir-cartas-lote8.py
          python3 tools/conferir-classes-lote8.py
          node --check js/telas/ficha.js
          git diff --check
      - name: Testes backend
        run: node tools/testes-backend.mjs
      - name: Instalar Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Testes E2E
        run: node tools/testes-e2e.mjs
      - name: Conferir gerados e CSS
        run: |
          node tools/conferir-gerados.mjs
          node tools/conferir-css.mjs
      - name: Auditoria avança Lâmina
        run: |
          python3 tools/auditar-pendencias-lote8.py | tee /tmp/auditoria-lote8.txt
          grep -F 'Classes/subclasses: **99 características**; **0** candidatas sem sinal de automação.' /tmp/auditoria-lote8.txt
          ! grep -E '^\| Lâmina \| [1-4] \|' /tmp/auditoria-lote8.txt
      - name: Proteger contra concorrencia
        run: |
          git fetch origin 'ediçãoclaude' 'tmp-lote8-blade-n1-n4'
          test "$(git rev-parse 'origin/ediçãoclaude')" = '08b6e07069928f94d7e8bd70b45f49dd682136c9'
          test "$(git rev-parse 'origin/tmp-lote8-blade-n1-n4')" = "$GITHUB_SHA"
      - name: Commitar funcional e limpar temporarios
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f tools/lote8-blade-n1-n4.py
          git rm -f tools/lote8-blade-n1-n4-hotfix.py
          git rm -f .github/workflows/lote8-blade-n1-n4.yml
          git add -A
          git diff --cached --check
          git commit -m 'feat: revisar Lâmina níveis 1 a 4 [lote8-generated]'
          git push origin HEAD:'tmp-lote8-blade-n1-n4'
