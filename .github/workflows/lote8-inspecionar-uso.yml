name: Lote 8 - inspecionar mecanismo de uso

on:
  push:
    branches:
      - 'ediçãoclaude'

permissions:
  contents: read

jobs:
  inspecionar:
    if: ${{ contains(github.event.head_commit.message, '[inspect-uso]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'ediçãoclaude'
      - name: Localizar o caminho genérico de habilidades
        run: |
          echo '=== REFERÊNCIAS ==='
          grep -R -n -E 'usoDaCaracteristica|aplicarHabilidade_|marcaUso|rotuloAtivo|cartaDaMao|alvosDeHabilidade|USOS.*CARACTER|USO.*CARACTER' backend js tools data/classes.json | head -n 350 || true
          echo '=== FUNÇÕES DE CATÁLOGO DA FICHA ==='
          grep -n -B 15 -A 35 -E 'usoDaCaracteristica|const catalogo|catalogo =' js/telas/ficha.js || true
          echo '=== HANDLER BACKEND ==='
          grep -n -B 25 -A 120 -E 'function aplicarHabilidade_|tipo.*habilidade' backend/4C_Ajustes.gs || true
