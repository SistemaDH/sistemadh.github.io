name: tmp Lote 9 B30 dano artifact

on:
  push:
    branches:
      - tmp-lote9-b30-dano-artifact-sol
    paths:
      - .github/workflows/tmp-lote9-b30.yml

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run teste:sintaxe
      - run: npm run teste
      - run: npm run teste:gerados
      - run: npm run teste:css
      - name: Auditoria Core 1.0 zerada
        shell: bash
        run: |
          python3 tools/auditar-pendencias-lote8.py > /tmp/auditoria.md
          grep -F 'Classes/subclasses: **99 características**; **0** candidatas' /tmp/auditoria.md
          grep -F 'Comunidades: **9 características**; **0** candidatas' /tmp/auditoria.md
          grep -F 'Cartas de domínio: **189 cartas**; **0** candidatas' /tmp/auditoria.md
          grep -F 'Características de armas/armaduras/molduras: **203 ocorrências**; **0** ocorrências candidatas' /tmp/auditoria.md
          grep -F 'Loot/consumíveis com texto mecânico detectado: **81**; **0** candidatos' /tmp/auditoria.md
      - run: npx playwright install --with-deps chromium
      - run: npm run teste:e2e
      - run: npm run teste:layout-mobile
      - run: npm run teste:layout-conjuracao-mobile
      - run: npm run teste:layout-toast-contexto-mobile
      - run: npm run teste:layout-mestre-mobile
      - run: npm run teste:layout-criacao-mobile
      - run: npm run teste:layout-regras-mobile
      - run: npm run teste:layout-abertura-mobile
      - run: npm run teste:layout-ajustes-mobile
      - run: npm run teste:layout-avanco-mobile
      - run: npm run teste:layout-descanso-mobile
      - name: Dano HUD 360 / 768 com diagnóstico visual
        run: npm run teste:layout-dano-mobile
      - run: npm run teste:layout-mochila-em-uso-mobile
      - run: npm run teste:layout-foto-mobile
      - run: npm run teste:layout-responsivo
      - name: Conferir arquivos do diagnóstico de dano
        shell: bash
        run: |
          test -f artifacts/layout-dano-mobile/360x800-dano-hud.png
          test -f artifacts/layout-dano-mobile/768x1024-dano-hud.png
          test -f artifacts/layout-dano-mobile/relatorio.json
          grep -F '"dano": "Dano"' artifacts/layout-dano-mobile/relatorio.json
          grep -F '"antigo": false' artifacts/layout-dano-mobile/relatorio.json
          grep -F 'name: layout-dano-mobile-' .github/workflows/ci.yml
          grep -F 'path: artifacts/layout-dano-mobile' .github/workflows/ci.yml
      - name: Guardar diagnóstico visual Dano HUD
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layout-dano-mobile-b30-gate-${{ github.run_id }}
          path: artifacts/layout-dano-mobile
          if-no-files-found: warn
