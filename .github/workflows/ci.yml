name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [newedit]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run teste:sintaxe
      - run: npm run teste
      - run: npm run teste:gerados
      - run: npm run teste:css
      - name: Fonte, tradução e cobertura SRD 2.0
        run: npm run teste:srd2
      - name: Auditoria Core 1.0 zerada
        run: |
          python3 tools/auditar-pendencias-lote8.py > /tmp/auditoria.md
          grep -F 'Classes/subclasses: **99 características**; **0** candidatas' /tmp/auditoria.md
          grep -F 'Comunidades: **9 características**; **0** candidatas' /tmp/auditoria.md
          grep -F 'Cartas de domínio: **189 cartas**; **0** candidatas' /tmp/auditoria.md
          grep -F 'Características de armas/armaduras/molduras: **203 ocorrências**; **0** ocorrências candidatas' /tmp/auditoria.md
          grep -F 'Loot/consumíveis com texto mecânico detectado: **81**; **0** candidatos' /tmp/auditoria.md
      - run: npx playwright install --with-deps chromium
      - run: npm run teste:e2e
      - name: Layout mobile 360 / 390 / 430
        run: npm run teste:layout-mobile
      - name: Conjuração mobile 360 / 390 sem pontuação órfã
        run: npm run teste:layout-conjuracao-mobile
      - name: Toast contextual 360 / 390 ao abrir ficha
        run: npm run teste:layout-toast-contexto-mobile
      - name: Layout Mestre mobile 360 / 390 / 430
        run: npm run teste:layout-mestre-mobile
      - name: Layout criação mobile 360 / 390 / 430
        run: npm run teste:layout-criacao-mobile
      - name: Layout Regras mobile 360 / 390 / 430 + rolagem
        run: npm run teste:layout-regras-mobile
      - name: Abertura mobile 360 / 390 / 430 + mostrar código
        run: npm run teste:layout-abertura-mobile
      - name: Ajustes mobile 360 / 390 / 430 + conexão
        run: npm run teste:layout-ajustes-mobile
      - name: Avanço mobile 360 / 390 / 430 + resumo sticky
        run: npm run teste:layout-avanco-mobile
      - name: Descanso mobile 360 / 390 / 430 + ações fixas
        run: npm run teste:layout-descanso-mobile
      - name: Dano HUD 360 / 768 sem título antigo
        run: npm run teste:layout-dano-mobile
      - name: Mochila mobile 360 / 390 / 430 + itens em uso
        run: npm run teste:layout-mochila-em-uso-mobile
      - name: Foto mobile 360 / 390 / 430 + zoom
        run: npm run teste:layout-foto-mobile
      - name: Layout responsivo 768 / 1024 / 1440
        run: npm run teste:layout-responsivo
      - name: Guardar diagnóstico visual mobile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layout-mobile-${{ github.run_id }}
          path: artifacts/layout-mobile
          if-no-files-found: warn
      - name: Guardar diagnóstico visual Conjuração mobile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layout-conjuracao-mobile-${{ github.run_id }}
          path: artifacts/layout-conjuracao-mobile
          if-no-files-found: warn
      - name: Guardar diagnóstico visual toast contextual
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layout-toast-contexto-mobile-${{ github.run_id }}
          path: artifacts/layout-toast-contexto-mobile
          if-no-files-found: warn
      - name: Guardar diagnóstico visual mochila mobile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layout-mochila-em-uso-mobile-${{ github.run_id }}
          path: artifacts/layout-mochila-em-uso-mobile
          if-no-files-found: warn
      - name: Guardar diagnóstico visual Mestre mobile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layout-mestre-mobile-${{ github.run_id }}
          path: |
            artifacts/layout-mestre-mobile
            artifacts/layout-editor-adversario-mobile
          if-no-files-found: warn
      - name: Guardar diagnóstico visual criação mobile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layout-criacao-mobile-${{ github.run_id }}
          path: |
            artifacts/layout-criacao-mobile
            artifacts/layout-criacao-ajuda-mobile
          if-no-files-found: warn
      - name: Guardar diagnóstico visual Regras mobile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layout-regras-mobile-${{ github.run_id }}
          path: artifacts/layout-regras-mobile
          if-no-files-found: warn
      - name: Guardar diagnóstico visual abertura mobile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layout-abertura-mobile-${{ github.run_id }}
          path: artifacts/layout-abertura-mobile
          if-no-files-found: warn
      - name: Guardar diagnóstico visual Ajustes mobile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layout-ajustes-mobile-${{ github.run_id }}
          path: artifacts/layout-ajustes-mobile
          if-no-files-found: warn
      - name: Guardar diagnóstico visual avanço mobile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layout-avanco-mobile-${{ github.run_id }}
          path: artifacts/layout-avanco-mobile
          if-no-files-found: warn
      - name: Guardar diagnóstico visual descanso mobile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layout-descanso-mobile-${{ github.run_id }}
          path: artifacts/layout-descanso-mobile
          if-no-files-found: warn
      - name: Guardar diagnóstico visual Dano HUD
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layout-dano-mobile-${{ github.run_id }}
          path: artifacts/layout-dano-mobile
          if-no-files-found: warn
      - name: Guardar diagnóstico visual foto mobile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layout-foto-mobile-${{ github.run_id }}
          path: artifacts/layout-foto-mobile
          if-no-files-found: warn
      - name: Guardar diagnóstico visual responsivo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layout-responsivo-${{ github.run_id }}
          path: artifacts/layout-responsivo
          if-no-files-found: warn
