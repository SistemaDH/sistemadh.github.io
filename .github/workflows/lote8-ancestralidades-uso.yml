name: Lote 8 - ancestralidades ativas

on:
  push:
    branches:
      - 'ediçãoclaude'

permissions:
  contents: write

jobs:
  validar:
    if: ${{ contains(github.event.head_commit.message, '[run-ancestralidades-uso]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'ediçãoclaude'
          fetch-depth: 0

      - name: Materializar habilidades de ancestralidade
        run: |
          python3 tools/lote8-ancestralidades-uso.py
          node tools/gerar-43-origens.mjs
          node tools/gerar-47-contadores.mjs
          node tools/gerar-48-criacao.mjs
          python3 tools/conferir-ancestralidades-lote8.py
          git diff --check

      - name: Testes backend
        run: node tools/testes-backend.mjs

      - name: Testes E2E
        run: node tools/testes-e2e.mjs

      - name: Conferir arquivos gerados
        run: node tools/conferir-gerados.mjs

      - name: Conferir CSS
        run: node tools/conferir-css.mjs

      - name: Proteger contra concorrência
        run: |
          git fetch origin 'ediçãoclaude'
          REMOTO="$(git rev-parse 'origin/ediçãoclaude')"
          if [ "$REMOTO" != "$GITHUB_SHA" ]; then
            echo "Branch avançou durante a validação: $GITHUB_SHA -> $REMOTO"
            exit 1
          fi

      - name: Commitar somente o bloco funcional
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/ancestralidades.json data/contadores.json \
            tools/gerar-43-origens.mjs tools/gerar-47-contadores.mjs tools/gerar-48-criacao.mjs \
            backend/43_Origens.gs backend/47_Contadores.gs backend/48_Criacao.gs backend/4C_Ajustes.gs \
            js/telas/ficha.js tools/testes-backend.mjs tools/conferir-ancestralidades-lote8.py
          git diff --cached --check
          git commit -m 'feat: automatizar usos de ancestralidade do Lote 8 [lote8-generated]'
          git push origin HEAD:'ediçãoclaude'
