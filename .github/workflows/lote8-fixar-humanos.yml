name: Lote 8 - corrigir id Humanos no transformador

on:
  push:
    branches:
      - 'ediçãoclaude'

permissions:
  contents: write

jobs:
  corrigir:
    if: ${{ contains(github.event.head_commit.message, '[fix-humanos]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'ediçãoclaude'
          fetch-depth: 0
      - name: Corrigir somente o id canônico
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/lote8-implementar-modificadores-derivados.py')
          t = p.read_text(encoding='utf-8')
          velho = "('humano', 'alta resistencia'): {'estresseMaximo': 1},"
          novo = "('humanos', 'alta resistencia'): {'estresseMaximo': 1},"
          if t.count(velho) != 1:
              raise SystemExit(f'esperava 1 ocorrência do mapeamento antigo; achei {t.count(velho)}')
          p.write_text(t.replace(velho, novo, 1), encoding='utf-8')
          PY
          git diff --check
      - name: Commitar e disparar validação completa
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/lote8-implementar-modificadores-derivados.py
          git commit -m 'fix: alinhar id Humanos no transformador [run-modificadores]'
          git push origin HEAD:'ediçãoclaude'
