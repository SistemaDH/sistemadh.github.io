name: TEMP Lote 9 B26 Conjuracao mobile

on:
  push:
    branches: [tmp-lote9-b26-conjuracao-mobile-sol]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run teste:sintaxe
      - run: npm run teste:css
      - run: npx playwright install --with-deps chromium
      - name: Conjuracao mobile 360 / 390 sem pontuacao orfa
        run: npm run teste:layout-conjuracao-mobile
      - name: Guardar diagnostico visual B26
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lote9-b26-conjuracao-${{ github.run_id }}
          path: artifacts/layout-conjuracao-mobile
          if-no-files-found: warn
