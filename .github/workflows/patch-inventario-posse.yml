name: Patch temporário inventário e posse
on:
  push:
    branches: [newedit]
permissions:
  contents: write
jobs:
  patch:
    if: contains(github.event.head_commit.message, '[run-inventario-posse]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: newedit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Corrigir aplicador
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/patch-inventario-posse.py'); s=p.read_text(encoding='utf-8')
          inicio=s.index('marcador_resultado = '); fim=s.index("novos_testes = r'''", inicio)
          s=s[:inicio]+'''indice_resultado = testes.rfind("console.log(`")\nif indice_resultado < 0:\n    raise SystemExit('não encontrei resumo dos testes backend')\n'''+s[fim:]
          s=s.replace('testes = testes.replace(marcador_resultado, novos_testes + marcador_resultado, 1)','testes = testes[:indice_resultado] + novos_testes + testes[indice_resultado:]')
          p.write_text(s,encoding='utf-8')
          PY
      - run: python3 tools/patch-inventario-posse.py
      - name: Ajustes pós-patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('backend/4C_Ajustes.gs'); s=p.read_text(encoding='utf-8')
          velho="""function normalizarInventario_(ficha) {
            const lista = Array.isArray(ficha.inventario) ? ficha.inventario : [];
            const saida = [];
            const gruposEmUso = {};
            for (let i = 0; i < lista.length && saida.length < LIMITE_ITENS_INVENTARIO; i++) {
              const item = itemDeMochila_(lista[i]);
              if (!item) continue;
              if (!item.id) {
          """.replace('            ','')
          novo="""function normalizarInventario_(ficha) {
            const lista = Array.isArray(ficha.inventario) ? ficha.inventario : [];
            const chavesLegado = lista.map(function (bruto) {
              const nome = (bruto && typeof bruto === 'object') ? bruto.nome : bruto;
              return chaveTexto_(nome);
            });
            const marcadoresCriacao = ['15 metros de corda','Suprimentos básicos','Um punhado de ouro'];
            let sinaisCriacao = 0;
            for (let m = 0; m < marcadoresCriacao.length; m++) {
              if (chavesLegado.indexOf(chaveTexto_(marcadoresCriacao[m])) !== -1) sinaisCriacao++;
            }
            const pareceInventarioInicialLegado = sinaisCriacao >= 2;
            const saida = [];
            const gruposEmUso = {};
            for (let i = 0; i < lista.length && saida.length < LIMITE_ITENS_INVENTARIO; i++) {
              const item = itemDeMochila_(lista[i]);
              if (!item) continue;
              if (!item.id && pareceInventarioInicialLegado) {
          """.replace('            ','')
          if velho not in s: raise SystemExit('normalizarInventario pós-patch não encontrado')
          p.write_text(s.replace(velho,novo,1),encoding='utf-8')

          p=Path('js/telas/ficha.js'); s=p.read_text(encoding='utf-8')
          velho="""      acoes: [
                el('button', { type: 'button', class: 'btn btn--fantasma', onClick: fecharModal }, 'Fechar'),
                ...extras,
                ...(permitirUso ? botoesDeUsoEquipamento_(item, fecharModal, p.ficha) : [])
              ]""".replace('              ','')
          novo="""      acoes: permitirUso ? [
                el('button', { type: 'button', class: 'btn btn--fantasma', onClick: fecharModal }, 'Fechar'),
                ...extras,
                ...botoesDeUsoEquipamento_(item, fecharModal, p.ficha)
              ] : [
                el('button', { type: 'button', class: 'btn btn--fantasma', onClick: fecharModal }, 'Fechar'),
                ...extras
              ]""".replace('              ','')
          if velho not in s:
            # forma literal sem normalização de recuo
            velho="""      acoes: [
        el('button', { type: 'button', class: 'btn btn--fantasma', onClick: fecharModal }, 'Fechar'),
        ...extras,
        ...(permitirUso ? botoesDeUsoEquipamento_(item, fecharModal, p.ficha) : [])
      ]"""
            novo="""      acoes: permitirUso ? [
        el('button', { type: 'button', class: 'btn btn--fantasma', onClick: fecharModal }, 'Fechar'),
        ...extras,
        ...botoesDeUsoEquipamento_(item, fecharModal, p.ficha)
      ] : [
        el('button', { type: 'button', class: 'btn btn--fantasma', onClick: fecharModal }, 'Fechar'),
        ...extras
      ]"""
          if velho not in s: raise SystemExit('ações de verEquipamento não encontradas')
          p.write_text(s.replace(velho,novo,1),encoding='utf-8')

          p=Path('tools/testes-e2e.mjs'); s=p.read_text(encoding='utf-8')
          s=s.replace("    const v5 = await versaoNaTela();\n    const estadoArmadura = noBackend(`(function(){","    const vCatalogoArmadura = await versaoNaTela();\n    const estadoArmadura = noBackend(`(function(){",1)
          alvo="    await esperarGravar(v5);\n    const doLivro = pagina.locator('.ficha__item', { hasText: 'Saco de Dormir Premium' });"
          troca="    await esperarGravar(vCatalogoArmadura);\n    const doLivro = pagina.locator('.ficha__item', { hasText: 'Saco de Dormir Premium' });"
          if alvo not in s: raise SystemExit('espera do catálogo não encontrada')
          p.write_text(s.replace(alvo,troca,1),encoding='utf-8')
          PY
      - run: npm ci
      - run: npm run teste:sintaxe
      - run: npm run teste
      - run: npm run teste:gerados
      - run: npm run teste:css
      - run: npx playwright install --with-deps chromium
      - run: npm run teste:e2e
      - run: npm run teste:layout-mochila-em-uso-mobile
      - run: npm run teste:layout-criacao-mobile
      - name: Gravar patch e remover andaime temporário
        run: |
          rm tools/patch-inventario-posse.py .github/workflows/patch-inventario-posse.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/40_Regras.gs backend/4C_Ajustes.gs js/telas/criacao.js js/telas/ficha.js tools/testes-backend.mjs tools/testes-e2e.mjs tools/patch-inventario-posse.py .github/workflows/patch-inventario-posse.yml
          git commit -m "feat: unificar posse de equipamentos e mochila"
          git push origin HEAD:newedit
