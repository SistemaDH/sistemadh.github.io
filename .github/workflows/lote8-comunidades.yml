name: Lote 8 - comunidades

on:
  push:
    branches: ['ediçãoclaude']

permissions:
  contents: write

jobs:
  validar-materializar:
    if: ${{ contains(github.event.head_commit.message, '[run-lote8-comunidades]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'ediçãoclaude'
          fetch-depth: 0

      - name: Materializar comunidades
        run: |
          python3 tools/lote8-comunidades.py
          python3 tools/lote8-comunidades-hotfix.py
          python3 tools/lote8-comunidades-fix2.py
          python3 tools/lote8-comunidades-fix3.py
          node tools/gerar-43-origens.mjs
          node tools/gerar-47-contadores.mjs
          node tools/gerar-48-criacao.mjs
          python3 tools/conferir-comunidades-lote8.py
          python3 tools/conferir-ancestralidades-lote8.py
          git diff --check

      - name: Testes backend
        run: node tools/testes-backend.mjs

      - name: Instalar Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium

      - name: Testes E2E
        run: node tools/testes-e2e.mjs

      - name: Conferir gerados e CSS
        run: |
          node tools/conferir-gerados.mjs
          node tools/conferir-css.mjs

      - name: Regenerar auditoria transversal
        run: |
          python3 tools/auditar-pendencias-lote8.py > docs/AUDITORIA-FINAL-LOTE8.md
          python3 -c "from pathlib import Path; p=Path('docs/AUDITORIA-FINAL-LOTE8.md'); p.write_text(p.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')"
          grep -q 'Comunidades: \*\*9 características\*\*; \*\*0\*\* candidatas' docs/AUDITORIA-FINAL-LOTE8.md
          python3 tools/lote8-comunidades-checkpoint.py
          git diff --check

      - name: Proteger contra concorrência
        run: |
          git fetch origin 'ediçãoclaude'
          test "$(git rev-parse 'origin/ediçãoclaude')" = "$GITHUB_SHA"

      - name: Commitar funcional e limpar temporários
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f tools/lote8-comunidades.py
          git rm -f tools/lote8-comunidades-hotfix.py
          git rm -f tools/lote8-comunidades-fix2.py
          git rm -f tools/lote8-comunidades-fix3.py
          git rm -f tools/lote8-comunidades-checkpoint.py
          git rm -f .github/workflows/lote8-comunidades.yml
          git add -A
          git diff --cached --check
          git commit -m 'feat: fechar mecânicas das comunidades [lote8-generated]'
          git push origin HEAD:'ediçãoclaude'
