name: Registrar fechamento do inventário
on:
  push:
    branches: [inventario-integracao]
permissions:
  contents: write
jobs:
  registrar:
    if: contains(github.event.head_commit.message, 'registrar fechamento do inventário')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: inventario-integracao
          fetch-depth: 0
      - name: Atualizar HANDOFF
        run: cat tools/inventario-handoff.txt >> docs/HANDOFF.md
      - name: Gravar documentação e remover andaimes
        run: |
          rm tools/inventario-handoff.txt .github/workflows/registrar-inventario-producao.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: registrar inventário e engine-api v10"
          git push origin HEAD:inventario-integracao
