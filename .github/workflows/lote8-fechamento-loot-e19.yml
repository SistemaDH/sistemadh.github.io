name: Lote 8 - Fechamento de Loot E19

on:
  push:
    branches:
      - tmp-lote8-fechamento-loot-e19-sol

permissions:
  contents: write

concurrency:
  group: lote8-fechamento-loot-e19-sol
  cancel-in-progress: false

env:
  BASE_SHA: e2898df29c1db6642bd7e98dac1406717501caca

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Corrigir preparacao temporaria E19
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/lote8-fechamento-loot-e19.py')
          s=p.read_text(encoding='utf-8')
          rotulo="'requer principio'"
          pos=s.find(rotulo)
          if pos < 0:
              raise SystemExit('Rótulo da âncora E19 não encontrado')
          inicio=s.rfind('aj = replace_once(aj,',0,pos)
          fim=s.find('\n',pos)
          if inicio < 0 or fim < 0:
              raise SystemExit('Não foi possível delimitar a chamada da âncora E19')
          novo=(
              "aj = replace_once(aj,\n"
              "\"\"\"  const recursos = (ficha || {}).recursos || {};\n"
              "\n"
              "  // Hopekeeper: duas resoluções no mesmo item. A carga persiste até o uso.\"\"\",\n"
              "\"\"\"  if (efeito.requerVinculo === true && !String(registro.vinculo || '').trim()) {\n"
              "    return { erro:item.nome + ': primeiro use o movimento de repouso deste item para registrar seu princípio.' };\n"
              "  }\n"
              "\n"
              "  const recursos = (ficha || {}).recursos || {};\n"
              "\n"
              "  // Hopekeeper: duas resoluções no mesmo item. A carga persiste até o uso.\"\"\", 'requer principio')"
          )
          s=s[:inicio]+novo+s[fim:]
          trocas=[
              ('Receba +1 em testes contra uma criatura registrada neste item.',
               'Receba +1 em jogadas contra uma criatura registrada neste item.'),
              ('Em um teste diretamente relacionado ao princípio registrado, role 1d20 como seu Dado de Esperança.',
               'Em uma jogada diretamente relacionada ao princípio registrado, role 1d20 como seu Dado de Esperança.'),
          ]
          for old,newtxt in trocas:
              if s.count(old) != 1:
                  raise SystemExit('Vocabulário E19 não encontrado de forma única: '+old)
              s=s.replace(old,newtxt,1)
          p.write_text(s,encoding='utf-8')

          tb=Path('tools/testes-backend.mjs')
          t=tb.read_text(encoding='utf-8')
          ajustes=[
              ('o catálogo tem 185 contadores: 113 de carta, 25 de classe/subclasse, 4 de ancestralidade, 3 de comunidade, 5 de equipamento, 24 de consumível e 11 de loot',
               'o catálogo tem 190 contadores: 113 de carta, 25 de classe/subclasse, 4 de ancestralidade, 3 de comunidade, 5 de equipamento, 24 de consumível e 16 de loot'),
              ('igual(Object.keys(CONTADORES).length, 185);', 'igual(Object.keys(CONTADORES).length, 190);'),
              ("igual(porOrigem['loot'], 11);", "igual(porOrigem['loot'], 16);")
          ]
          for old,newtxt in ajustes:
              if t.count(old) != 1:
                  raise SystemExit('Expectativa de contadores não encontrada de forma única: '+old)
              t=t.replace(old,newtxt,1)
          tb.write_text(t,encoding='utf-8')
          print('Preparação E19 corrigida: âncora, vocabulário e totais de contadores.')
          PY

      - name: Materializar E19 e regenerar
        run: |
          set -euo pipefail
          python3 tools/lote8-fechamento-loot-e19.py
          node tools/gerar-44-equipamento.mjs
          node tools/gerar-47-contadores.mjs
          node tools/gerar-4B-descanso.mjs
          python3 tools/auditar-pendencias-lote8.py > docs/AUDITORIA-FINAL-LOTE8.md
          git diff --check
          node --check js/telas/ficha.js
          node --check js/telas/descanso.js

      - name: Validar contratos e auditoria zerada
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          eq=json.load(open('data/equipamentos.json',encoding='utf-8'))
          loot={x['id']:x for x in eq.get('loot',[])}
          esperadas={
            'loot-23':'loot-registro-criaturas-e19',
            'loot-34':'loot-d12-manual-consumiveis-e19',
            'loot-37':'loot-principio-dado-esperanca-e19',
            'loot-39':'loot-carga-esperanca-e19',
            'loot-52':'loot-troca-carta-sem-custo-e19',
            'loot-59':'loot-custo-por-sessao-e19',
          }
          for rid,classe in esperadas.items():
              assert loot[rid]['automacao']['classificacao']==classe,(rid,loot[rid].get('automacao'))
              assert loot[rid]['automacao']['rolaNoApp'] is False,rid
          assert loot['loot-23']['efeitoSaquePassivo']['registros']['limite']==3
          assert loot['loot-34']['efeitoSaque']['entradaManual']['dado']=='d12'
          assert loot['loot-34']['efeitoSaque']['resultadoFaixas'][-1]['quantidadeConsumiveis']==2
          assert loot['loot-37']['efeitoSaque']['custoEsperanca']==1
          assert loot['loot-39']['efeitoSaque']['carregarEstado']['esperancaExata']==6
          assert loot['loot-39']['efeitoSaque']['usarEstado']['ganhaEsperanca']==1
          assert loot['loot-52']['efeitoSaque']['custoEsperanca']==2
          assert loot['loot-52']['efeitoSaque']['trocaCartasSemCusto']['campoMao']=='cartaDaMao'
          assert loot['loot-59']['efeitoSaque']['custoEsperanca']==4

          cont=json.load(open('data/contadores.json',encoding='utf-8'))
          chaves={x['chave'] for x in cont.get('contadores',[])}
          for chave in ('uso:loot:loot-34','uso:loot:loot-37','estado:loot:loot-39','uso:loot:loot-52','uso:loot:loot-59'):
              assert chave in chaves,chave

          b44=Path('backend/44_Equipamento.gs').read_text(encoding='utf-8')
          b47=Path('backend/47_Contadores.gs').read_text(encoding='utf-8')
          for classe in esperadas.values(): assert classe in b44,classe
          for chave in ('uso:loot:loot-34','uso:loot:loot-37','estado:loot:loot-39','uso:loot:loot-52','uso:loot:loot-59'):
              assert chave in b47,chave

          audit=Path('docs/AUDITORIA-FINAL-LOTE8.md').read_text(encoding='utf-8')
          for rid in esperadas:
              nome=loot[rid]['nome']
              assert f'| loot | {nome} | candidato mecânico |' not in audit,nome
          m=re.search(r'Loot/consumíveis com texto mecânico detectado: \*\*(\d+)\*\*; \*\*(\d+)\*\* candidatos',audit)
          assert m and int(m.group(2))==0,(m.group(0) if m else 'sem resumo de auditoria')
          print('E19 contratos OK; candidatos restantes:',m.group(2))
          PY

      - name: Testes backend completos
        run: node tools/testes-backend.mjs

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Testes E2E completos
        run: node tools/testes-e2e.mjs

      - name: Conferir gerados e CSS
        run: |
          set -euo pipefail
          node tools/conferir-gerados.mjs
          node tools/conferir-css.mjs
          git diff --check

      - name: Trava de concorrencia
        run: |
          set -euo pipefail
          git fetch origin 'refs/heads/ediçãoclaude:refs/remotes/origin/ediçãoclaude'
          ATUAL="$(git rev-parse 'origin/ediçãoclaude')"
          echo "ediçãoclaude atual: $ATUAL"
          echo "base esperada:      $BASE_SHA"
          test "$ATUAL" = "$BASE_SHA"

      - name: Criar commit funcional e limpar temporarios
        run: |
          set -euo pipefail
          rm tools/lote8-fechamento-loot-e19.py
          rm .github/workflows/lote8-fechamento-loot-e19.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo 'Nenhuma alteração funcional para commitar.'; exit 1; }
          git commit -m 'feat: fechar candidatos mecanicos de loot E19'
          git push origin HEAD
