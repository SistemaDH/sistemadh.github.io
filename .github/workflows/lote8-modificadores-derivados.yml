name: Lote 8 - modificadores derivados do Core

on:
  push:
    branches:
      - 'ediçãoclaude'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validar:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-modificadores]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'ediçãoclaude'
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guardar HEAD testado
        run: echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Materializar modificadores e regenerar
        run: |
          python3 tools/lote8-implementar-modificadores-derivados.py
          node tools/gerar-42-classes.mjs
          node tools/gerar-43-origens.mjs
          node tools/gerar-44-equipamento.mjs
          node tools/gerar-45-tracos.mjs
          node tools/gerar-48-criacao.mjs
          node tools/conferir-gerados.mjs
      - name: Instalar dependências E2E
        run: |
          npm install --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Testes backend
        run: node tools/testes-backend.mjs
      - name: Testes E2E
        run: node tools/testes-e2e.mjs
      - name: Conferir CSS
        run: node tools/conferir-css.mjs
      - name: Recusar push sobre branch avançada
        run: |
          git fetch origin 'ediçãoclaude'
          ATUAL=$(git rev-parse origin/ediçãoclaude)
          if [ "$ATUAL" != "$BASE_SHA" ]; then
            echo "Branch avançou durante os testes: $BASE_SHA -> $ATUAL"
            exit 1
          fi
      - name: Commitar somente implementação validada
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/ancestralidades.json data/classes.json data/equipamentos.json \
            tools/gerar-42-classes.mjs tools/gerar-43-origens.mjs tools/gerar-44-equipamento.mjs \
            tools/gerar-45-tracos.mjs tools/gerar-48-criacao.mjs \
            backend/42_Classes.gs backend/43_Origens.gs backend/44_Equipamento.gs \
            backend/45_Tracos.gs backend/48_Criacao.gs \
            js/telas/ficha.js tools/testes-backend.mjs tools/testes-e2e.mjs
          if git diff --cached --quiet; then
            echo 'Nenhuma materialização pendente.'
          else
            git commit -m 'feat: automatizar modificadores derivados do Core [lote8-generated]'
            git push origin HEAD:'ediçãoclaude'
          fi
