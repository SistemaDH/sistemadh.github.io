name: Lote 8 - troca de armas

# Executor temporário do checkpoint de armas de reserva.
on:
  push:
    branches:
      - 'ediçãoclaude'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validar:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-troca-armas]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'ediçãoclaude'
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Aplicar transformação estrita
        run: python3 tools/lote8-implementar-troca-armas.py

      - name: Conferir gerados
        run: node tools/conferir-gerados.mjs

      - name: Instalar dependências E2E
        run: |
          npm install --ignore-scripts
          npx playwright install --with-deps chromium

      - name: Testes backend
        run: node tools/testes-backend.mjs

      - name: Testes E2E
        run: node tools/testes-e2e.mjs

      - name: Conferir CSS
        run: node tools/conferir-css.mjs

      - name: Commitar somente código validado
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/40_Regras.gs backend/4C_Ajustes.gs tools/testes-backend.mjs
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração pendente.'
          else
            git commit -m 'feat: implementar armas de reserva e troca atômica [lote8-generated]'
            git push origin HEAD:'ediçãoclaude'
          fi
