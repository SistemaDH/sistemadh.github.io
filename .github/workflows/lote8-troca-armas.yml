name: Lote 8 - fechar checkpoint de armas

on:
  push:
    branches:
      - 'ediçãoclaude'

permissions:
  contents: write

jobs:
  fechar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'ediçãoclaude'
          fetch-depth: 0

      - name: Registrar checkpoint no diário
        run: |
          cat >> docs/HANDOFF.md <<'EOF'

### Checkpoint validado — armas de reserva e troca de armas

Fonte adotada no Lote 8: livro Core p.112 + errata oficial de 09/09/2025. O personagem pode manter até duas armas adicionais no inventário de equipamento; armas não equipadas não concedem seus benefícios. Trocar armas em situação perigosa custa 1 Fadiga/Estresse; em situação calma ou durante preparação em descanso, a troca é livre.

Implementação do motor materializada no commit `52e17292a951049bff43659e3b170061a860b4f6`:

- `ficha.equipamento.reserva` nasce vazia em fichas antigas, sem migração manual;
- reserva aceita no máximo duas armas e normaliza para IDs canônicos;
- arma guardada fica separada do equipamento ativo e não participa dos derivados;
- registrar/remover armas da reserva não altera equipamento ativo;
- troca recebe a configuração final de arma primária/secundária e é atômica;
- o servidor verifica propriedade da arma, categoria, tier, mãos, exceção do Guerreiro e limite da reserva antes de alterar a ficha;
- troca perigosa marca exatamente 1 Fadiga no mesmo ajuste;
- sem Fadiga disponível, nenhuma parte da troca é aplicada;
- troca calma/preparação custa 0;
- trocar de primária de uma mão + secundária para primária de duas mãos pode acontecer em uma única ação, sem custo duplicado.

Validação real do motor: GitHub Actions run `34274144101` — backend 462/462, E2E 98/98, 14 geradores consistentes e CSS limpo.

UI materializada no commit `29ae3f0e054b72b6c8167ddb8d2f68244efc37ad`:

- a tabela principal continua com exatamente três linhas (primária, secundária, armadura);
- logo abaixo aparece o resumo `Reserva de armas X/2` e o botão `Gerenciar armas`;
- o modal permite registrar uma arma obtida pela ficção/compra da mesa, remover da reserva e escolher a configuração equipada;
- há ações explícitas `Trocar sem custo` e `Trocar agora · 1 Fadiga`;
- a UI filtra opções por nível para ergonomia, mas o servidor continua sendo a autoridade de regra.

Validação real da UI: GitHub Actions run `34275094806` — backend 462/462, **E2E 99/99**, 14 geradores consistentes e CSS limpo. O novo passo E2E registrou uma Besta na reserva, equipou-a sem custo, confirmou que o Florete voltou para a reserva e que a Fadiga não mudou.

Durante o bloco houve concorrência de outro agente na mesma branch. O executor alternativo `lote8-armas-reserva` falhou na primeira transformação (`backend/40_Regras.gs: esperava 1 ocorrência, achei 0`) porque o motor validado já estava materializado; testes/commit/push desse executor foram pulados. O workflow e transformador concorrentes foram removidos antes do run final. Nenhum código funcional externo sobrescreveu o checkpoint validado.

Estado: este bloco está implementado e validado em `ediçãoclaude`, ainda **sem deploy, PR, merge ou mudança de `ENGINE_COMMIT`**. O pin de produção permanece o dos Lotes 6/7 até o Lote 8 inteiro fechar.
EOF

          cat >> docs/AUDITORIA-CORE-1.0.md <<'EOF'

## Checkpoint de implementação — inventário e troca de armas

A regra do Core p.112 + errata foi implementada: até duas armas adicionais em reserva, sem benefícios enquanto guardadas; troca perigosa custa 1 Fadiga e troca calma/preparação é livre. O motor usa troca atômica da configuração final, inclusive para transição entre arma de uma mão + secundária e arma de duas mãos. Commits funcionais: `52e17292a951049bff43659e3b170061a860b4f6` (motor) e `29ae3f0e054b72b6c8167ddb8d2f68244efc37ad` (UI). Validação real final: run `34275094806`, backend 462/462, E2E 99/99, 14 geradores consistentes, CSS limpo. Ainda não implantado em produção.
EOF

      - name: Remover executor e transformadores temporários
        run: |
          rm -f .github/workflows/lote8-troca-armas.yml
          rm -f tools/lote8-implementar-troca-armas.py
          rm -f tools/lote8-implementar-ui-troca-armas.py

      - name: Commitar diário e limpeza
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/HANDOFF.md docs/AUDITORIA-CORE-1.0.md .github/workflows/lote8-troca-armas.yml tools/lote8-implementar-troca-armas.py tools/lote8-implementar-ui-troca-armas.py
          git commit -m 'docs: fechar checkpoint de armas de reserva do Lote 8'
          git push origin HEAD:'ediçãoclaude'
