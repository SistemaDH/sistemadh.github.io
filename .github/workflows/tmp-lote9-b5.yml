name: TEMP Lote 9 B5 contrato mobile

on:
  push:
    branches: [tmp-lote9-b5-contrato-mobile-sol]

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci

      - name: Materializar L9-B5
        run: python3 tools/tmp-lote9-b5.py

      - name: Contrato L9-B5
        run: |
          grep -F "'.ficha__subtituloBotao, .papel__caixa, .papel__esperancaPonto, .papel__slot'" tools/testes-layout-mobile.mjs
          grep -F 'controles compactos não autorizados' tools/testes-layout-mobile.mjs
          grep -F '## Lote 9 — Refino mobile e contrato visual' docs/HANDOFF.md
          grep -F '### B5 — contrato explícito para compactos intencionais' docs/HANDOFF.md

      - name: Diff limpo
        run: git diff --check

      - run: npm run teste:sintaxe
      - run: npm run teste
      - run: npm run teste:gerados
      - run: npm run teste:css

      - name: Auditoria Core 1.0 zerada
        run: |
          python3 tools/auditar-pendencias-lote8.py > /tmp/auditoria.md
          grep -F 'Classes/subclasses: **99 características**; **0** candidatas' /tmp/auditoria.md
          grep -F 'Comunidades: **9 características**; **0** candidatas' /tmp/auditoria.md
          grep -F 'Cartas de domínio: **189 cartas**; **0** candidatas' /tmp/auditoria.md
          grep -F 'Características de armas/armaduras/molduras: **203 ocorrências**; **0** ocorrências candidatas' /tmp/auditoria.md
          grep -F 'Loot/consumíveis com texto mecânico detectado: **81**; **0** candidatos' /tmp/auditoria.md

      - run: npx playwright install --with-deps chromium
      - run: npm run teste:e2e

      - name: Layout mobile com whitelist explícita
        run: npm run teste:layout-mobile

      - name: Guardar diagnóstico visual B5
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lote9-b5-layout-mobile
          path: artifacts/layout-mobile
          if-no-files-found: warn

      - name: Bloquear concorrência em newedit
        run: |
          atual=$(git ls-remote origin refs/heads/newedit | cut -f1)
          test "$atual" = 'e4f6b5fcfc2a9bd678b59c0d6548896ed5bbcb24' || {
            echo "newedit mudou: esperado e4f6b5fcfc2a9bd678b59c0d6548896ed5bbcb24, atual $atual"
            exit 1
          }

      - name: Criar commit funcional limpo
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm tools/tmp-lote9-b5.py .github/workflows/tmp-lote9-b5.yml
          git add tools/testes-layout-mobile.mjs docs/HANDOFF.md
          git diff --cached --check
          git commit -m 'test: consolidar contrato mobile L9-B5'
          git push origin HEAD:tmp-lote9-b5-contrato-mobile-sol
