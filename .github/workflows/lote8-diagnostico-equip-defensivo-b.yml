name: Lote 8 - Diagnostico Equipamento Defensivo B

on:
  push:
    branches: [tmp-lote8-equip-defensivo-b-sol]

permissions:
  contents: read

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mapear runtime final
        run: |
          echo '=== Inabalavel / pendencias no cliente ==='
          grep -Rni -B15 -A90 -E 'dadoInabalavel|pendenciaRolagem|inabalavel' js | head -n 700 || true
          echo '=== Stress / PA no backend ==='
          grep -Rni -B10 -A70 -E 'interceptadorDeEstresseDaFicha_|function aplicarAjusteComInabalavel_|function ajustarRecurso_' backend/4C_Ajustes.gs backend/42_Classes.gs backend/43_Origens.gs 2>/dev/null | head -n 650 || true
          echo '=== refs de contador ==='
          sed -n '470,530p' tools/gerar-47-contadores.mjs
