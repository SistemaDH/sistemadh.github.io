name: Lote 8 - Diagnostico Equipamento Defensivo B

on:
  push:
    branches: [tmp-lote8-equip-defensivo-b-sol]

permissions:
  contents: read

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mapear catalogo e runtime
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('data/equipamentos.json',encoding='utf-8'))
          ingles={'Hopeful','Resilient','Shifting','Impenetrable','Magical','Painful','Timeslowing','Deflecting'}
          nomes={'Esperançoso','Resiliente','Deslocamento','Impenetrável','Mágica','Doloroso','Temporal','Desafetação'}
          for grupo in ('armas','armaduras'):
            for x in d.get(grupo,[]):
              c=x.get('caracteristica') or {}
              if c.get('nomeIngles') in ingles or c.get('nome') in nomes:
                print(json.dumps({'grupo':grupo,'id':x.get('id'),'nome':x.get('nome'),'tier':x.get('tier'),'pontuacao':x.get('pontuacaoArmadura'),'caracteristica':c},ensure_ascii=False))
          PY
          echo '=== refs de contador ==='
          grep -Rni -B10 -A120 'function refsDeContadorDaFicha_' tools/gerar-47-contadores.mjs backend/47_Contadores.gs || true
          echo '=== dono do contador ==='
          grep -Rni -B10 -A80 'function contadorEDaFicha_' tools/gerar-47-contadores.mjs backend/47_Contadores.gs || true
          echo '=== ajuste de recurso / estresse cheio ==='
          grep -n -B12 -A125 'function ajustarRecurso_' backend/4C_Ajustes.gs || true
          grep -Rni -B8 -A45 -E 'Estresse cheio|não pode marcar.*Estresse|pode marcar.*PV|sincronizarVulneravelPorEstresse_' backend/4C_Ajustes.gs backend/40_Regras.gs backend/48_Criacao.gs || true
