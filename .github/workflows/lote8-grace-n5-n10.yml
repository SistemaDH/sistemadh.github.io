name: Lote 8 - Graca N5-N10

on:
  push:
    branches: [tmp-lote8-grace-n5-n10-sol]

permissions:
  contents: write

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materializar Graca N5-N10
        run: |
          python3 tools/lote8-grace-n5-n10.py
          node tools/gerar-41-dominios.mjs
          node tools/gerar-47-contadores.mjs
          node tools/gerar-4B-descanso.mjs
          git diff --check

      - name: Conferir classificacao, especiais e auditoria
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('data/cartas-dominio.json',encoding='utf-8'))
          ids={
            'grace-mergulhador-de-pensamentos','grace-words-of-discord','grace-nunca-ofuscado','grace-share-the-burden',
            'grace-carisma-infinito','grace-tocado-pela-graca','grace-enfeiticar-em-massa','grace-projecao-astral',
            'grace-imitador','grace-mestre-do-oficio','grace-notorio','grace-reprise'
          }
          xs=[c for c in d['cartas'] if c['id'] in ids]
          assert len(xs)==12, len(xs)
          assert all(c.get('automacao') for c in xs), [c['id'] for c in xs if not c.get('automacao')]
          assert all((c.get('resolucaoManual') or {}).get('rolaNoApp') is False for c in xs)
          n=next(c for c in xs if c['id']=='grace-notorio')
          assert n['regraEspecial']['loadout']['naoContaNoLimite'] is True
          assert n['regraEspecial']['loadout']['naoPodeIrAoCofre'] is True
          assert n['regraEspecial']['compra']['descontoBolsas']==1
          cont=json.load(open('data/contadores.json',encoding='utf-8'))['contadores']
          assert len(cont)==114, len(cont)
          keys={x['chave'] for x in cont}
          for k in [
            'uso:carta:grace:partilhar-o-fardo','uso:carta:grace:projecao-astral','estado:carta:grace:projecao-astral',
            'uso:carta:grace:imitador','estado:carta:grace:imitador'
          ]: assert k in keys, k
          PY
          python3 tools/auditar-pendencias-lote8.py > /tmp/auditoria-lote8.md
          if grep -Eq '^\| Graça \| (5|6|7|8|9|10) \|' /tmp/auditoria-lote8.md; then
            echo 'Ainda ha Graca N5-N10 candidata sem sinal especifico:'
            grep -E '^\| Graça \| (5|6|7|8|9|10) \|' /tmp/auditoria-lote8.md
            exit 1
          fi
          grep -q 'REGRAS_ESPECIAIS_CARTAS_DOMINIO' backend/41_Dominios.gs
          grep -q 'grace-notorio' backend/41_Dominios.gs
          grep -q 'uso:carta:grace:imitador' backend/47_Contadores.gs

      - name: Testes backend
        shell: bash
        run: |
          set -o pipefail
          node tools/testes-backend.mjs | tee /tmp/backend.log
          ! grep -q '✗' /tmp/backend.log
          tail -n 24 /tmp/backend.log

      - name: Instalar Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install chromium

      - name: Testes E2E
        run: node tools/testes-e2e.mjs

      - name: Conferir gerados e CSS
        run: |
          node tools/conferir-gerados.mjs
          node tools/conferir-css.mjs
          git diff --check

      - name: Proteger contra concorrencia
        run: |
          git fetch origin 'ediçãoclaude'
          test "$(git rev-parse 'origin/ediçãoclaude')" = '4d2279df5d9160934f5f5f9386d0ee148cf0698a'

      - name: Commitar funcional e limpar temporarios
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f --ignore-unmatch tools/lote8-grace-n5-n10.py
          git rm -f --ignore-unmatch .github/workflows/lote8-grace-n5-n10.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          git add -A
          git diff --cached --check
          git commit -m 'feat: revisar Graça níveis 5 a 10 [lote8-generated]'
          git push origin HEAD:tmp-lote8-grace-n5-n10-sol
