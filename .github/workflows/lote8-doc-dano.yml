name: Lote 8 - docs dano

on:
  push:
    branches:
      - 'ediçãoclaude'

permissions:
  contents: write

jobs:
  registrar:
    if: ${{ contains(github.event.head_commit.message, '[run-lote8-doc-dano]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'ediçãoclaude'
          fetch-depth: 0

      - name: Registrar checkpoint
        run: |
          python3 tools/lote8-doc-dano.py
          git diff --check

      - name: Proteger contra concorrência
        run: |
          git fetch origin 'ediçãoclaude'
          test "$(git rev-parse 'origin/ediçãoclaude')" = "$GITHUB_SHA"

      - name: Commitar docs e limpar temporários
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm tools/lote8-doc-dano.py
          git rm .github/workflows/lote8-doc-dano.yml
          git add docs/HANDOFF.md docs/AUDITORIA-CORE-1.0.md
          git diff --cached --check
          git commit -m 'docs: registrar dano de ancestralidades do Lote 8'
          git push origin HEAD:'ediçãoclaude'
