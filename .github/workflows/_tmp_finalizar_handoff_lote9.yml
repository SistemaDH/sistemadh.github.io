name: finalizar-handoff-lote9

on:
  push:
    branches:
      - docs/fechamento-lote9

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'run-handoff-docs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/fechamento-lote9
          fetch-depth: 0
      - name: Atualizar HANDOFF
        run: python3 tools/_tmp_finalizar_handoff_lote9.py
      - name: Validar fechamento
        run: |
          grep -F '## Fechamento operacional — Lote 9 em produção' docs/HANDOFF.md
          grep -F '945 passaram, 0 falharam' docs/HANDOFF.md
          grep -F 'ENGINE_COMMIT' docs/HANDOFF.md
      - name: Remover temporarios e commitar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_tmp_finalizar_handoff_lote9.yml tools/_tmp_finalizar_handoff_lote9.py
          git add docs/HANDOFF.md
          git commit -m "docs: registrar fechamento operacional do Lote 9"
          git push origin HEAD:docs/fechamento-lote9
