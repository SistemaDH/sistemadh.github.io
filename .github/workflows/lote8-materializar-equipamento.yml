name: Lote 8 - fechar executor temporario

on:
  push:
    branches:
      - 'ediçãoclaude'

permissions:
  contents: write

jobs:
  fechar:
    if: ${{ contains(github.event.head_commit.message, '[cleanup-lote8]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'ediçãoclaude'
          fetch-depth: 0

      - name: Registrar checkpoint e remover temporários
        run: python3 tools/lote8-fechar-checkpoint.py

      - name: Commitar diário e limpeza
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: fechar checkpoint validado de equipamento do Lote 8'
          git push origin HEAD:'ediçãoclaude'
