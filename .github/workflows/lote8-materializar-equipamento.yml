name: Lote 8 - materializar equipamento

on:
  push:
    branches:
      - 'ediçãoclaude'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  equipamento:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message || '', '[run-lote8]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'ediçãoclaude'
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restaurar E2E bom e aplicar espera explícita da arte
        run: |
          git show e29b414ee3b16ebd8dc6a9d0a5200ccf260505d6:tools/testes-e2e.mjs > tools/testes-e2e.mjs
          python3 tools/lote8-corrigir-e2e-arte.py

      - name: Materializar correções do catálogo e testes
        run: |
          python3 tools/auditoria-equipamento.py
          python3 tools/lote8-adicionar-cadeiras.py
          python3 tools/lote8-atualizar-testes-equipamento.py
          node tools/gerar-44-equipamento.mjs
          python3 tools/conferir-equipamento-lote8.py
          node tools/conferir-gerados.mjs

      - name: Instalar dependências de teste
        run: |
          npm install --ignore-scripts
          npx playwright install --with-deps chromium

      - name: Testes do backend
        run: node tools/testes-backend.mjs

      - name: Testes E2E
        run: node tools/testes-e2e.mjs

      - name: Conferência CSS
        run: node tools/conferir-css.mjs

      - name: Commitar somente materialização validada
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/equipamentos.json data/equipamentos-correcoes.json backend/44_Equipamento.gs tools/testes-backend.mjs tools/testes-e2e.mjs
          if git diff --cached --quiet; then
            echo 'Nenhuma materialização pendente.'
          else
            git commit -m 'chore: materializar equipamento do Lote 8 [lote8-generated]'
            git push origin HEAD:'ediçãoclaude'
          fi
