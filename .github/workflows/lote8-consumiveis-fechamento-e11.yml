name: Lote 8 - Fechamento de Consumiveis E11

on:
  push:
    branches:
      - tmp-lote8-consumiveis-fechamento-e11-sol

permissions:
  contents: write

jobs:
  validar-e-materializar:
    runs-on: ubuntu-latest
    env:
      BASE_SHA: 2cab479c21403a37cd6517f5b3742c348da218d2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Materializar E11
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/lote8-consumiveis-fechamento-e11.py
          node tools/gerar-44-equipamento.mjs
          node tools/gerar-47-contadores.mjs
          node tools/gerar-48-criacao.mjs
          node tools/gerar-41-dominios.mjs
          node tools/gerar-4B-descanso.mjs
          python3 tools/auditar-pendencias-lote8.py > docs/AUDITORIA-FINAL-LOTE8.md
          python3 - <<'PY'
          from pathlib import Path
          for nome in ('docs/AUDITORIA-FINAL-LOTE8.md', 'docs/HANDOFF.md'):
              p = Path(nome)
              p.write_text(p.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')
          PY
          git diff --check
          node --check js/telas/ficha.js

      - name: Validar contratos E11
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re, subprocess
          from pathlib import Path

          eq=json.load(open('data/equipamentos.json',encoding='utf-8'))
          xs={x['id']:x for x in eq.get('consumiveis',[])}
          ids=['consumivel-34','consumivel-37','consumivel-38','consumivel-40','consumivel-55']
          for ident in ids:
              assert xs[ident].get('automacao'), ident
              assert xs[ident].get('efeitoConsumivel'), ident
              assert xs[ident]['automacao'].get('rolaNoApp') is False, ident
          assert xs['consumivel-40']['efeitoConsumivel']['custoEstresse'] == 1
          assert xs['consumivel-55']['efeitoConsumivel']['exigeFichaEncerrada'] is True

          backend=Path('backend/4C_Ajustes.gs').read_text(encoding='utf-8')
          assert 'custoEstresseManual' in backend
          assert 'exigeFichaEncerrada' in backend
          frontend=Path('js/telas/ficha.js').read_text(encoding='utf-8')
          assert 'efeitoConsumivel.exigeFichaEncerrada' in frontend

          out=subprocess.check_output(['python3','tools/auditar-pendencias-lote8.py'],text=True)
          assert '- Loot/consumíveis com texto mecânico detectado: **81**; **33** candidatos ainda sem estrutura/classificação.' in out
          candidatos=[]
          for linha in out.splitlines():
              if linha.startswith('| consumiveis |') and '| candidato mecânico |' in linha:
                  candidatos.append(linha)
          assert not candidatos, '\n'.join(candidatos)
          print('Contratos E11 e auditoria de consumíveis: OK')
          PY

      - name: Testes backend
        shell: bash
        run: |
          set -euo pipefail
          node tools/testes-backend.mjs | tee /tmp/testes-backend.log
          if grep -q '✗' /tmp/testes-backend.log; then
            echo 'Falha textual detectada nos testes backend.' >&2
            exit 1
          fi

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Testes E2E
        shell: bash
        run: |
          set -euo pipefail
          node tools/testes-e2e.mjs | tee /tmp/testes-e2e.log
          if grep -q '✗' /tmp/testes-e2e.log; then
            echo 'Falha textual detectada nos testes E2E.' >&2
            exit 1
          fi

      - name: Conferir gerados e CSS
        shell: bash
        run: |
          set -euo pipefail
          node tools/conferir-gerados.mjs
          node tools/conferir-css.mjs
          git diff --check

      - name: Bloqueio de concorrencia
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin 'refs/heads/ediçãoclaude:refs/remotes/origin/ediçãoclaude'
          ATUAL="$(git rev-parse 'origin/ediçãoclaude')"
          echo "ediçãoclaude atual: $ATUAL"
          echo "base fixada:        $BASE_SHA"
          test "$ATUAL" = "$BASE_SHA"

      - name: Commit funcional E11
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/lote8-consumiveis-fechamento-e11.py
          rm -f .github/workflows/lote8-consumiveis-fechamento-e11.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Nenhuma mudança funcional para gravar.' >&2
            exit 1
          fi
          git commit -m 'feat: fechar consumiveis restantes E11'
          git push origin HEAD:tmp-lote8-consumiveis-fechamento-e11-sol
