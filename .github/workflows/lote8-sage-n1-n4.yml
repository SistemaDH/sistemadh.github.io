name: Lote 8 - Sabio N1-N4

on:
  push:
    branches: [tmp-lote8-sage-n1-n4-sol]

permissions:
  contents: write

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materializar Sabio N1-N4
        run: |
          python3 tools/lote8-sage-n1-n4.py
          node tools/gerar-41-dominios.mjs
          node tools/gerar-47-contadores.mjs
          node tools/gerar-4B-descanso.mjs
          git diff --check

      - name: Conferir classificacao e auditoria
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('data/cartas-dominio.json',encoding='utf-8'))
          ids={
            'sage-emaranhado-cruel','sage-lingua-da-natureza','sage-rastreador-habilidoso',
            'sage-conjurar-enxame','sage-familiar-natural','sage-caule-imponente',
            'sage-projetil-corrosivo','sage-aperto-da-morte','sage-campo-de-cura'
          }
          xs=[c for c in d['cartas'] if c['id'] in ids]
          assert len(xs)==9, len(xs)
          assert all(c.get('automacao') for c in xs), [c['id'] for c in xs if not c.get('automacao')]
          assert all((c.get('resolucaoManual') or {}).get('rolaNoApp') is False for c in xs)
          cont=json.load(open('data/contadores.json',encoding='utf-8'))['contadores']
          assert len(cont)==125, len(cont)
          keys={x['chave'] for x in cont}
          for k in ['estado:carta:sage:conjurar-enxame:besouros','estado:carta:sage:familiar-natural','uso:carta:sage:caule-imponente','uso:carta:sage:campo-de-cura']:
            assert k in keys, k
          PY
          python3 tools/auditar-pendencias-lote8.py > /tmp/auditoria-lote8.md
          if grep -Eq '^\| Sábio \| (1|2|3|4) \|' /tmp/auditoria-lote8.md; then
            echo 'Ainda ha Sabio N1-N4 candidato sem sinal especifico:'
            grep -E '^\| Sábio \| (1|2|3|4) \|' /tmp/auditoria-lote8.md
            exit 1
          fi
          grep -q 'sage-emaranhado-cruel' backend/41_Dominios.gs
          grep -q 'estado:carta:sage:familiar-natural' backend/47_Contadores.gs

      - name: Testes backend
        shell: bash
        run: |
          set -o pipefail
          node tools/testes-backend.mjs | tee /tmp/backend.log
          ! grep -q '✗' /tmp/backend.log
          tail -n 28 /tmp/backend.log

      - name: Instalar Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install chromium

      - name: Testes E2E
        run: node tools/testes-e2e.mjs

      - name: Conferir gerados e CSS
        run: |
          node tools/conferir-gerados.mjs
          node tools/conferir-css.mjs
          git diff --check

      - name: Proteger contra concorrencia
        run: |
          git fetch origin 'ediçãoclaude'
          test "$(git rev-parse 'origin/ediçãoclaude')" = 'b9ffc2c67ed62a2e756b33fbc882e123e8f9ded2'

      - name: Commitar funcional e limpar temporarios
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f --ignore-unmatch tools/lote8-sage-n1-n4.py
          git rm -f --ignore-unmatch .github/workflows/lote8-sage-n1-n4.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          git add -A
          git diff --cached --check
          git commit -m 'feat: revisar Sábio níveis 1 a 4 [lote8-generated]'
          git push origin HEAD:tmp-lote8-sage-n1-n4-sol
