name: Lote 8 - Equipamento Defensivo B1

on:
  push:
    branches: [tmp-lote8-equip-defensivo-b-sol]

permissions:
  contents: write

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materializar equipamento defensivo B1
        run: |
          python3 tools/lote8-equip-defensivo-b1.py
          python3 tools/lote8-equip-defensivo-b1-fix.py
          node tools/gerar-44-equipamento.mjs
          node tools/gerar-41-dominios.mjs
          node tools/gerar-47-contadores.mjs
          node tools/gerar-4B-descanso.mjs
          cp backend/4C_Ajustes.gs /tmp/4C_Ajustes.js
          cp backend/47_Contadores.gs /tmp/47_Contadores.js
          node --check /tmp/4C_Ajustes.js
          node --check /tmp/47_Contadores.js
          node --check js/telas/ficha.js
          git diff --check

      - name: Auditar estrutura
        run: |
          python3 - <<'PY'
          import json
          e=json.load(open('data/equipamentos.json',encoding='utf-8'))
          c=json.load(open('data/contadores.json',encoding='utf-8'))
          itens=[*e.get('armas',[]),*e.get('armaduras',[])]
          feats={}
          for x in itens:
            car=x.get('caracteristica') or {}
            feats.setdefault(car.get('nome'),[]).append((x,car))
          assert len(feats.get('Magia',[]))==1
          assert len(feats.get('Doloroso',[]))==3
          assert len(feats.get('Resiliente',[]))==1
          assert len(feats.get('Impenetrável',[]))==1
          for nome in ('Magia','Resiliente','Impenetrável'):
            assert feats[nome][0][1].get('automacao'), nome
            assert feats[nome][0][1].get('efeitoEquipamento'), nome
          for _,car in feats['Doloroso']:
            assert car.get('automacao') and car.get('efeitoEquipamento')
          assert len(c['contadores'])==146, len(c['contadores'])
          eq=[x for x in c['contadores'] if x.get('origem')=='equipamento']
          assert len(eq)==1, len(eq)
          assert eq[0]['chave']=='uso:equipamento:armadura-t3-armadura-de-escamas-de-dragao:impenetravel'
          assert eq[0]['zeraEm']==['descanso']
          PY
          python3 tools/auditar-pendencias-lote8.py > /tmp/auditoria.md
          ! grep -Eq '^\| (Magia|Doloroso|Resiliente|Impenetrável) \|' /tmp/auditoria.md
          grep -q 'function efeitosAoMarcarArmaduraDeEquipamento_' backend/4C_Ajustes.gs
          grep -q 'function regraResilienteDaArmadura_' backend/4C_Ajustes.gs
          grep -q 'function regraImpenetravelDaArmadura_' backend/4C_Ajustes.gs
          grep -q 'inabalavel-multiplo' backend/4C_Ajustes.gs
          grep -q 'inabalavel-multiplo' js/telas/ficha.js

      - name: Testes backend
        shell: bash
        run: |
          set -o pipefail
          node tools/testes-backend.mjs | tee /tmp/backend.log
          ! grep -q '✗' /tmp/backend.log
          grep -q 'Lote 8 — equipamento defensivo B1' /tmp/backend.log
          grep -q 'duas fontes Doloroso pedem dois Inabalável' /tmp/backend.log
          tail -n 85 /tmp/backend.log

      - name: Instalar Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install chromium

      - name: Testes E2E
        run: node tools/testes-e2e.mjs

      - name: Conferir gerados e CSS
        run: |
          node tools/conferir-gerados.mjs
          node tools/conferir-css.mjs
          git diff --check

      - name: Proteger contra concorrencia
        run: |
          git fetch origin 'ediçãoclaude'
          test "$(git rev-parse 'origin/ediçãoclaude')" = '084b97f31967d01fa14f4b9f405094797cd6cf81'

      - name: Commitar funcional e limpar temporarios
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f --ignore-unmatch tools/lote8-equip-defensivo-b1.py
          git rm -f --ignore-unmatch tools/lote8-equip-defensivo-b1-fix.py
          git rm -f --ignore-unmatch .github/workflows/lote8-equip-defensivo-b1.yml
          git rm -f --ignore-unmatch .github/workflows/lote8-diagnostico-equip-defensivo-b.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          git add -A
          git diff --cached --check
          git commit -m 'feat: automatizar Magia, Doloroso, Resiliente e Impenetrável [lote8-generated]'
          git push origin HEAD:tmp-lote8-equip-defensivo-b-sol
