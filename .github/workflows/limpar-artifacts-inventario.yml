name: Limpar artifacts do inventário
on:
  push:
    branches: [inventario-integracao]
permissions:
  contents: write
jobs:
  limpar:
    if: contains(github.event.head_commit.message, 'limpar artifacts antes da promoção')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: inventario-integracao
          fetch-depth: 0
      - name: Remover saídas locais de testes
        run: rm -rf artifacts
      - name: Gravar limpeza e remover workflow temporário
        run: |
          rm .github/workflows/limpar-artifacts-inventario.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remover artifacts gerados dos testes"
          git push origin HEAD:inventario-integracao
