name: Lote 8 - Loot Ativo E12

on:
  push:
    branches:
      - tmp-lote8-loot-ativos-e12-sol

permissions:
  contents: write

concurrency:
  group: lote8-loot-ativos-e12-sol
  cancel-in-progress: false

env:
  BASE_SHA: e2932286d71434495967656d8d2905fe6bc62282

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materializar E12 e regenerar índices
        run: |
          set -euo pipefail
          python3 tools/lote8-loot-ativos-e12.py
          node tools/gerar-44-equipamento.mjs
          node tools/gerar-47-contadores.mjs
          python3 tools/auditar-pendencias-lote8.py > docs/AUDITORIA-FINAL-LOTE8.md
          git diff --check
          node --check js/telas/ficha.js

      - name: Validar contratos E12 e auditoria
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re
          from pathlib import Path

          eq=json.load(open('data/equipamentos.json',encoding='utf-8'))
          xs={x['id']:x for x in eq.get('loot',[])}
          ids=['loot-09','loot-11','loot-21','loot-27','loot-28','loot-38']
          for ident in ids:
              x=xs[ident]
              assert x.get('automacao'), ident
              assert x['automacao'].get('rolaNoApp') is False, ident
              assert x.get('efeitoSaque'), ident
          assert xs['loot-11']['efeitoSaque']['custoEsperanca']==1
          assert xs['loot-21']['efeitoSaque']['bonusRolagem']=='vantagem'
          assert xs['loot-27']['efeitoSaque']['custoEstresse']==1
          assert xs['loot-28']['efeitoSaque']['contadorEstado']=='estado:loot:loot-28'
          assert xs['loot-38']['efeitoSaque']['contadorUso']=='uso:loot:loot-38'
          assert xs['loot-38']['efeitoSaque']['contadorEstado']=='estado:loot:loot-38'

          co=json.load(open('data/contadores.json',encoding='utf-8'))
          assert len(co.get('contadores',[]))==179, len(co.get('contadores',[]))
          ch={x['chave'] for x in co['contadores']}
          esperados={
              'uso:loot:loot-09','uso:loot:loot-21','estado:loot:loot-28',
              'uso:loot:loot-38','estado:loot:loot-38'
          }
          assert esperados <= ch, esperados-ch

          b44=Path('backend/44_Equipamento.gs').read_text(encoding='utf-8')
          assert '"efeitoSaque"' in b44
          assert '"uso:loot:loot-38"' in b44
          b4c=Path('backend/4C_Ajustes.gs').read_text(encoding='utf-8')
          assert 'function usarSaqueDaMochila_' in b4c
          assert "if (acao === 'usar') return usarSaqueDaMochila_" in b4c
          front=Path('js/telas/ficha.js').read_text(encoding='utf-8')
          assert 'podeUsarSaque' in front
          assert "acao:'usar'" in front

          audit=Path('docs/AUDITORIA-FINAL-LOTE8.md').read_text(encoding='utf-8')
          for ident in ids:
              nome=xs[ident]['nome']
              assert f'| loot | {nome} | candidato mecânico |' not in audit, nome
          m=re.search(r'Loot/consumíveis com texto mecânico detectado: \*\*(\d+)\*\*; \*\*(\d+)\*\* candidatos',audit)
          assert m, 'resumo de loot não encontrado na auditoria'
          assert int(m.group(2))==27, m.group(0)
          print('E12 contratos OK; candidatos restantes:',m.group(2))
          PY

      - name: Testes backend completos
        run: node tools/testes-backend.mjs

      - name: Instalar dependências
        run: npm ci

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Testes E2E completos
        run: node tools/testes-e2e.mjs

      - name: Conferir gerados e CSS
        run: |
          set -euo pipefail
          node tools/conferir-gerados.mjs
          node tools/conferir-css.mjs
          git diff --check

      - name: Trava de concorrência da edicaoclaude
        run: |
          set -euo pipefail
          git fetch origin 'refs/heads/ediçãoclaude:refs/remotes/origin/ediçãoclaude'
          ATUAL="$(git rev-parse 'origin/ediçãoclaude')"
          echo "ediçãoclaude atual: $ATUAL"
          echo "base esperada:      $BASE_SHA"
          test "$ATUAL" = "$BASE_SHA"

      - name: Criar commit funcional e limpar arquivos temporários
        run: |
          set -euo pipefail
          rm tools/lote8-loot-ativos-e12.py
          rm .github/workflows/lote8-loot-ativos-e12.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo 'Nenhuma alteração funcional para commitar.'; exit 1; }
          git commit -m 'feat: integrar loot ativo reutilizavel E12'
          git push origin HEAD
