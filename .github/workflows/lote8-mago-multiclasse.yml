name: Lote 8 - Mago multiclasse

on:
  push:
    branches:
      - tmp-lote8-mago-multiclasse
    paths:
      - 'tools/lote8-mago-multiclasse.py'
      - '.github/workflows/lote8-mago-multiclasse.yml'

permissions:
  contents: write

jobs:
  validar:
    if: contains(github.event.head_commit.message, '[run-lote8-mago-multiclasse]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar patch
        run: python3 tools/lote8-mago-multiclasse.py

      - name: Checker de classes e diff
        run: |
          python3 tools/conferir-classes-lote8.py
          git diff --check

      - name: Testes backend
        run: node tools/testes-backend.mjs

      - name: Instalar Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium

      - name: Testes E2E
        run: node tools/testes-e2e.mjs

      - name: Conferir gerados e CSS
        run: |
          node tools/conferir-gerados.mjs
          node tools/conferir-css.mjs

      - name: Auditoria transversal continua em 12 candidatos de classe
        run: |
          python3 tools/auditar-pendencias-lote8.py > /tmp/auditoria.md
          grep -F 'Classes/subclasses: **99 características**; **12** candidatas sem sinal de automação.' /tmp/auditoria.md

      - name: Proteger contra concorrencia
        run: |
          git fetch origin 'tmp-lote8-mago-multiclasse'
          test "$(git rev-parse 'origin/tmp-lote8-mago-multiclasse')" = "$GITHUB_SHA"

      - name: Commitar funcional e limpar temporarios
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f tools/lote8-mago-multiclasse.py
          git rm -f .github/workflows/lote8-mago-multiclasse.yml
          git add -A
          git diff --cached --check
          git commit -m 'fix: completar Preparado na multiclasse [lote8-generated]'
          git push origin HEAD:'tmp-lote8-mago-multiclasse'
