name: Lote 8 - Receitas E16

on:
  push:
    branches:
      - tmp-lote8-receitas-e16-sol

permissions:
  contents: write

concurrency:
  group: lote8-receitas-e16-sol
  cancel-in-progress: false

env:
  BASE_SHA: ea4b572403a75748ca96d91305d7367c5c005372

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materializar E16 e regenerar
        run: |
          set -euo pipefail
          python3 tools/lote8-receitas-e16.py
          node tools/gerar-44-equipamento.mjs
          node tools/gerar-4B-descanso.mjs
          python3 tools/auditar-pendencias-lote8.py > docs/AUDITORIA-FINAL-LOTE8.md
          git diff --check
          node --check js/telas/descanso.js

      - name: Validar contratos e auditoria E16
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          eq=json.load(open('data/equipamentos.json',encoding='utf-8'))
          xs={x['id']:x for x in eq.get('loot',[])}
          esperado={'loot-18':'consumivel-08','loot-19':'consumivel-07','loot-24':'consumivel-16','loot-51':'consumivel-35'}
          for rid,cid in esperado.items():
              a=xs[rid]['automacao']; r=xs[rid]['efeitoSaquePassivo']['movimentoRepouso']
              assert a['classificacao']=='loot-receita-movimento-repouso-e16',rid
              assert a['rolaNoApp'] is False,rid
              assert r['criaItemId']==cid,rid
              assert r['tipos']==['curto','longo'],rid
          assert xs['loot-24']['efeitoSaquePassivo']['movimentoRepouso']['custoEstresse']==1
          b44=Path('backend/44_Equipamento.gs').read_text(encoding='utf-8')
          for rid,cid in esperado.items():
              assert rid in b44 and cid in b44
          b4b=Path('backend/4B_Descanso.gs').read_text(encoding='utf-8')
          assert "modo: 'criar-consumivel'" in b4b
          assert "receitasVistas" in b4b
          assert "itemCriado" in b4b
          audit=Path('docs/AUDITORIA-FINAL-LOTE8.md').read_text(encoding='utf-8')
          for rid in esperado:
              assert f"| loot | {xs[rid]['nome']} | candidato mecânico |" not in audit,rid
          m=re.search(r'Loot/consumíveis com texto mecânico detectado: \*\*(\d+)\*\*; \*\*(\d+)\*\* candidatos',audit)
          assert m and int(m.group(2))==13,(m.group(0) if m else 'sem resumo')
          print('E16 contratos OK; candidatos restantes:',m.group(2))
          PY

      - name: Testes backend completos
        run: node tools/testes-backend.mjs

      - name: Instalar dependências
        run: npm ci

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Testes E2E completos
        run: node tools/testes-e2e.mjs

      - name: Conferir gerados e CSS
        run: |
          set -euo pipefail
          node tools/conferir-gerados.mjs
          node tools/conferir-css.mjs
          git diff --check

      - name: Trava de concorrência
        run: |
          set -euo pipefail
          git fetch origin 'refs/heads/ediçãoclaude:refs/remotes/origin/ediçãoclaude'
          ATUAL="$(git rev-parse 'origin/ediçãoclaude')"
          echo "ediçãoclaude atual: $ATUAL"
          echo "base esperada:      $BASE_SHA"
          test "$ATUAL" = "$BASE_SHA"

      - name: Criar commit funcional e limpar temporários
        run: |
          set -euo pipefail
          rm tools/lote8-receitas-e16.py
          rm .github/workflows/lote8-receitas-e16.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo 'Nenhuma alteração funcional para commitar.'; exit 1; }
          git commit -m 'feat: integrar receitas de repouso E16'
          git push origin HEAD
