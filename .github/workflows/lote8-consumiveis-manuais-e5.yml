name: Lote 8 - Consumiveis Manuais E5

on:
  push:
    branches: [tmp-lote8-consumiveis-manuais-e5-sol]

permissions:
  contents: write

env:
  BASE_SHA: 9d1c3c26eddd7e9111c6c72c7a5633acea6ba55f

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materializar consumiveis E5
        run: |
          python3 tools/lote8-consumiveis-manuais-e5.py
          node tools/gerar-44-equipamento.mjs
          node tools/gerar-47-contadores.mjs
          node tools/gerar-48-criacao.mjs
          node tools/gerar-41-dominios.mjs
          node tools/gerar-4B-descanso.mjs
          python3 -c "from pathlib import Path; p=Path('docs/HANDOFF.md'); p.write_text(p.read_text(encoding='utf-8').rstrip()+'\n',encoding='utf-8')"
          git diff --check
          node --check js/telas/ficha.js

      - name: Conferir catalogo e auditoria E5
        run: |
          python3 - <<'PY'
          import json, subprocess
          ids={'consumivel-12','consumivel-17','consumivel-23','consumivel-24','consumivel-31','consumivel-42','consumivel-47','consumivel-48','consumivel-49','consumivel-57','consumivel-60'}
          eq=json.load(open('data/equipamentos.json',encoding='utf-8'))
          xs={x['id']:x for x in eq.get('consumiveis',[]) if x.get('id') in ids}
          assert set(xs)==ids,(set(xs),ids)
          for ident,x in xs.items():
              assert x.get('automacao',{}).get('classificacao')=='consumivel-resolucao-manual-e5',ident
              assert x.get('automacao',{}).get('rolaNoApp') is False,ident
              ef=x.get('efeitoConsumivel') or {}
              assert ef.get('tipo')=='consumir-e-resolver-na-mesa',ident
              assert ef.get('efeitoManual'),ident
          out=subprocess.check_output(['python3','tools/auditar-pendencias-lote8.py'],text=True)
          print(out)
          for x in xs.values():
              linha='| consumiveis | '+x['nome']+' | candidato mecânico |'
              assert linha not in out,linha
          print('E5 OK: 11 consumíveis externos classificados e nenhum segue como candidato mecânico.')
          PY
          grep -q "consumir-e-resolver-na-mesa" backend/4C_Ajustes.gs
          grep -q "efeitoManual:efeito.efeitoManual" backend/4C_Ajustes.gs

      - name: Testes backend
        run: node tools/testes-backend.mjs

      - name: Instalar Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Testes E2E
        run: node tools/testes-e2e.mjs

      - name: Conferir gerados e CSS
        run: |
          node tools/conferir-gerados.mjs
          node tools/conferir-css.mjs
          git diff --check

      - name: Proteger contra concorrencia
        run: |
          git fetch origin 'refs/heads/ediçãoclaude:refs/remotes/origin/ediçãoclaude'
          ATUAL="$(git rev-parse 'origin/ediçãoclaude')"
          echo "ediçãoclaude atual: $ATUAL"
          echo "base esperada:       $BASE_SHA"
          test "$ATUAL" = "$BASE_SHA"

      - name: Commitar funcional e limpar temporarios
        run: |
          rm tools/lote8-consumiveis-manuais-e5.py
          rm .github/workflows/lote8-consumiveis-manuais-e5.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo 'Nenhuma mudança funcional para commit.'; exit 1; } || true
          git commit -m 'feat: classificar consumiveis de resolucao manual'
          git push origin HEAD:tmp-lote8-consumiveis-manuais-e5-sol
