name: TEMP Lote 9 B13 criacao mobile

on:
  push:
    branches: [tmp-lote9-b13-criacao-mobile-sol]

permissions:
  contents: read

jobs:
  medir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Criacao mobile 360 / 390 / 430
        run: npm run teste:layout-criacao-mobile
      - name: Guardar diagnostico da criacao mobile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lote9-b13-criacao-mobile
          path: artifacts/layout-criacao-mobile
          if-no-files-found: warn
