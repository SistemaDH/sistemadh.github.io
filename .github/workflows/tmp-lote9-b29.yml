name: tmp Lote 9 B29 HANDOFF

on:
  push:
    branches:
      - tmp-lote9-b29-handoff-sol
    paths:
      - .github/workflows/tmp-lote9-b29.yml

permissions:
  contents: write

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sincronizar HANDOFF até B28
        shell: bash
        env:
          B29_ADDITION_B64: 
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          path = Path('docs/HANDOFF.md')
          text = path.read_text(encoding='utf-8')
          marker = '### Contrato permanente do Lote 9'
          guard = '### B28 — feedback transitório respeita o contexto da ficha'
          if guard not in text:
              if marker not in text:
                  raise SystemExit('marcador do contrato permanente do Lote 9 não encontrado')
              addition = base64.b64decode(os.environ['B29_ADDITION_B64']).decode('utf-8')
              text = text.replace(marker, addition.rstrip() + '\n\n' + marker, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Validar continuidade documentada
        shell: bash
        run: |
          grep -F '### B28 — feedback transitório respeita o contexto da ficha' docs/HANDOFF.md
          grep -F 'c1477bb0879efebaa27cc2b617f6bfbffd4b7d2a' docs/HANDOFF.md
          grep -F 'teste:layout-toast-contexto-mobile' docs/HANDOFF.md
          grep -F 'teste:layout-mochila-em-uso-mobile' docs/HANDOFF.md
          grep -F 'scroller horizontal intencional' docs/HANDOFF.md
          grep -F 'diff final do B29 deve conter apenas `docs/HANDOFF.md`' docs/HANDOFF.md

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run teste:sintaxe
      - run: npm run teste
      - run: npm run teste:gerados
      - run: npm run teste:css
      - name: Auditoria Core 1.0 zerada
        shell: bash
        run: |
          python3 tools/auditar-pendencias-lote8.py > /tmp/auditoria.md
          grep -F 'Classes/subclasses: **99 características**; **0** candidatas' /tmp/auditoria.md
          grep -F 'Comunidades: **9 características**; **0** candidatas' /tmp/auditoria.md
          grep -F 'Cartas de domínio: **189 cartas**; **0** candidatas' /tmp/auditoria.md
          grep -F 'Características de armas/armaduras/molduras: **203 ocorrências**; **0** ocorrências candidatas' /tmp/auditoria.md
          grep -F 'Loot/consumíveis com texto mecânico detectado: **81**; **0** candidatos' /tmp/auditoria.md
      - run: npx playwright install --with-deps chromium
      - run: npm run teste:e2e
      - run: npm run teste:layout-mobile
      - run: npm run teste:layout-conjuracao-mobile
      - run: npm run teste:layout-toast-contexto-mobile
      - run: npm run teste:layout-mestre-mobile
      - run: npm run teste:layout-criacao-mobile
      - run: npm run teste:layout-regras-mobile
      - run: npm run teste:layout-abertura-mobile
      - run: npm run teste:layout-ajustes-mobile
      - run: npm run teste:layout-avanco-mobile
      - run: npm run teste:layout-descanso-mobile
      - run: npm run teste:layout-dano-mobile
      - run: npm run teste:layout-mochila-em-uso-mobile
      - run: npm run teste:layout-foto-mobile
      - run: npm run teste:layout-responsivo

      - name: Commitar apenas o HANDOFF validado
        shell: bash
        run: |
          git diff --exit-code -- . ':(exclude)docs/HANDOFF.md'
          if git diff --quiet -- docs/HANDOFF.md; then
            echo 'HANDOFF já estava sincronizado.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/HANDOFF.md
          git commit -m 'docs: sincronizar HANDOFF até L9-B28 [b29-doc]'
          git push origin HEAD:${{ github.ref_name }}
