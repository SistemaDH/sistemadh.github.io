name: Lote 8 - ciclo de ancestralidades

on:
  push:
    branches:
      - 'ediçãoclaude'

permissions:
  contents: write

jobs:
  validar-materializar:
    if: ${{ contains(github.event.head_commit.message, '[run-lote8-ciclo]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'ediçãoclaude'
          fetch-depth: 0

      - name: Validar transformadores
        run: |
          python3 -m py_compile tools/lote8-ciclo-origem.py
          python3 -m py_compile tools/lote8-ciclo-hotfix.py

      - name: Materializar ciclo de ancestralidades
        run: |
          python3 tools/lote8-ciclo-origem.py
          python3 tools/lote8-ciclo-hotfix.py
          node tools/gerar-43-origens.mjs
          node tools/gerar-48-criacao.mjs
          node tools/gerar-4B-descanso.mjs
          node tools/gerar-4E-mesa.mjs
          python3 tools/conferir-ancestralidades-lote8.py
          git diff --check

      - name: Testes backend
        id: backend
        continue-on-error: true
        run: node tools/testes-backend.mjs > /tmp/lote8-backend.log 2>&1

      - name: Capturar falha backend
        if: steps.backend.outcome == 'failure'
        run: |
          tail -n 250 /tmp/lote8-backend.log > tools/lote8-backend-falha.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/lote8-backend-falha.txt
          if ! git diff --cached --quiet; then
            git commit -m 'ci: registrar falha backend do ciclo lote 8'
            git push origin HEAD:'ediçãoclaude'
          fi
          exit 1

      - name: Instalar Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium

      - name: Testes E2E
        run: node tools/testes-e2e.mjs

      - name: Conferir gerados
        run: node tools/conferir-gerados.mjs

      - name: Conferir CSS
        run: node tools/conferir-css.mjs

      - name: Proteger contra concorrência
        run: |
          git fetch origin 'ediçãoclaude'
          test "$(git rev-parse 'origin/ediçãoclaude')" = "$GITHUB_SHA"

      - name: Commitar funcional e limpar temporários
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f tools/lote8-ciclo-origem.py
          git rm -f tools/lote8-ciclo-hotfix.py
          git rm -f tools/lote8-backend-falha.txt || true
          git rm -f .github/workflows/lote8-ciclo-origem.yml
          git add -A
          git diff --cached --check
          git commit -m 'feat: automatizar ciclo de ancestralidades [lote8-generated]'
          git push origin HEAD:'ediçãoclaude'
