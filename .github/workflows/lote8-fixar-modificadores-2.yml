name: Lote 8 - corrigir duas travas dos modificadores

on:
  push:
    branches:
      - 'ediçãoclaude'

permissions:
  contents: write

jobs:
  corrigir:
    if: ${{ contains(github.event.head_commit.message, '[fix-modificadores-2]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'ediçãoclaude'
          fetch-depth: 0
      - name: Corrigir reconhecedor Afiada e fixture canônico
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/lote8-implementar-modificadores-derivados.py')
          t = p.read_text(encoding='utf-8')
          trocas = [
            ("if nome == 'cortante' and cat == 'armadura' and '1d4' in texto and 'dano' in texto:",
             "if nome in ('cortante', 'afiada') and cat == 'armadura' and '1d4' in texto and 'dano' in texto:"),
            ("subclasseCartas: ['fundacao', 'especializacao', 'maestria'], condicoes: ['Vulnerável'] });",
             "subclasseCartas: ['fundacao', 'especializacao', 'maestria'], condicoes: [{ id: 'vulneravel', nome: 'Vulnerável', temporaria: false, origem: 'teste' }] });")
          ]
          for velho, novo in trocas:
              if t.count(velho) != 1:
                  raise SystemExit(f'esperava 1 ocorrência de {velho!r}; achei {t.count(velho)}')
              t = t.replace(velho, novo, 1)
          p.write_text(t, encoding='utf-8')
          PY
          git diff --check
      - name: Commitar correções
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/lote8-implementar-modificadores-derivados.py
          git commit -m 'fix: corrigir Afiada e fixture de Adrenalina'
          git push origin HEAD:'ediçãoclaude'
