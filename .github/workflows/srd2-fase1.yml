name: SRD2 fase 1

on:
  push:
    branches: [srd2-conformidade]

permissions:
  contents: write

jobs:
  materializar:
    if: ${{ !contains(github.event.head_commit.message, '[srd2-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: srd2-conformidade
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Corrigir bootstrap do helper temporário
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/aplicar-srd2-fase1.py')
          linhas = p.read_text(encoding='utf-8').splitlines()
          n = 0
          for i, linha in enumerate(linhas):
              if linha.strip() == '""':
                  linhas[i] = linha.replace('""', '"""')
                  n += 1
          if n != 2:
              raise SystemExit(f'esperava corrigir 2 delimitadores, corrigi {n}')
          p.write_text('\n'.join(linhas) + '\n', encoding='utf-8')
          PY
          python3 -m py_compile tools/aplicar-srd2-fase1.py
      - name: Aplicar correções SRD 2.0 — fase 1
        run: python3 tools/aplicar-srd2-fase1.py
      - name: Regenerar avanço
        run: node tools/gerar-4D-avanco.mjs
      - name: Sintaxe
        run: npm run teste:sintaxe
      - name: Backend
        run: npm run teste
      - name: Gerados
        run: npm run teste:gerados
      - name: CSS
        run: npm run teste:css
      - name: Playwright
        run: npx playwright install --with-deps chromium
      - name: E2E
        run: npm run teste:e2e
      - name: Layout avanço
        run: npm run teste:layout-avanco-mobile
      - name: Persistir somente arquivos intencionais
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/avanco.json data/srd2-fonte.json \
            tools/4D_Avanco.rodape.js backend/4D_Avanco.gs backend/99_Api.gs \
            js/telas/avanco.js tools/testes-backend.mjs docs/srd2-conformidade.md
          git diff --cached --check
          git commit -m "fix(srd2): alinhar avanço 1-10 ao SRD 2.0 [srd2-bot]"
          git push
