name: Lote 8 - auditar características ativas

on:
  push:
    branches:
      - 'ediçãoclaude'

permissions:
  contents: read

jobs:
  auditar:
    if: ${{ contains(github.event.head_commit.message, '[run-ativos]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'ediçãoclaude'
      - name: Inventariar características ativas do Core
        run: python3 tools/lote8-auditar-ativos.py
