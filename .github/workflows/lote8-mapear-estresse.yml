name: Lote 8 - mapear estresse

on:
  push:
    branches: ['ediçãoclaude']

jobs:
  mapear:
    if: ${{ contains(github.event.head_commit.message, '[map-stress]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mapear escritas e custos de Estresse
        run: |
          echo '=== estresseMarcado ==='
          grep -RIn --exclude-dir=.git --exclude='*.pyc' 'estresseMarcado' backend js tools | head -n 500 || true
          echo '=== custo estresse ==='
          grep -RIn --exclude-dir=.git --exclude='*.pyc' -E 'custoEstresse|custo.*estresse|estresse.*custo' backend | head -n 500 || true
