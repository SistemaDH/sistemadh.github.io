name: Aplicar gerenciador de equipamentos

on:
  push:
    branches: [equipamento-gerenciar]

permissions:
  contents: write

jobs:
  aplicar:
    if: contains(github.event.head_commit.message, 'executar ajuste do gerenciador')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: equipamento-gerenciar
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Aplicar patch
        run: python3 tools/patch-gerenciador-equipamentos.py
      - name: Instalar dependências
        run: npm ci
      - name: Sintaxe
        run: npm run teste:sintaxe
      - name: Backend e regressões
        run: npm run teste
      - name: Gerados e CSS
        run: |
          npm run teste:gerados
          npm run teste:css
      - name: Chromium
        run: npx playwright install --with-deps chromium
      - name: E2E
        run: npm run teste:e2e
      - name: Gravar alteração limpa
        run: |
          rm tools/patch-gerenciador-equipamentos.py
          rm .github/workflows/aplicar-gerenciador-equipamentos.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/telas/ficha.js tools/testes-e2e.mjs docs/HANDOFF.md tools/patch-gerenciador-equipamentos.py .github/workflows/aplicar-gerenciador-equipamentos.yml
          git commit -m "feat: unificar gerenciamento de equipamentos"
          git push origin HEAD:equipamento-gerenciar
