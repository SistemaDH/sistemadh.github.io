name: Lote 8 - Guardiao Ato de Retaliacao

on:
  push:
    branches: ["ediçãoclaude"]

permissions:
  contents: write

jobs:
  validar-materializar:
    if: contains(github.event.head_commit.message, '[run-lote8-guardiao-retaliacao]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "ediçãoclaude"
          fetch-depth: 0

      - name: Materializar Ato de Retaliacao
        run: |
          python3 tools/lote8-guardiao-retaliacao.py
          python3 tools/lote8-retaliacao-css-hotfix.py
          node tools/gerar-42-classes.mjs
          python3 tools/conferir-classes-lote8.py
          python3 tools/conferir-comunidades-lote8.py
          python3 tools/conferir-ancestralidades-lote8.py
          grep -q "RETALIACOES_DE_CLASSE" backend/42_Classes.gs
          grep -q "validarRetaliacoesPendentes_" backend/42_Classes.gs
          grep -q "ajustarRetaliacao_" backend/4C_Ajustes.gs
          grep -q "blocoDeRetaliacao" js/telas/ficha.js
          grep -q "retaliacaoDaCaracteristica" js/telas/ficha.js
          ! grep -q "ficha__retaliacao" js/telas/ficha.js
          git diff --check

      - name: Testes backend
        run: node tools/testes-backend.mjs

      - name: Instalar Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium

      - name: Testes E2E
        run: node tools/testes-e2e.mjs

      - name: Conferir gerados e CSS
        run: |
          node tools/conferir-gerados.mjs
          node tools/conferir-css.mjs

      - name: Regenerar auditoria transversal
        run: |
          python3 tools/auditar-pendencias-lote8.py > docs/AUDITORIA-FINAL-LOTE8.md
          python3 -c "from pathlib import Path; p=Path('docs/AUDITORIA-FINAL-LOTE8.md'); p.write_text(p.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')"
          python3 - <<'PY'
          import re
          from pathlib import Path
          t=Path('docs/AUDITORIA-FINAL-LOTE8.md').read_text(encoding='utf-8')
          m=re.search(r'Classes/subclasses: \*\*99 características\*\*; \*\*(\d+)\*\* candidatas', t)
          assert m and int(m.group(1)) == 24, m.group(0) if m else 'linha ausente'
          sec=t.split('## Candidatos — comunidades')[0].split('## Candidatos — classes e subclasses')[-1]
          assert '| Guardião |' not in sec, 'Guardião ainda tem candidato após Ato de Retaliação'
          assert 'Ato de Retaliação' not in sec, 'Ato de Retaliação ainda aparece como candidato'
          print('candidatos de classes:', m.group(1), '— Guardião fechado')
          PY
          git diff --check

      - name: Proteger contra concorrencia
        run: |
          git fetch origin 'ediçãoclaude'
          test "$(git rev-parse 'origin/ediçãoclaude')" = "$GITHUB_SHA"

      - name: Commitar funcional e limpar temporarios
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f tools/lote8-guardiao-retaliacao.py
          git rm -f tools/lote8-retaliacao-css-hotfix.py
          git rm -f .github/workflows/lote8-guardiao-retaliacao.yml
          git add -A
          git diff --cached --check
          git commit -m 'feat: automatizar Ato de Retaliação do Guardião [lote8-generated]'
          git push origin HEAD:'ediçãoclaude'
