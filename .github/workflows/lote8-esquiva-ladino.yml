name: Lote 8 - Esquiva de Ladino

on:
  push:
    branches:
      - 'ediçãoclaude'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validar:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-esquiva]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'ediçãoclaude'
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guardar HEAD testado
        run: echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Corrigir localizador estrutural do transformador temporário
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/lote8-implementar-esquiva-ladino.py')
          t = p.read_text(encoding='utf-8')
          t2 = t.replace(r'contexto\.CONTADORES', r'CONTADORES')
          t2 = t2.replace('contexto.CONTADORES', 'CONTADORES')
          if t2 == t:
              raise SystemExit('localizador antigo contexto.CONTADORES não encontrado')
          p.write_text(t2, encoding='utf-8')
          PY
      - name: Materializar Esquiva e regenerar
        run: |
          python3 tools/lote8-implementar-esquiva-ladino.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/testes-backend.mjs')
          t = p.read_text(encoding='utf-8')
          velho = "igual(porOrigem['caracteristica-classe'], 4);"
          novo = "igual(porOrigem['caracteristica-classe'], 5);"
          if novo not in t:
              if t.count(velho) != 1:
                  raise SystemExit('expectativa de origem de classe não encontrada de forma única')
              t = t.replace(velho, novo, 1)
          p.write_text(t, encoding='utf-8')
          PY
          node tools/gerar-42-classes.mjs
          node tools/gerar-47-contadores.mjs
          node tools/gerar-48-criacao.mjs
          node tools/conferir-gerados.mjs
      - name: Instalar dependências E2E
        run: |
          npm install --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Testes backend
        run: node tools/testes-backend.mjs
      - name: Testes E2E
        run: node tools/testes-e2e.mjs
      - name: Conferir CSS
        run: node tools/conferir-css.mjs
      - name: Recusar push sobre branch avançada
        run: |
          git fetch origin 'ediçãoclaude'
          ATUAL=$(git rev-parse origin/ediçãoclaude)
          if [ "$ATUAL" != "$BASE_SHA" ]; then
            echo "Branch avançou durante os testes: $BASE_SHA -> $ATUAL"
            exit 1
          fi
      - name: Commitar somente implementação validada
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/classes.json data/contadores.json tools/gerar-42-classes.mjs tools/gerar-48-criacao.mjs backend/42_Classes.gs backend/47_Contadores.gs backend/48_Criacao.gs backend/4C_Ajustes.gs js/telas/ficha.js tools/testes-backend.mjs
          if git diff --cached --quiet; then
            echo 'Nenhuma materialização pendente.'
          else
            git commit -m 'feat: automatizar Esquiva de Ladino [lote8-generated]'
            git push origin HEAD:'ediçãoclaude'
          fi
