name: L9 finalizar dano e cartas

on:
  push:
    branches: [newedit]
    paths:
      - '.github/workflows/lote9-finalizar-dano.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: newedit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Aplicar integração de cartas no dano
        run: python3 tools/lote9-finalizar-dano.py
      - run: npm ci
      - name: Validar antes do commit
        run: |
          npm run teste:sintaxe
          npm run teste
          npm run teste:gerados
          npm run teste:css
      - name: Commitar implementação validada
        run: |
          rm -f .github/workflows/lote9-finalizar-dano.yml tools/lote9-finalizar-dano.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: integrar cartas ativas ao dano recebido'
          git push origin HEAD:newedit
