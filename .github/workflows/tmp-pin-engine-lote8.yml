name: Pin engine Lote 8

on:
  push:
    branches: [newedit]

permissions:
  contents: write

jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fixar commit imutável do motor
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA='2572ee1270ee4f98c5c54158507df0783bd2696b'
          test "$(git merge-base HEAD "$BASE_SHA")" = "$BASE_SHA"
          test "$(git diff --name-only "$BASE_SHA"..HEAD)" = '.github/workflows/tmp-pin-engine-lote8.yml'
          python3 - <<'PY'
          from pathlib import Path
          p = Path('supabase/functions/engine-api/index.ts')
          s = p.read_text(encoding='utf-8')
          old = 'const ENGINE_COMMIT = "c52b87cd1657ff7904554f2cc3035f552df7f8c8";'
          new = 'const ENGINE_COMMIT = "2572ee1270ee4f98c5c54158507df0783bd2696b";'
          if s.count(old) != 1:
              raise SystemExit('pin antigo não encontrado exatamente uma vez')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          grep -F 'const ENGINE_COMMIT = "2572ee1270ee4f98c5c54158507df0783bd2696b";' supabase/functions/engine-api/index.ts
          rm .github/workflows/tmp-pin-engine-lote8.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'chore: fixar motor do Lote 8'
          git push origin HEAD:newedit
