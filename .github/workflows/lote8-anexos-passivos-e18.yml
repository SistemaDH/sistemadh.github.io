name: Lote 8 - Anexos e Passivos E18

on:
  push:
    branches:
      - tmp-lote8-anexos-passivos-e18-sol

permissions:
  contents: write

concurrency:
  group: lote8-anexos-passivos-e18-sol
  cancel-in-progress: false

env:
  BASE_SHA: 9dcabe4bef51f725b293398d9880637ab030c558

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materializar E18 e regenerar
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/lote8-anexos-passivos-e18.py')
          s=p.read_text(encoding='utf-8')
          start=s.index('anchor = "console.log(`')
          marker='write(path_test, tests)'
          end=s.index(marker,start)+len(marker)
          replacement="""needle = '${passou} passaram, ${falhou} falharam.'
          pos_needle = tests.rfind(needle)
          if pos_needle < 0:
              raise SystemExit('Resumo dos testes não encontrado')
          pos = tests.rfind('console.log(`', 0, pos_needle)
          if pos < 0:
              raise SystemExit('Início do resumo dos testes não encontrado')
          tests = tests[:pos] + bloco + tests[pos:]
          write(path_test, tests)"""
          # Retira a indentação de transporte do literal acima para gerar Python válido.
          replacement='\n'.join(line[10:] if line.startswith('          ') else line for line in replacement.splitlines())
          s=s[:start]+replacement+s[end:]
          p.write_text(s,encoding='utf-8')
          PY
          python3 tools/lote8-anexos-passivos-e18.py
          node tools/gerar-44-equipamento.mjs
          python3 tools/auditar-pendencias-lote8.py > docs/AUDITORIA-FINAL-LOTE8.md
          git diff --check
          node --check js/telas/ficha.js

      - name: Validar contratos e auditoria E18
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          eq=json.load(open('data/equipamentos.json',encoding='utf-8'))
          loot={x['id']:x for x in eq.get('loot',[])}
          assert loot['loot-25']['automacao']['classificacao']=='loot-anexo-arma-dado-manual-e18'
          assert loot['loot-25']['efeitoSaquePassivo']['anexoArma']['caracteristica']=='Brutal'
          assert loot['loot-26']['automacao']['classificacao']=='loot-anexo-arma-dado-manual-e18'
          assert loot['loot-26']['efeitoSaquePassivo']['anexoArma']['caracteristica']=='Poderoso'
          assert loot['loot-47']['automacao']['classificacao']=='loot-reliquia-experiencia-e18'
          assert loot['loot-47']['efeitoSaquePassivo']['grupoExclusivo']=='reliquia'
          assert loot['loot-47']['efeitoSaquePassivo']['experiencia']['bonus']==1
          assert loot['loot-48']['automacao']['classificacao']=='loot-passivo-alcance-arma-e18'
          assert loot['loot-48']['efeitoSaquePassivo']['alcanceArmas']=={
              'de':'Corpo a Corpo','para':'Muito Próximo','tipoDano':'fisico'}
          for rid in ('loot-25','loot-26','loot-47','loot-48'):
              assert loot[rid]['automacao']['rolaNoApp'] is False

          b44=Path('backend/44_Equipamento.gs').read_text(encoding='utf-8')
          b4c=Path('backend/4C_Ajustes.gs').read_text(encoding='utf-8')
          front=Path('js/telas/ficha.js').read_text(encoding='utf-8')
          for token in ('loot-anexo-arma-dado-manual-e18','loot-reliquia-experiencia-e18','loot-passivo-alcance-arma-e18'):
              assert token in b44,token
          for token in ('configuracaoDeVinculoDeSaque_','validarVinculoDeSaque_',"acao === 'vinculo'",'item.vinculo'):
              assert token in b4c,token
          for token in ("acao:'vinculo'",'Salvar vínculo','bonusReliquiaNaExp','regraFlickerfly','anexo.caracteristica'):
              assert token in front,token

          audit=Path('docs/AUDITORIA-FINAL-LOTE8.md').read_text(encoding='utf-8')
          for rid in ('loot-25','loot-26','loot-47','loot-48'):
              nome=loot[rid]['nome']
              assert f'| loot | {nome} | candidato mecânico |' not in audit,nome
          m=re.search(r'Loot/consumíveis com texto mecânico detectado: \*\*(\d+)\*\*; \*\*(\d+)\*\* candidatos',audit)
          assert m and int(m.group(2))==6,(m.group(0) if m else 'sem resumo')
          print('E18 contratos OK; candidatos restantes:',m.group(2))
          PY

      - name: Testes backend completos
        run: node tools/testes-backend.mjs

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Testes E2E completos
        run: node tools/testes-e2e.mjs

      - name: Conferir gerados e CSS
        run: |
          set -euo pipefail
          node tools/conferir-gerados.mjs
          node tools/conferir-css.mjs
          git diff --check

      - name: Trava de concorrencia
        run: |
          set -euo pipefail
          git fetch origin 'refs/heads/ediçãoclaude:refs/remotes/origin/ediçãoclaude'
          ATUAL="$(git rev-parse 'origin/ediçãoclaude')"
          echo "ediçãoclaude atual: $ATUAL"
          echo "base esperada:      $BASE_SHA"
          test "$ATUAL" = "$BASE_SHA"

      - name: Criar commit funcional e limpar temporarios
        run: |
          set -euo pipefail
          rm tools/lote8-anexos-passivos-e18.py
          rm .github/workflows/lote8-anexos-passivos-e18.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo 'Nenhuma alteração funcional para commitar.'; exit 1; }
          git commit -m 'feat: integrar anexos e passivos de loot E18'
          git push origin HEAD