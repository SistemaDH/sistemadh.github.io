name: Lote 8 - reconhecer 'um d4' da Afiada

on:
  push:
    branches:
      - 'ediçãoclaude'

permissions:
  contents: write

jobs:
  corrigir:
    if: ${{ contains(github.event.head_commit.message, '[fix-modificadores-4]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'ediçãoclaude'
          fetch-depth: 0
      - name: Aceitar a redação PT-BR 'um d4'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/lote8-implementar-modificadores-derivados.py')
          t = p.read_text(encoding='utf-8')
          velho = "if nome in ('cortante', 'afiada') and '1d4' in texto and 'dano' in texto:"
          novo = "if nome in ('cortante', 'afiada') and ('1d4' in texto or 'um d4' in texto) and 'dano' in texto:"
          if t.count(velho) != 1:
              raise SystemExit(f'esperava 1 ocorrência; achei {t.count(velho)}')
          p.write_text(t.replace(velho, novo, 1), encoding='utf-8')
          PY
          git diff --check
      - name: Commitar correção
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/lote8-implementar-modificadores-derivados.py
          git commit -m "fix: reconhecer redação 'um d4' da Afiada"
          git push origin HEAD:'ediçãoclaude'
