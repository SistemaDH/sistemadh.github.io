name: TEMP Lote 9 B4 toque mobile

on:
  push:
    branches: [tmp-lote9-b4-toque-real-sol]

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci

      - name: Materializar L9-B4
        run: python3 tools/tmp-lote9-b4.py

      - name: Contrato de toque L9-B4
        run: |
          grep -F '.btn--pequeno { min-height: 44px;' css/componentes.css
          grep -A5 -F '.link-botao {' css/telas.css | grep -F 'min-height: 44px;'
          grep -A8 -F '.ficha__itemBotao {' css/ficha.css | grep -F 'width: 44px;'
          grep -A2 -F '.papel__armaduraSlots { grid-template-columns: repeat(4, 24px); }' css/papel.css | grep -F '.papel__slot { width: 24px; height: 24px; }'
          grep -F 'alvos ativos abaixo de 24px' tools/testes-layout-mobile.mjs
          grep -F "el.matches('.btn--principal, .btn--pequeno" tools/testes-layout-mobile.mjs

      - name: Diff limpo
        run: git diff --check

      - run: npm run teste:sintaxe
      - run: npm run teste
      - run: npm run teste:gerados
      - run: npm run teste:css

      - name: Auditoria Core 1.0 zerada
        run: |
          python3 tools/auditar-pendencias-lote8.py > /tmp/auditoria.md
          grep -F 'Classes/subclasses: **99 características**; **0** candidatas' /tmp/auditoria.md
          grep -F 'Comunidades: **9 características**; **0** candidatas' /tmp/auditoria.md
          grep -F 'Cartas de domínio: **189 cartas**; **0** candidatas' /tmp/auditoria.md
          grep -F 'Características de armas/armaduras/molduras: **203 ocorrências**; **0** ocorrências candidatas' /tmp/auditoria.md
          grep -F 'Loot/consumíveis com texto mecânico detectado: **81**; **0** candidatos' /tmp/auditoria.md

      - run: npx playwright install --with-deps chromium
      - run: npm run teste:e2e

      - name: Layout mobile 360 / 390 / 430 com pisos 44/24
        run: npm run teste:layout-mobile

      - name: Guardar diagnóstico visual B4
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lote9-b4-layout-mobile
          path: artifacts/layout-mobile
          if-no-files-found: warn

      - name: Bloquear concorrência em newedit
        run: |
          atual=$(git ls-remote origin refs/heads/newedit | cut -f1)
          test "$atual" = '11361aef4db24fa04e171fad854f061024ad9d8d' || {
            echo "newedit mudou: esperado 11361aef4db24fa04e171fad854f061024ad9d8d, atual $atual"
            exit 1
          }

      - name: Criar commit funcional limpo
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm tools/tmp-lote9-b4.py tools/tmp-lote9-b4-diagnostico.py .github/workflows/tmp-lote9-b4.yml
          git add css/componentes.css css/telas.css css/criacao.css css/ficha.css css/papel.css tools/testes-layout-mobile.mjs
          git diff --cached --check
          git commit -m 'fix: consolidar alvos de toque mobile L9-B4'
          git push origin HEAD:tmp-lote9-b4-toque-real-sol
