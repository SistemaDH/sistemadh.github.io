name: Lote 8 - Passivos e Combate E14

on:
  push:
    branches:
      - tmp-lote8-passivos-combate-e14-sol

permissions:
  contents: write

concurrency:
  group: lote8-passivos-combate-e14-sol
  cancel-in-progress: false

env:
  BASE_SHA: 0767786e54c649e7e4cf8fbcfe517166d74ea3b8

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materializar E14 e regenerar
        run: |
          set -euo pipefail
          python3 tools/lote8-passivos-combate-e14.py
          node tools/gerar-44-equipamento.mjs
          node tools/gerar-47-contadores.mjs
          node tools/gerar-48-criacao.mjs
          node tools/gerar-4B-descanso.mjs
          python3 tools/auditar-pendencias-lote8.py > docs/AUDITORIA-FINAL-LOTE8.md
          git diff --check
          node --check js/telas/ficha.js

      - name: Validar contratos e auditoria E14
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          eq=json.load(open('data/equipamentos.json',encoding='utf-8'))
          xs={x['id']:x for x in eq.get('loot',[])}
          assert xs['loot-01']['automacao']['classificacao']=='loot-descanso-automatico-e14'
          assert xs['loot-01']['efeitoSaquePassivo']['descanso']['recuperaEstresse']==1
          assert xs['loot-03']['automacao']['classificacao']=='loot-dano-condicional-e14'
          assert 'patamar' in xs['loot-03']['descricao'].lower()
          assert 'nível' not in xs['loot-03']['descricao'].lower()
          assert xs['loot-03']['efeitoSaquePassivo']['bonusDanoCondicional']['tipo']=='patamar'
          assert xs['loot-14']['efeitoSaque']['contadorUso']=='uso:loot:loot-14'
          assert xs['loot-14']['efeitoSaque']['bonusProficienciaDano'] is True
          assert xs['loot-16']['efeitoSaquePassivo']['contextual']['bonusRolagem']=='vantagem'
          assert xs['loot-16']['efeitoSaquePassivo']['contextual']['traco']=='finesse'
          co=json.load(open('data/contadores.json',encoding='utf-8'))
          cs={x['chave']:x for x in co.get('contadores',[])}
          assert len(cs)==180,len(cs)
          assert cs['uso:loot:loot-14']['maximo']['valor']==3
          assert 'descanso' in cs['uso:loot:loot-14']['zeraEm']
          b44=Path('backend/44_Equipamento.gs').read_text(encoding='utf-8')
          assert 'efeitoSaquePassivo' in b44 and 'bonusProficienciaDano' in b44
          b47=Path('backend/47_Contadores.gs').read_text(encoding='utf-8')
          assert 'uso:loot:loot-14' in b47
          b48=Path('backend/48_Criacao.gs').read_text(encoding='utf-8')
          assert 'const saquesDano = saquesAtivosDaFicha_(ficha);' in b48
          b4b=Path('backend/4B_Descanso.gs').read_text(encoding='utf-8')
          assert 'function aplicarSaqueAutomaticoNoDescanso_' in b4b
          b4c=Path('backend/4C_Ajustes.gs').read_text(encoding='utf-8')
          assert 'const maxUsos = contadorUso' in b4c
          audit=Path('docs/AUDITORIA-FINAL-LOTE8.md').read_text(encoding='utf-8')
          for ident in ['loot-01','loot-03','loot-14','loot-16']:
              assert f"| loot | {xs[ident]['nome']} | candidato mecânico |" not in audit,ident
          m=re.search(r'Loot/consumíveis com texto mecânico detectado: \*\*(\d+)\*\*; \*\*(\d+)\*\* candidatos',audit)
          assert m and int(m.group(2))==22,(m.group(0) if m else 'sem resumo')
          print('E14 contratos OK; candidatos restantes:',m.group(2))
          PY

      - name: Testes backend completos
        run: node tools/testes-backend.mjs

      - name: Instalar dependências
        run: npm ci

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Testes E2E completos
        run: node tools/testes-e2e.mjs

      - name: Conferir gerados e CSS
        run: |
          set -euo pipefail
          node tools/conferir-gerados.mjs
          node tools/conferir-css.mjs
          git diff --check

      - name: Trava de concorrência
        run: |
          set -euo pipefail
          git fetch origin 'refs/heads/ediçãoclaude:refs/remotes/origin/ediçãoclaude'
          ATUAL="$(git rev-parse 'origin/ediçãoclaude')"
          echo "ediçãoclaude atual: $ATUAL"
          echo "base esperada:      $BASE_SHA"
          test "$ATUAL" = "$BASE_SHA"

      - name: Criar commit funcional e limpar temporários
        run: |
          set -euo pipefail
          rm tools/lote8-passivos-combate-e14.py
          rm .github/workflows/lote8-passivos-combate-e14.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo 'Nenhuma alteração funcional para commitar.'; exit 1; }
          git commit -m 'feat: integrar passivos e combate de loot E14'
          git push origin HEAD
