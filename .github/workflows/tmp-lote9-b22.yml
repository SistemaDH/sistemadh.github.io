name: TEMP Lote 9 B22 avanço resumo mobile

on:
  push:
    branches: [tmp-lote9-b22-avanco-resumo-mobile-sol]

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run teste:sintaxe
      - run: npm run teste:css
      - run: npx playwright install --with-deps chromium
      - name: Avanço mobile 360 / 390 / 430 + resumo sticky
        run: node tools/testes-avanco-mobile.mjs
      - name: Guardar diagnóstico do avanço
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lote9-b22-avanco
          path: artifacts/layout-avanco-mobile
          if-no-files-found: warn
