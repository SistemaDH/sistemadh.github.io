name: Lote 8 - Codice N5-N10

on:
  push:
    branches: [tmp-lote8-codex-n5-n10]

permissions:
  contents: write

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materializar Códice N5-N10
        run: |
          python3 tools/lote8-codex-n5-n10.py
          node tools/gerar-41-dominios.mjs
          node tools/gerar-47-contadores.mjs
          node tools/gerar-4B-descanso.mjs
          git diff --check

      - name: Conferir classificação e auditoria
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('data/cartas-dominio.json',encoding='utf-8'))
          ids={
            'codex-manifestar-muralha','codex-banir','codex-livro-de-homet',
            'codex-tocado-pelo-codice','codex-livro-de-vyola','codex-refugio-seguro',
            'codex-onda-de-desintegracao','codex-livro-de-yarrow','codex-uniao-transcendente'
          }
          xs=[c for c in d['cartas'] if c['id'] in ids]
          assert len(xs)==9, len(xs)
          assert all(c.get('automacao') for c in xs), [c['id'] for c in xs if not c.get('automacao')]
          assert all((c.get('resolucaoManual') or {}).get('rolaNoApp') is False for c in xs)
          cont=json.load(open('data/contadores.json',encoding='utf-8'))['contadores']
          assert len(cont)==95, len(cont)
          PY
          python3 tools/auditar-pendencias-lote8.py > /tmp/auditoria-lote8.md
          if grep -Eq '^\| Códice \| (5|6|7|8|9|10) \|' /tmp/auditoria-lote8.md; then
            echo 'Ainda há Códice N5-N10 candidato:'
            grep -E '^\| Códice \| (5|6|7|8|9|10) \|' /tmp/auditoria-lote8.md
            exit 1
          fi
          grep -q 'trocaComCofreSemCusto' js/telas/ficha.js
          grep -q 'imunidadeDeDanoDeCartaAtiva_' backend/4C_Ajustes.gs
          grep -q 'movimentosAdicionaisNoDescanso' tools/4B_Descanso.rodape.js

      - name: Testes backend
        shell: bash
        run: |
          set -o pipefail
          node tools/testes-backend.mjs | tee /tmp/backend.log
          ! grep -q '✗' /tmp/backend.log
          tail -n 14 /tmp/backend.log

      - name: Instalar Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install chromium

      - name: Testes E2E
        run: node tools/testes-e2e.mjs

      - name: Conferir gerados e CSS
        run: |
          node tools/conferir-gerados.mjs
          node tools/conferir-css.mjs
          git diff --check

      - name: Proteger contra concorrência
        run: |
          git fetch origin 'ediçãoclaude'
          test "$(git rev-parse 'origin/ediçãoclaude')" = '059d21405b76676769729a2ce205b4a2384c5673'

      - name: Commitar funcional e limpar temporários
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f --ignore-unmatch tools/lote8-codex-n5-n10.py
          git rm -f --ignore-unmatch .github/workflows/lote8-codex-n5-n10.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          git add -A
          git diff --cached --check
          git commit -m 'feat: revisar Códice níveis 5 a 10 [lote8-generated]'
          git push origin HEAD:tmp-lote8-codex-n5-n10
