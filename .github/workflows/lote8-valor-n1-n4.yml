name: Lote 8 - Valor N1-N4

on:
  push:
    branches: [tmp-lote8-valor-n1-n4-sol-fix]

permissions:
  contents: write

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materializar Valor N1-N4
        run: |
          python3 tools/lote8-valor-n1-n4.py
          node tools/gerar-41-dominios.mjs
          node tools/gerar-47-contadores.mjs
          node tools/gerar-48-criacao.mjs
          node tools/gerar-4B-descanso.mjs
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/testes-backend.mjs')
          s=p.read_text(encoding='utf-8')
          for nome in ('Torr sem armadura','Torr de armadura'):
              velho=f"nome:'{nome}',classe:'Guardião',subclasse:'Robusto',\n    ancestralidade:'Anão',comunidade:'Ridgeborne',"
              novo=f"nome:'{nome}',classe:'Guardião',subclasse:'Vingança',\n    ancestralidade:'Humano',comunidade:'Highborne',"
              assert velho in s, nome
              s=s.replace(velho,novo,1)
          p.write_text(s,encoding='utf-8')
          PY
          git diff --check

      - name: Conferir classificacao e auditoria
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('data/cartas-dominio.json',encoding='utf-8'))
          ids={
            'valor-empurrao-forte','valor-eu-sou-seu-escudo','valor-pele-dura',
            'valor-presenca-audaz','valor-quebrador-corporal','valor-apoie-se-em-mim',
            'valor-inspiracao-critica','valor-provocacao','valor-tanque-de-suporte'
          }
          xs=[c for c in d['cartas'] if c['id'] in ids]
          assert len(xs)==9, len(xs)
          assert all(c.get('automacao') for c in xs), [c['id'] for c in xs if not c.get('automacao')]
          assert all((c.get('resolucaoManual') or {}).get('rolaNoApp') is False for c in xs)
          pele=next(c for c in xs if c['id']=='valor-pele-dura')
          assert (pele.get('efeitoDerivado') or {}).get('defesaSemArmadura')
          quebrador=next(c for c in xs if c['id']=='valor-quebrador-corporal')
          assert (quebrador.get('efeitoDerivado') or {}).get('danoArmaCorpoACorpoPorTraco')=='Força'
          cont=json.load(open('data/contadores.json',encoding='utf-8'))['contadores']
          assert len(cont)==137, len(cont)
          keys={x['chave'] for x in cont}
          for k in ['uso:carta:valor:presenca-audaz-condicao','uso:carta:valor:apoie-se-em-mim','uso:carta:valor:inspiracao-critica']:
            assert k in keys, k
          PY
          python3 tools/auditar-pendencias-lote8.py > /tmp/auditoria-lote8.md
          if grep -Eq '^\| Valor \| (1|2|3|4) \|' /tmp/auditoria-lote8.md; then
            echo 'Ainda ha Valor N1-N4 candidato sem sinal especifico:'
            grep -E '^\| Valor \| (1|2|3|4) \|' /tmp/auditoria-lote8.md
            exit 1
          fi
          grep -q 'valor-pele-dura' backend/41_Dominios.gs
          grep -q 'uso:carta:valor:presenca-audaz-condicao' backend/47_Contadores.gs
          grep -q 'function defesaSemArmaduraDeCartas_' backend/48_Criacao.gs
          grep -q 'danoArmaCorpoACorpoPorTraco' backend/48_Criacao.gs

      - name: Testes backend
        shell: bash
        run: |
          set -o pipefail
          node tools/testes-backend.mjs | tee /tmp/backend.log
          ! grep -q '✗' /tmp/backend.log
          tail -n 32 /tmp/backend.log

      - name: Instalar Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install chromium

      - name: Testes E2E
        run: node tools/testes-e2e.mjs

      - name: Conferir gerados e CSS
        run: |
          node tools/conferir-gerados.mjs
          node tools/conferir-css.mjs
          git diff --check

      - name: Proteger contra concorrencia
        run: |
          git fetch origin 'ediçãoclaude'
          test "$(git rev-parse 'origin/ediçãoclaude')" = '04068822d8840345c55c5d5eb898d261baf548e1'

      - name: Commitar funcional e limpar temporarios
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f --ignore-unmatch tools/lote8-valor-n1-n4.py
          git rm -f --ignore-unmatch .github/workflows/lote8-valor-n1-n4.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          git add -A
          git diff --cached --check
          git commit -m 'feat: revisar Valor níveis 1 a 4 [lote8-generated]'
          git push origin HEAD:tmp-lote8-valor-n1-n4-sol-fix