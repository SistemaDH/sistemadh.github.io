name: Lote 8 - Consumiveis Recuperacao E1

on:
  push:
    branches: [tmp-lote8-consumiveis-recuperacao-e1-sol]

permissions:
  contents: write

env:
  BASE_SHA: 1a9776e26667a60b065e1e9ff35150bb1d0ae52e

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materializar consumiveis E1
        run: |
          python3 tools/lote8-consumiveis-recuperacao-e1.py
          python3 -c "from pathlib import Path; p=Path('docs/HANDOFF.md'); p.write_text(p.read_text(encoding='utf-8').rstrip()+'\n',encoding='utf-8')"
          node tools/gerar-44-equipamento.mjs
          node tools/gerar-41-dominios.mjs
          node tools/gerar-47-contadores.mjs
          node tools/gerar-4B-descanso.mjs
          git diff --check
          node --check js/telas/ficha.js

      - name: Conferir catalogo e auditoria E1
        run: |
          python3 - <<'PY'
          import json, subprocess
          ids={
            'consumivel-07','consumivel-08','consumivel-10','consumivel-15',
            'consumivel-19','consumivel-20','consumivel-43','consumivel-44'
          }
          d=json.load(open('data/equipamentos.json',encoding='utf-8'))
          xs={x['id']:x for x in d.get('consumiveis',[]) if x.get('id') in ids}
          assert set(xs)==ids, (set(xs),ids)
          for ident,x in xs.items():
            assert x.get('automacao',{}).get('rolaNoApp') is False, ident
            assert x.get('efeitoConsumivel'), ident
          out=subprocess.check_output(['python3','tools/auditar-pendencias-lote8.py'],text=True)
          print(out)
          assert 'Loot/consumíveis com texto mecânico detectado: **81**;' in out
          assert 'estruturado/classificado: **8**' in out
          print('E1 OK: 8 consumíveis estruturados; auditoria continua com 81 mecânicos inventariados.')
          PY
          grep -q 'usarConsumivelDaMochila_' backend/4C_Ajustes.gs
          grep -q 'efeitoConsumivel' backend/44_Equipamento.gs
          grep -q 'Usar e consumir 1' js/telas/ficha.js

      - name: Testes backend
        run: node tools/testes-backend.mjs

      - name: Instalar Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Testes E2E
        run: node tools/testes-e2e.mjs

      - name: Conferir gerados e CSS
        run: |
          node tools/conferir-gerados.mjs
          node tools/conferir-css.mjs
          git diff --check

      - name: Proteger contra concorrencia
        run: |
          git fetch origin 'refs/heads/ediçãoclaude:refs/remotes/origin/ediçãoclaude'
          ATUAL="$(git rev-parse 'origin/ediçãoclaude')"
          echo "ediçãoclaude atual: $ATUAL"
          echo "base esperada:       $BASE_SHA"
          test "$ATUAL" = "$BASE_SHA"

      - name: Commitar funcional e limpar temporarios
        run: |
          rm tools/lote8-consumiveis-recuperacao-e1.py
          rm .github/workflows/lote8-consumiveis-recuperacao-e1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo 'Nenhuma mudança funcional para commit.'; exit 1; } || true
          git commit -m 'feat: integrar consumiveis de recuperacao'
          git push origin HEAD:tmp-lote8-consumiveis-recuperacao-e1-sol
