name: Lote 8 - varredura final do Core

on:
  push:
    branches: ['ediçãoclaude']

permissions:
  contents: write

jobs:
  auditar:
    if: ${{ contains(github.event.head_commit.message, '[run-lote8-audit]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'ediçãoclaude'
          fetch-depth: 0

      - name: Gerar inventário de pendências
        run: |
          python3 tools/auditar-pendencias-lote8.py > docs/AUDITORIA-FINAL-LOTE8.md
          test -s docs/AUDITORIA-FINAL-LOTE8.md
          sed -n '1,45p' docs/AUDITORIA-FINAL-LOTE8.md

      - name: Revalidar checkpoints permanentes do lote
        run: |
          python3 tools/conferir-ancestralidades-lote8.py
          python3 tools/conferir-cartas-lote8.py
          python3 tools/conferir-equipamento-lote8.py
          node tools/conferir-gerados.mjs
          git diff --check

      - name: Registrar checkpoint de ancestralidades
        run: |
          python3 tools/lote8-registrar-checkpoint.py
          git diff --check

      - name: Commitar relatório e limpar temporários
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/lote8-varredura-final.yml
          git rm -f tools/lote8-registrar-checkpoint.py
          git add docs/AUDITORIA-FINAL-LOTE8.md docs/HANDOFF.md tools/auditar-pendencias-lote8.py
          git add -u
          git diff --cached --check
          git commit -m 'docs: registrar fechamento de ancestralidades e varredura do Core'
          git push origin HEAD:'ediçãoclaude'
