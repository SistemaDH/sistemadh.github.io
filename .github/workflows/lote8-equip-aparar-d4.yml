name: Lote 8 - Equipamento Aparar D4

on:
  push:
    branches: [tmp-lote8-equip-aparar-d4-sol]

permissions:
  contents: write

env:
  BASE_SHA: 463acf1341ccdbd01422ff740a201df01b79b8d2

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materializar Aparar
        run: |
          python3 tools/lote8-equip-aparar-d4.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/testes-backend.mjs')
          s=p.read_text(encoding='utf-8')
          s=s.replace(
            "teste('Aparar permanece fora do D3 para o bloco defensivo dedicado', () => {",
            "teste('Aparar sai da pendência do D3 pelo bloco defensivo dedicado, sem RNG', () => {",
            1
          )
          antigo="  verdade(!xs[0].automacao, 'Aparar deve continuar pendente até receber entrada manual dos dados defensivos');"
          novo="  verdade(!!xs[0].automacao, 'Aparar deve estar fechado pelo bloco defensivo D4');\n  igual(xs[0].automacao.rolaNoApp, false);\n  verdade(!!(((xs[0].efeitoEquipamento || {}).danoRecebido || {}).aparar));"
          if antigo not in s:
            raise SystemExit('expectativa histórica D3 de Aparar não encontrada')
          s=s.replace(antigo,novo,1)
          p.write_text(s,encoding='utf-8')
          PY
          node tools/gerar-44-equipamento.mjs
          node tools/gerar-41-dominios.mjs
          node tools/gerar-47-contadores.mjs
          node tools/gerar-4B-descanso.mjs
          git diff --check
          node --check js/telas/ficha.js

      - name: Conferir Aparar e auditoria zerada
        run: |
          python3 - <<'PY'
          import json, subprocess
          d=json.load(open('data/equipamentos.json',encoding='utf-8'))
          xs=[]
          def walk(x):
            if isinstance(x,dict):
              c=x.get('caracteristica')
              if isinstance(c,dict) and c.get('nome')=='Aparar': xs.append((x,c))
              for v in x.values(): walk(v)
            elif isinstance(x,list):
              for v in x: walk(v)
          walk(d)
          assert len(xs)==1
          item,c=xs[0]
          assert item.get('id')=='secundaria-t2-adaga-de-protecao'
          assert c.get('automacao',{}).get('rolaNoApp') is False
          assert c.get('efeitoEquipamento',{}).get('danoRecebido',{}).get('aparar',{}).get('dado')=='d6'
          out=subprocess.check_output(['python3','tools/auditar-pendencias-lote8.py'],text=True)
          print(out)
          assert 'Características de armas/armaduras/molduras: **203 ocorrências**; **0** ocorrências candidatas ativas/condicionais.' in out
          print('Aparar D4 OK; auditoria de equipamento zerada.')
          PY
          grep -q 'resolverApararNoDano_' backend/4C_Ajustes.gs
          grep -q 'dadosDanoAtacante' js/telas/ficha.js
          grep -q 'pedidoDano.dadosAparar' js/telas/ficha.js

      - name: Testes backend
        run: node tools/testes-backend.mjs

      - name: Instalar Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Testes E2E
        run: node tools/testes-e2e.mjs

      - name: Conferir gerados e CSS
        run: |
          node tools/conferir-gerados.mjs
          node tools/conferir-css.mjs
          git diff --check

      - name: Proteger contra concorrencia
        run: |
          git fetch origin 'refs/heads/ediçãoclaude:refs/remotes/origin/ediçãoclaude'
          ATUAL="$(git rev-parse 'origin/ediçãoclaude')"
          echo "ediçãoclaude atual: $ATUAL"
          echo "base esperada:       $BASE_SHA"
          test "$ATUAL" = "$BASE_SHA"

      - name: Commitar funcional e limpar temporarios
        run: |
          rm tools/lote8-equip-aparar-d4.py
          rm .github/workflows/lote8-equip-aparar-d4.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo 'Nenhuma mudança funcional para commit.'; exit 1; } || true
          git commit -m 'feat: integrar Aparar ao dano recebido'
          git push origin HEAD:tmp-lote8-equip-aparar-d4-sol
