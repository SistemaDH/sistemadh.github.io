name: TEMP Lote 9 B23 descanso mobile

on:
  push:
    branches: [tmp-lote9-b23-descanso-mobile-sol]

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run teste:sintaxe
      - run: npm run teste:css
      - run: npx playwright install --with-deps chromium
      - name: Descanso mobile 360 / 390 / 430 + ações fixas
        run: node tools/testes-descanso-mobile.mjs
      - name: Guardar diagnóstico do descanso
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lote9-b23-descanso
          path: artifacts/layout-descanso-mobile
          if-no-files-found: warn
