name: TEMP Lote 9 B27 CI mochila

on:
  push:
    branches: [tmp-lote9-b27-ci-mochila-sol]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run teste:sintaxe
      - run: npx playwright install --with-deps chromium
      - name: Mochila mobile 360 / 390 / 430 + itens em uso
        run: npm run teste:layout-mochila-em-uso-mobile
      - name: Guardar diagnóstico visual mochila mobile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lote9-b27-mochila-${{ github.run_id }}
          path: artifacts/layout-mochila-em-uso-mobile
          if-no-files-found: warn
