name: Lote 8 - Equipamento Recarga e Municao D1

on:
  push:
    branches: [tmp-lote8-equip-recarga-municao-d1-sol]

permissions:
  contents: write

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materializar Recarga e Seis Balas
        run: |
          python3 tools/lote8-equip-recarga-municao-d1.py
          node tools/gerar-44-equipamento.mjs
          node tools/gerar-41-dominios.mjs
          node tools/gerar-47-contadores.mjs
          node tools/gerar-4B-descanso.mjs
          cp backend/4C_Ajustes.gs /tmp/4C_Ajustes.js
          node --check /tmp/4C_Ajustes.js
          node --check js/telas/ficha.js
          node --check tools/gerar-47-contadores.mjs
          git diff --check

      - name: Auditar estrutura D1
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('data/equipamentos.json',encoding='utf-8'))
          alvos=[]
          def walk(x):
            if isinstance(x,dict):
              c=x.get('caracteristica')
              if isinstance(c,dict): alvos.append((x,c))
              for v in x.values(): walk(v)
            elif isinstance(x,list):
              for v in x: walk(v)
          walk(d)
          rec=[(x,c) for x,c in alvos if c.get('nomeIngles')=='Reloading' or c.get('nome') in {'Recarga','Recarregável'}]
          seis=[(x,c) for x,c in alvos if c.get('nome')=='Seis balas']
          assert len(rec)==5,len(rec)
          assert len(seis)==4,len(seis)
          assert all(c.get('automacao') and (c.get('efeitoEquipamento') or {}).get('usoAtivo') for _,c in rec+seis)
          assert all(((c.get('efeitoEquipamento') or {}).get('usoAtivo') or {}).get('entradaManual',{}).get('dado')=='d6' for _,c in rec)
          chaves=[((c.get('efeitoEquipamento') or {}).get('usoAtivo') or {}).get('contador') for _,c in seis]
          assert len(set(chaves))==4 and all(chaves),chaves
          assert all(((c.get('efeitoEquipamento') or {}).get('usoAtivo') or {}).get('tipo')=='municao' for _,c in seis)
          cc=json.load(open('data/contadores.json',encoding='utf-8'))['contadores']
          assert len(cc)==150,len(cc)
          assert sum(1 for c in cc if c.get('origem')=='equipamento')==5
          assert all(any(c.get('chave')==k and c.get('maximo')=={'tipo':'fixo','valor':6} for c in cc) for k in chaves)
          PY
          python3 tools/auditar-pendencias-lote8.py > /tmp/auditoria.md
          if grep -Eq '^\| (Recarga|Recarregável|Seis balas) \|' /tmp/auditoria.md; then
            echo 'D1 ainda aparece na auditoria.' >&2
            grep -E '^\| (Recarga|Recarregável|Seis balas) \|' /tmp/auditoria.md >&2 || true
            exit 1
          fi
          grep -q 'const equipamentoGuardado = ficha.equipamento || {}' backend/47_Contadores.gs
          grep -q 'function usarMunicaoDeEquipamento_' backend/4C_Ajustes.gs
          grep -q "if (regra.tipo === 'municao')" backend/4C_Ajustes.gs
          grep -q '...botoesDeUsoEquipamento_(item, fecharModal, p.ficha)' js/telas/ficha.js

      - name: Testes backend completos
        shell: bash
        run: |
          set -o pipefail
          node tools/testes-backend.mjs | tee /tmp/backend.log
          if grep -q '✗' /tmp/backend.log; then
            echo 'Há falha impressa na suíte backend.' >&2
            grep '✗' /tmp/backend.log >&2 || true
            exit 1
          fi
          grep -q 'Lote 8 — equipamento ofensivo D1: Recarga e Seis Balas' /tmp/backend.log
          grep -q '✓ D1 publica 5 Recarga, 4 Seis Balas e liga os botões no modal sem RNG' /tmp/backend.log
          grep -q '✓ Recarga pede d6 manual e só o resultado 1 cobra 1 Estresse' /tmp/backend.log
          grep -q '✓ o Estresse condicional da Recarga continua passando pelo Inabalável' /tmp/backend.log
          grep -q '✓ Seis Balas gasta uma bala por ataque e bloqueia o sétimo disparo' /tmp/backend.log
          grep -q '✓ Seis Balas recupera todos os Marcadores gastos por exatamente 1 Estresse' /tmp/backend.log
          grep -q '✓ balas gastas sobrevivem na reserva e arma guardada não pode disparar' /tmp/backend.log
          grep -q '✓ recarregar Seis Balas também respeita Inabalável sem perder o estado' /tmp/backend.log
          grep -q '815 passaram, 0 falharam.' /tmp/backend.log

      - name: Instalar Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install chromium

      - name: Testes E2E
        run: node tools/testes-e2e.mjs

      - name: Conferir gerados e CSS
        run: |
          node tools/conferir-gerados.mjs
          node tools/conferir-css.mjs
          git diff --check

      - name: Proteger contra concorrencia
        run: |
          git fetch origin 'ediçãoclaude'
          test "$(git rev-parse 'origin/ediçãoclaude')" = '15104e79f9fe872fe1308210f5445a3ee87adfbc'

      - name: Commitar funcional e limpar temporarios
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f --ignore-unmatch tools/lote8-equip-recarga-municao-d1.py
          git rm -f --ignore-unmatch .github/workflows/lote8-equip-recarga-municao-d1.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          git add -A
          git diff --cached --check
          git commit -m 'feat: automatizar Recarga e Seis Balas [lote8-generated]'
          git push origin HEAD:tmp-lote8-equip-recarga-municao-d1-sol
