name: Lote 8 - Consumiveis Especiais E9

on:
  push:
    branches: [tmp-lote8-consumiveis-especiais-e9-sol]

permissions:
  contents: write

env:
  BASE_SHA: ad08d849bd403fa38390ccd0448b0aafac96232a

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materializar consumiveis E9 e corrigir E7
        run: |
          python3 tools/lote8-consumiveis-especiais-e9.py
          node tools/gerar-44-equipamento.mjs
          node tools/gerar-47-contadores.mjs
          node tools/gerar-48-criacao.mjs
          node tools/gerar-41-dominios.mjs
          node tools/gerar-4B-descanso.mjs
          python3 -c "from pathlib import Path; p=Path('docs/HANDOFF.md'); p.write_text(p.read_text(encoding='utf-8').rstrip()+'\n',encoding='utf-8')"
          git diff --check
          node --check js/telas/ficha.js

      - name: Conferir catalogo, estados e auditoria E9
        run: |
          python3 - <<'PY'
          import json, subprocess
          eq=json.load(open('data/equipamentos.json',encoding='utf-8'))
          xs={x['id']:x for x in eq.get('consumiveis',[])}
          ids={'consumivel-13','consumivel-46','consumivel-50','consumivel-53','consumivel-54','consumivel-55'}
          assert ids <= set(xs), ids-set(xs)
          assert xs['consumivel-13']['efeitoConsumivel']['tipo']=='ativar-estado'
          assert xs['consumivel-13']['automacao']['classificacao']=='consumivel-descanso-extra-e9'
          assert xs['consumivel-46']['efeitoConsumivel']['tipo']=='ativar-estado'
          assert xs['consumivel-46']['efeitoConsumivel']['duracaoMinutosPorNivel']==1
          assert xs['consumivel-50']['efeitoConsumivel']['tipo']=='recuperar-tudo'
          assert xs['consumivel-50']['efeitoConsumivel']['recurso']=='estresseMarcado'
          assert xs['consumivel-53']['automacao']['classificacao']=='consumivel-estado-tamanho-e7'
          assert xs['consumivel-54']['automacao']['classificacao']=='consumivel-estado-tamanho-e7'
          assert xs['consumivel-55'].get('automacao') is None
          assert xs['consumivel-55'].get('efeitoConsumivel') is None

          co=json.load(open('data/contadores.json',encoding='utf-8'))
          cs={x['refId']:x for x in co.get('contadores',[]) if x.get('origem')=='consumivel'}
          assert cs['consumivel-13']['movimentosAdicionaisNoDescanso']==1
          assert cs['consumivel-13']['zeraEm']==['descanso']
          assert cs['consumivel-46']['zeraEm']==['manual']
          assert cs['consumivel-46']['persisteSemRef'] is True
          assert cs['consumivel-53']['modificadorTraco']=={'traco':'agilidade','bonus':2}
          assert cs['consumivel-53']['modificadorProficiencia']==-1
          assert cs['consumivel-54']['modificadorTraco']=={'traco':'forca','bonus':2}
          assert cs['consumivel-54']['modificadorProficiencia']==1
          assert 'consumivel-55' not in cs

          checks={
            'backend/47_Contadores.gs':['movimentosAdicionaisNoDescanso: 1'],
            'backend/4B_Descanso.gs':['Estados persistentes também podem alterar o número de movimentos'],
            'backend/4C_Ajustes.gs':["tipo === 'recuperar-tudo'"],
          }
          for path,agulhas in checks.items():
              texto=open(path,encoding='utf-8').read()
              for agulha in agulhas:
                  assert agulha in texto, f'{path}: não gerou {agulha}'

          out=subprocess.check_output(['python3','tools/auditar-pendencias-lote8.py'],text=True)
          print(out)
          for ident in ['consumivel-13','consumivel-46','consumivel-50','consumivel-53','consumivel-54']:
              linha='| consumiveis | '+xs[ident]['nome']+' | candidato mecânico |'
              assert linha not in out,linha
          print('E9 OK: especiais estruturados, E7 corrigido e candidatos atualizados.')
          PY

      - name: Testes backend
        run: node tools/testes-backend.mjs

      - name: Instalar Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Testes E2E
        run: node tools/testes-e2e.mjs

      - name: Conferir gerados e CSS
        run: |
          node tools/conferir-gerados.mjs
          node tools/conferir-css.mjs
          git diff --check

      - name: Proteger contra concorrencia
        run: |
          git fetch origin 'refs/heads/ediçãoclaude:refs/remotes/origin/ediçãoclaude'
          ATUAL="$(git rev-parse 'origin/ediçãoclaude')"
          echo "ediçãoclaude atual: $ATUAL"
          echo "base esperada:       $BASE_SHA"
          test "$ATUAL" = "$BASE_SHA"

      - name: Commitar funcional e limpar temporarios
        run: |
          rm tools/lote8-consumiveis-especiais-e9.py
          rm .github/workflows/lote8-consumiveis-especiais-e9.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo 'Nenhuma mudança funcional para commit.'; exit 1; } || true
          git commit -m 'feat: integrar consumiveis especiais E9'
          git push origin HEAD:tmp-lote8-consumiveis-especiais-e9-sol
