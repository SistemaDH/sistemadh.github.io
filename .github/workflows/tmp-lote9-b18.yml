name: TEMP Lote 9 B18 ajuda criação mobile

on:
  push:
    branches: [tmp-lote9-b18-ajuda-criacao-mobile-sol]

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run teste:sintaxe
      - run: npm run teste:css
      - run: npx playwright install --with-deps chromium
      - name: Layout criação mobile + ajuda recolhível
        run: npm run teste:layout-criacao-mobile
      - name: Guardar diagnóstico da ajuda
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lote9-b18-ajuda-criacao
          path: |
            artifacts/layout-criacao-mobile
            artifacts/layout-criacao-ajuda-mobile
          if-no-files-found: warn
