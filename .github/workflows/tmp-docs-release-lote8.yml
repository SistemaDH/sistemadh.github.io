name: Registrar publicação Lote 8

on:
  push:
    branches: [newedit]

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Atualizar documentação de produção
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA='8689713a3846977b2e4f13e095c8417c761cec8f'
          test "$(git merge-base HEAD "$BASE_SHA")" = "$BASE_SHA"
          test "$(git diff --name-only "$BASE_SHA"..HEAD)" = '.github/workflows/tmp-docs-release-lote8.yml'
          python3 - <<'PY'
          from pathlib import Path

          readme = Path('README.md')
          s = readme.read_text(encoding='utf-8')
          s = s.replace(
              '> **Pré-main:** a branch de desenvolvimento passa a ser `newedit`. Ela contém o Lote 8 / Core 1.0 auditado integralmente, mas ainda **não foi publicado em `main` nem implantado em produção**.',
              '> **Produção:** o Lote 8 / Core 1.0 foi publicado em `main` em 10/09/2026. A branch de desenvolvimento continua sendo `newedit`.'
          )
          s = s.replace('Produção integra os Lotes 1–7, incluindo:', 'Produção integra os Lotes 1–8 / Core 1.0, incluindo:')
          s = s.replace(
              'engine-api: v6 ACTIVE\nverify_jwt: false\nENGINE_COMMIT: c52b87cd1657ff7904554f2cc3035f552df7f8c8',
              'engine-api: v7 ACTIVE\nverify_jwt: false\nENGINE_COMMIT: 2572ee1270ee4f98c5c54158507df0783bd2696b'
          )
          marker = '## Publicação atual\n\n'
          release = (
              'Lote 8 / Core 1.0 publicado em produção em 10/09/2026.\n\n'
              '- commit fonte imutável do motor: `2572ee1270ee4f98c5c54158507df0783bd2696b`;\n'
              '- commit que fixa o pin do motor: `8689713a3846977b2e4f13e095c8417c761cec8f`;\n'
              '- `engine-api` v7 ACTIVE, `verify_jwt=false`;\n'
              '- SHA do pacote implantado: `eb08d5ba112537dae1e9fe90e9b1022b7a7a6feaad0ab9a727d86b40574a76db`;\n'
              '- GitHub Pages publicou o frontend do mesmo commit funcional com sucesso.\n\n'
              'Histórico: '
          )
          if release not in s:
              if marker not in s:
                  raise SystemExit('seção Publicação atual não encontrada no README')
              s = s.replace(marker, marker + release, 1)
          readme.write_text(s, encoding='utf-8')

          arq = Path('docs/arquitetura-supabase.md')
          s = arq.read_text(encoding='utf-8')
          s = s.replace('Produção atual, após os Lotes 6 e 7:', 'Produção atual, após o Lote 8 / Core 1.0:')
          s = s.replace(
              'engine-api: v6 ACTIVE\nverify_jwt: false\nENGINE_COMMIT: c52b87cd1657ff7904554f2cc3035f552df7f8c8\nezbr_sha256: 2a24c40978e5a885c524832c35394a1a5b347ead1c595648f01276afe9a34f28',
              'engine-api: v7 ACTIVE\nverify_jwt: false\nENGINE_COMMIT: 2572ee1270ee4f98c5c54158507df0783bd2696b\nezbr_sha256: eb08d5ba112537dae1e9fe90e9b1022b7a7a6feaad0ab9a727d86b40574a76db'
          )
          release2 = (
              '\n## Estado da implantação do Lote 8\n\n'
              '- Core 1.0 publicado em 10/09/2026;\n'
              '- commit fonte imutável do motor: `2572ee1270ee4f98c5c54158507df0783bd2696b`;\n'
              '- commit de pin/frontend: `8689713a3846977b2e4f13e095c8417c761cec8f`;\n'
              '- `engine-api` v7 ACTIVE, `verify_jwt=false`;\n'
              '- pacote implantado: `eb08d5ba112537dae1e9fe90e9b1022b7a7a6feaad0ab9a727d86b40574a76db`;\n'
              '- GitHub Pages: build e deploy aprovados para o Lote 8;\n'
              '- nenhuma migração de banco foi necessária para a promoção.\n'
          )
          if '## Estado da implantação do Lote 8' not in s:
              s = s.rstrip() + '\n' + release2
          arq.write_text(s, encoding='utf-8')

          handoff = Path('docs/HANDOFF.md')
          s = handoff.read_text(encoding='utf-8')
          release3 = (
              '\n\n### Diário — publicação do Lote 8 / Core 1.0 em produção\n\n'
              'Em 10/09/2026, após backup do `main` e snapshot lógico do Supabase, o Lote 8 foi promovido em ordem segura: motor primeiro, frontend depois.\n\n'
              '- fonte imutável do motor: `2572ee1270ee4f98c5c54158507df0783bd2696b`;\n'
              '- pin versionado: `8689713a3846977b2e4f13e095c8417c761cec8f`;\n'
              '- `engine-api` v7 ACTIVE, `verify_jwt=false`;\n'
              '- pacote Supabase: `eb08d5ba112537dae1e9fe90e9b1022b7a7a6feaad0ab9a727d86b40574a76db`;\n'
              '- gate pré-deploy: sintaxe, backend, gerados, CSS, auditoria Core 1.0 zerada e E2E verdes;\n'
              '- `main` avançada por fast-forward, sem force;\n'
              '- GitHub Pages: build e deploy concluídos com sucesso;\n'
              '- `newedit` permanece como branch de desenvolvimento.\n'
          )
          if '### Diário — publicação do Lote 8 / Core 1.0 em produção' not in s:
              s = s.rstrip() + release3
          handoff.write_text(s, encoding='utf-8')
          PY
          grep -F 'engine-api: v7 ACTIVE' README.md docs/arquitetura-supabase.md
          grep -F 'publicação do Lote 8 / Core 1.0 em produção' docs/HANDOFF.md
          rm .github/workflows/tmp-docs-release-lote8.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'docs: registrar publicação do Lote 8'
          git push origin HEAD:newedit
