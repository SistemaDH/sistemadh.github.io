name: Corrigir HUD de dano e cache

on:
  push:
    branches: [fix/dano-hud-cartas-cache]
    paths:
      - '.github/workflows/fix-dano-hud-cache.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dano-hud-cartas-cache
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Aplicar correcoes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new, label):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: esperava 1 ocorrencia, encontrei {n}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')

          # 1) Nivel: nao pode encolher nem recortar acentos/letras nas pontas.
          p = Path('css/ficha.css')
          s = p.read_text(encoding='utf-8')
          old = '''.ficha__topoLinha .selo--nivel {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 0;
  padding: 5px 16px;
  border: 1px solid var(--cor-ouro-escuro);
  background: rgba(0, 0, 0, .25);
  color: var(--cor-titulo);
  font-size: var(--txt-xs);
  font-weight: 600;
  letter-spacing: 0;
  white-space: nowrap;
  cursor: pointer;
}
'''
          new = '''.ficha__topoLinha .selo--nivel {
  position: relative;
  display: inline-flex;
  flex: 0 0 auto;
  align-items: center;
  gap: 6px;
  min-height: 0;
  max-width: none;
  overflow: visible;
  padding: 6px 16px;
  border: 1px solid var(--cor-ouro-escuro);
  background: rgba(0, 0, 0, .25);
  color: var(--cor-titulo);
  font-size: var(--txt-xs);
  font-weight: 600;
  line-height: 1.3;
  letter-spacing: 0;
  white-space: nowrap;
  cursor: pointer;
}
'''
          if s.count(old) != 1:
              raise SystemExit('CSS selo nivel nao encontrado de forma unica')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          # 2) Levantar-Se vira uma reacao selecionavel no proprio modal de dano.
          p = Path('js/telas/ficha.js')
          s = p.read_text(encoding='utf-8')
          pattern = re.compile(r"  function reacoesDeDanoDaFicha_\(ficha\) \{.*?\n  \}\n\n  function blocoDeReacoesDeEquipamento_", re.S)
          replacement = '''  function reacoesDeDanoDaFicha_(ficha) {
    const saida = [
      ['Pele Grossa', 'Dano Menor: marque 2 Estresses em vez de 1 PV.'],
      ['Fortitude Aumentada', 'Dano físico: gaste 3 Esperanças para reduzi-lo à metade antes dos limiares.'],
      ['Escamas', 'Dano Severo: marque 1 Estresse para marcar 1 PV a menos.'],
      ['Vontade de Ferro', 'Dano físico: marque 1 Ponto de Armadura adicional para reduzir a severidade em um limiar.']
    ].filter(([nome]) => temCaracteristica_(ficha, nome));

    const ativas = ((ficha.cartas || {}).ativas || [])
      .map((ref) => catalogo.acharCarta(ref))
      .filter(Boolean);
    if (ativas.some((carta) => normalizarNome_(carta.nome) === normalizarNome_('Levantar-Se'))) {
      saida.push(['Levantar-Se', 'Dano Severo: marque 1 Estresse para reduzir a severidade em um nível.']);
    }
    return saida;
  }

  function blocoDeReacoesDeEquipamento_'''
          s2, n = pattern.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit(f'frontend reacoes dano: esperava 1 funcao, encontrei {n}')
          p.write_text(s2, encoding='utf-8')

          # Evita duplicar Levantar-Se como cartao meramente informativo no mesmo modal.
          replace_once('js/lote9-dano.js', "  'levantar-se',\n", '', 'remover Levantar-Se informativo')

          # 3) Servidor: o cliente nao pode inventar Levantar-Se. A carta precisa estar ativa,
          # o dano precisa continuar Severo depois da Armadura e o Estresse precisa caber.
          p = Path('backend/4C_Ajustes.gs')
          s = p.read_text(encoding='utf-8')
          old = '''  for (let i = 0; i < nomes.length; i++) {
    let def = (typeof reacaoDeDanoDeOrigem_ === 'function') ? reacaoDeDanoDeOrigem_(nomes[i]) : null;
    if (!def && typeof reacaoDeDanoDeClasse_ === 'function') def = reacaoDeDanoDeClasse_(nomes[i]);
    if (!def) return { erro: 'Reação de dano desconhecida: "' + String(nomes[i]) + '".' };
    const k = chaveTexto_(def.nome);
    if (vistos[k]) return { erro: 'A reação "' + def.nome + '" veio repetida.' };
    vistos[k] = true;
    if (typeof fichaTemCaracteristica_ !== 'function' || !fichaTemCaracteristica_(ficha, def.nome)) {
      return { erro: 'Este personagem não tem "' + def.nome + '".' };
    }
    defs.push(def);
  }
'''
          new = '''  for (let i = 0; i < nomes.length; i++) {
    let def = (typeof reacaoDeDanoDeOrigem_ === 'function') ? reacaoDeDanoDeOrigem_(nomes[i]) : null;
    if (!def && typeof reacaoDeDanoDeClasse_ === 'function') def = reacaoDeDanoDeClasse_(nomes[i]);

    const pediuLevantarSe = chaveTexto_(nomes[i]) === chaveTexto_('Levantar-Se');
    if (!def && pediuLevantarSe) {
      const ativas = Array.isArray((((ficha || {}).cartas || {}).ativas)) ? ficha.cartas.ativas : [];
      let ativa = false;
      for (let c = 0; c < ativas.length; c++) {
        const ref = (ativas[c] && typeof ativas[c] === 'object') ? (ativas[c].id || ativas[c].nome) : ativas[c];
        const carta = (typeof acharCarta_ === 'function') ? acharCarta_(ref) : null;
        if (carta && carta.id === 'blade-levantar-se') { ativa = true; break; }
      }
      if (!ativa) return { erro:'Levantar-Se precisa estar entre as cartas ativas.' };
      def = {
        nome:'Levantar-Se', origem:'carta-dominio', momento:'depois-dos-limiares',
        tipos:['fisico','magico'], faixas:['severo'], custo:{ estresse:1 },
        efeito:{ reduzPv:1 },
        fonte:'Carta de domínio ativa Levantar-Se.'
      };
    }

    if (!def) return { erro: 'Reação de dano desconhecida: "' + String(nomes[i]) + '".' };
    const k = chaveTexto_(def.nome);
    if (vistos[k]) return { erro: 'A reação "' + def.nome + '" veio repetida.' };
    vistos[k] = true;
    if (def.origem !== 'carta-dominio' &&
        (typeof fichaTemCaracteristica_ !== 'function' || !fichaTemCaracteristica_(ficha, def.nome))) {
      return { erro: 'Este personagem não tem "' + def.nome + '".' };
    }
    defs.push(def);
  }
'''
          if s.count(old) != 1:
              raise SystemExit(f'backend registro de reacoes: esperava 1 bloco, encontrei {s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          # 4) Cache-busting dos arquivos que mudaram. O app novo encadeia ate ficha.js,
          # em vez de depender do cache HTTP antigo do GitHub Pages expirar.
          versao = '20260911c'
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          for old, new in [
            ('href="css/ficha.css"', f'href="css/ficha.css?v={versao}"'),
            ('src="js/app.js"', f'src="js/app.js?v={versao}"'),
            ('src="js/lote9-dano.js"', f'src="js/lote9-dano.js?v={versao}"')
          ]:
              if s.count(old) != 1:
                  raise SystemExit(f'cache bust index: {old} encontrado {s.count(old)} vez(es)')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          replace_once('js/app.js',
            "import { telaRoster } from './telas/roster.js';",
            f"import {{ telaRoster }} from './telas/roster.js?v={versao}';",
            'cache bust roster')
          replace_once('js/telas/roster.js',
            "import { abrirFichaEmJogo } from './ficha.js';",
            f"import {{ abrirFichaEmJogo }} from './ficha.js?v={versao}';",
            'cache bust ficha')

          # 5) Regressao backend para a carta que o usuario pediu no fluxo.
          p = Path('tools/testes-backend.mjs')
          s = p.read_text(encoding='utf-8')
          marker = "teste('Endurecido pela Batalha cobra Esperança, limpa PV e respeita 1/descanso longo',()=>{"
          if s.count(marker) != 1:
              raise SystemExit('marcador dos testes Blade nao encontrado')
          tests = r'''teste('Levantar-Se aparece como reacao real: reduz Severo e cobra 1 Estresse',()=>{
  const f=fichaBladeAlta_(1,['blade-levantar-se']);
  const grave=Number(f.defesas.limiarGrave);
  const pvAntes=Number(f.recursos.pontosDeVidaMarcados)||0;
  const r=contexto.aplicarAjustes_(f,[{tipo:'dano',dano:grave,tipoDeDano:'fisico',reacoes:['Levantar-Se']}]);
  igual(r.erros,[]); igual(f.recursos.pontosDeVidaMarcados,pvAntes+2); igual(f.recursos.estresseMarcado,1);
  igual(r.mudancas[0].reacoes,['Levantar-Se']);
});

teste('Levantar-Se nao pode ser inventada pelo cliente quando a carta nao esta ativa',()=>{
  const f=fichaBladeAlta_(1,[]);
  const grave=Number(f.defesas.limiarGrave);
  const pvAntes=Number(f.recursos.pontosDeVidaMarcados)||0;
  const stressAntes=Number(f.recursos.estresseMarcado)||0;
  const r=contexto.aplicarAjustes_(f,[{tipo:'dano',dano:grave,tipoDeDano:'fisico',reacoes:['Levantar-Se']}]);
  verdade(r.erros.length===1); igual(f.recursos.pontosDeVidaMarcados,pvAntes); igual(f.recursos.estresseMarcado,stressAntes);
});

'''
          p.write_text(s.replace(marker, tests + marker, 1), encoding='utf-8')
          PY

      - run: npm ci
      - name: Validar sintaxe e backend
        run: |
          npm run teste:sintaxe
          npm run teste
          npm run teste:gerados
          npm run teste:css
      - name: Commitar correcoes validadas
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/4C_Ajustes.gs css/ficha.css index.html js/app.js js/lote9-dano.js js/telas/ficha.js js/telas/roster.js tools/testes-backend.mjs
          git commit -m "fix: corrigir HUD de dano e cache do frontend"
          git push origin HEAD:fix/dano-hud-cartas-cache
