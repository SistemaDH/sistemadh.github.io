name: fix-dano-hud-cache

on:
  push:
    branches:
      - fix/dano-hud-cartas-cache
    paths:
      - .github/workflows/fix-dano-hud-cache.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dano-hud-cartas-cache
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Aplicar patch
        run: python3 .github/scripts/fix_dano_hud_cache.py
      - run: npm ci
      - name: Validar
        run: |
          npm run teste:sintaxe
          npm run teste
          npm run teste:gerados
          npm run teste:css
      - name: Commitar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/4C_Ajustes.gs css/ficha.css index.html js/app.js js/lote9-dano.js js/telas/ficha.js js/telas/roster.js tools/testes-backend.mjs
          git commit -m "fix: corrigir HUD de dano e cache do frontend"
          git push origin HEAD:fix/dano-hud-cartas-cache
