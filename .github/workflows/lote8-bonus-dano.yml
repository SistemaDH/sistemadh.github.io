name: Lote 8 - bônus de dano de classe

on:
  push:
    branches:
      - 'ediçãoclaude'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validar:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-dano]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'ediçãoclaude'
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Guardar HEAD testado
        run: echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Corrigir delimitador do transformador temporário
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/lote8-implementar-bonus-dano.py')
          t = p.read_text(encoding='utf-8')
          velho = " * `fichaTemCaracteristicaDeClasse_` inclui multiclasse, então adquirir a"
          novo = " * fichaTemCaracteristicaDeClasse_ inclui multiclasse, então adquirir a"
          if velho not in t:
              raise SystemExit('trecho de comentário esperado não encontrado')
          p.write_text(t.replace(velho, novo, 1), encoding='utf-8')
          PY

      - name: Materializar perfil de dano e regenerar backend
        run: |
          python3 tools/lote8-implementar-bonus-dano.py
          node tools/gerar-48-criacao.mjs
          node tools/conferir-gerados.mjs

      - name: Instalar dependências E2E
        run: |
          npm install --ignore-scripts
          npx playwright install --with-deps chromium

      - name: Testes backend
        run: node tools/testes-backend.mjs

      - name: Testes E2E
        run: node tools/testes-e2e.mjs

      - name: Conferir CSS
        run: node tools/conferir-css.mjs

      - name: Recusar push sobre branch que avançou
        run: |
          git fetch origin 'ediçãoclaude'
          ATUAL=$(git rev-parse origin/ediçãoclaude)
          if [ "$ATUAL" != "$BASE_SHA" ]; then
            echo "Branch avançou durante os testes: $BASE_SHA -> $ATUAL"
            exit 1
          fi

      - name: Commitar somente implementação validada
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/gerar-48-criacao.mjs backend/48_Criacao.gs js/telas/ficha.js tools/testes-backend.mjs tools/testes-e2e.mjs
          if git diff --cached --quiet; then
            echo 'Nenhuma materialização pendente.'
          else
            git commit -m 'feat: automatizar bônus de dano de classe [lote8-generated]'
            git push origin HEAD:'ediçãoclaude'
          fi
