name: TEMP Lote 9 B3 diagnostico tipografia

on:
  push:
    branches: [tmp-lote9-b3-tipografia-sol]

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Detalhar textos abaixo de 12px
        run: python3 tools/tmp-lote9-b3-diagnostico.py
      - run: npx playwright install --with-deps chromium
      - run: npm run teste:layout-mobile
      - name: Guardar diagnostico B3
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lote9-b3-diagnostico
          path: artifacts/layout-mobile
          if-no-files-found: error
