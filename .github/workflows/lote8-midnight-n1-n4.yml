name: Lote 8 - Meia-Noite N1-N4

on:
  push:
    branches: [tmp-lote8-midnight-n1-n4-sol]

permissions:
  contents: write

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materializar Meia-Noite N1-N4
        run: |
          python3 tools/lote8-midnight-n1-n4.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/contadores.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          for x in d['contadores']:
              if x.get('chave')=='estado:carta:midnight:veu-da-noite':
                  x['zeraEm']=['manual']
                  x['observacao']='Dura até conjurar outra magia; o motor encerra automaticamente quando outro feitiço é usado pelo fluxo de cartas. Manual cobre conjuração feita fora desse fluxo.'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=1)+'\n',encoding='utf-8')
          p=Path('tools/testes-backend.mjs')
          s=p.read_text(encoding='utf-8').replace("r.mudancas[0].estadosEncerrados||[]","r.mudancas[0].estadosDeCartaEncerrados||[]")
          p.write_text(s,encoding='utf-8')
          PY
          node tools/gerar-41-dominios.mjs
          node tools/gerar-47-contadores.mjs
          node tools/gerar-4B-descanso.mjs
          git diff --check

      - name: Conferir classificacao e auditoria
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('data/cartas-dominio.json',encoding='utf-8'))
          ids={
            'midnight-abrir-e-puxar','midnight-chuva-de-laminas','midnight-disfarce-incrivel',
            'midnight-espirito-da-meia-noite','midnight-vincular-sombras','midnight-estrangulamento',
            'midnight-veu-da-noite','midnight-expert-em-furtividade','midnight-glifo-do-crepusculo'
          }
          xs=[c for c in d['cartas'] if c['id'] in ids]
          assert len(xs)==9, len(xs)
          assert all(c.get('automacao') for c in xs), [c['id'] for c in xs if not c.get('automacao')]
          assert all((c.get('resolucaoManual') or {}).get('rolaNoApp') is False for c in xs)
          cont=json.load(open('data/contadores.json',encoding='utf-8'))['contadores']
          assert len(cont)==116, len(cont)
          keys={x['chave'] for x in cont}
          assert 'carta:midnight-disfarce-incrivel' in keys
          assert 'estado:carta:midnight:espirito-da-meia-noite' in keys
          assert 'estado:carta:midnight:veu-da-noite' in keys
          veu=next(x for x in cont if x['chave']=='estado:carta:midnight:veu-da-noite')
          assert veu['zeraEm']==['manual'], veu
          PY
          python3 tools/auditar-pendencias-lote8.py > /tmp/auditoria-lote8.md
          if grep -Eq '^\| Meia-Noite \| (1|2|3|4) \|' /tmp/auditoria-lote8.md; then
            echo 'Ainda ha Meia-Noite N1-N4 candidata sem sinal especifico:'
            grep -E '^\| Meia-Noite \| (1|2|3|4) \|' /tmp/auditoria-lote8.md
            exit 1
          fi
          grep -q 'midnight-chuva-de-laminas' backend/41_Dominios.gs
          grep -q 'estado:carta:midnight:espirito-da-meia-noite' backend/47_Contadores.gs
          grep -q 'estado:carta:midnight:veu-da-noite' backend/47_Contadores.gs

      - name: Testes backend
        shell: bash
        run: |
          set -o pipefail
          node tools/testes-backend.mjs | tee /tmp/backend.log
          ! grep -q '✗' /tmp/backend.log
          tail -n 26 /tmp/backend.log

      - name: Instalar Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install chromium

      - name: Testes E2E
        run: node tools/testes-e2e.mjs

      - name: Conferir gerados e CSS
        run: |
          node tools/conferir-gerados.mjs
          node tools/conferir-css.mjs
          git diff --check

      - name: Proteger contra concorrencia
        run: |
          git fetch origin 'ediçãoclaude'
          test "$(git rev-parse 'origin/ediçãoclaude')" = 'c38b4926713f351ab44a41734d0cafca1c148c4f'

      - name: Commitar funcional e limpar temporarios
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f --ignore-unmatch tools/lote8-midnight-n1-n4.py
          git rm -f --ignore-unmatch .github/workflows/lote8-midnight-n1-n4.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          git add -A
          git diff --cached --check
          git commit -m 'feat: revisar Meia-Noite níveis 1 a 4 [lote8-generated]'
          git push origin HEAD:tmp-lote8-midnight-n1-n4-sol
