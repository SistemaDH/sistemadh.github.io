name: TEMP Lote 9 B20 CTAs abertura mobile

on:
  push:
    branches: [tmp-lote9-b20-abertura-ctas-mobile-sol]

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run teste:sintaxe
      - run: npm run teste:css
      - run: npx playwright install --with-deps chromium
      - name: Abertura mobile 360 / 390 / 430
        run: npm run teste:layout-abertura-mobile
      - name: Guardar diagnóstico da abertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lote9-b20-abertura
          path: artifacts/layout-abertura-mobile
          if-no-files-found: warn
