name: Lote 8 - Sabio N5-N10

on:
  push:
    branches: [tmp-lote8-sage-n5-n10-sol]

permissions:
  contents: write

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materializar Sabio N5-N10
        run: |
          python3 tools/lote8-sage-n5-n10.py
          node tools/gerar-41-dominios.mjs
          node tools/gerar-47-contadores.mjs
          node tools/gerar-4B-descanso.mjs
          git diff --check
      - name: Conferir classificacao e auditoria
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('data/cartas-dominio.json',encoding='utf-8'))
          ids={'sage-fortaleza-selvagem','sage-pele-espinhosa','sage-coletor','sage-montarias-conjuradas','sage-surto-selvagem','sage-tocado-pelo-saber','sage-barreira-rejuvenescedora','sage-forest-sprites','sage-dominio-das-plantas','sage-templo-das-selvas','sage-forca-da-natureza','sage-tempestade'}
          xs=[c for c in d['cartas'] if c['id'] in ids]
          assert len(xs)==12
          assert all(c.get('automacao') for c in xs)
          assert all((c.get('resolucaoManual') or {}).get('rolaNoApp') is False for c in xs)
          cont=json.load(open('data/contadores.json',encoding='utf-8'))['contadores']
          assert len(cont)==134, len(cont)
          keys={x['chave'] for x in cont}
          for k in ['carta:sage-fortaleza-selvagem','carta:sage-pele-espinhosa','carta:sage-surto-selvagem','carta:sage-templo-das-selvas','estado:carta:sage:montarias-conjuradas','uso:carta:sage:barreira-rejuvenescedora','estado:carta:sage:forca-da-natureza']:
            assert k in keys,k
          PY
          python3 tools/auditar-pendencias-lote8.py > /tmp/auditoria-lote8.md
          if grep -Eq '^\| Sábio \| (5|6|7|8|9|10) \|' /tmp/auditoria-lote8.md; then
            echo 'Ainda ha Sabio N5-N10 candidato sem sinal especifico:'
            grep -E '^\| Sábio \| (5|6|7|8|9|10) \|' /tmp/auditoria-lote8.md
            exit 1
          fi
      - name: Testes backend
        shell: bash
        run: |
          set -o pipefail
          node tools/testes-backend.mjs | tee /tmp/backend.log
          ! grep -q '✗' /tmp/backend.log
          tail -n 32 /tmp/backend.log
      - name: Instalar Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install chromium
      - name: Testes E2E
        run: node tools/testes-e2e.mjs
      - name: Conferir gerados e CSS
        run: |
          node tools/conferir-gerados.mjs
          node tools/conferir-css.mjs
          git diff --check
      - name: Proteger contra concorrencia
        run: |
          git fetch origin 'ediçãoclaude'
          test "$(git rev-parse 'origin/ediçãoclaude')" = 'feec51f217cba06f9531d61e950e7a56ad4475df'
      - name: Commitar funcional e limpar temporarios
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f --ignore-unmatch tools/lote8-sage-n5-n10.py
          git rm -f --ignore-unmatch .github/workflows/lote8-sage-n5-n10.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          git add -A
          git diff --cached --check
          git commit -m 'feat: revisar Sábio níveis 5 a 10 [lote8-generated]'
          git push origin HEAD:tmp-lote8-sage-n5-n10-sol
