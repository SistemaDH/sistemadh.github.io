name: Integrar inventário sobre produção

on:
  push:
    branches: [inventario-integracao]

permissions:
  contents: write

jobs:
  integrar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: inventario-integracao
          fetch-depth: 0
      - name: Aplicar patch com rejects para diagnosticar conflitos
        run: |
          set +e
          git diff d440676f447fb3b5452cdf81b3df848e5b843aee^ d440676f447fb3b5452cdf81b3df848e5b843aee -- \
            backend/40_Regras.gs \
            backend/4C_Ajustes.gs \
            js/telas/criacao.js \
            js/telas/ficha.js \
            tools/testes-backend.mjs \
            tools/testes-e2e.mjs \
            docs/alteracao-catalogo-mochila.md \
          | git apply --reject --whitespace=nowarn
          codigo=$?
          echo '=== STATUS ==='
          git status --short
          echo '=== REJECT ficha.js ==='
          cat js/telas/ficha.js.rej 2>/dev/null || true
          echo '=== REJECT testes-e2e.mjs ==='
          cat tools/testes-e2e.mjs.rej 2>/dev/null || true
          echo '=== REJECTS restantes ==='
          find . -name '*.rej' -not -path './.git/*' -print
          exit $codigo
