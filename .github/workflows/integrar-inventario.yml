name: Integrar inventário sobre produção

on:
  push:
    branches: [inventario-integracao]

permissions:
  contents: write

jobs:
  integrar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: inventario-integracao
          fetch-depth: 0
      - name: Diagnosticar merge do estado final da newedit
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-commit --no-ff d440676f447fb3b5452cdf81b3df848e5b843aee
          codigo=$?
          echo '=== CONFLITOS ==='
          git diff --name-only --diff-filter=U
          for f in $(git diff --name-only --diff-filter=U); do
            echo "=== $f ==="
            grep -n -B 12 -A 35 -E '^(<<<<<<<|=======|>>>>>>>)' "$f" || true
          done
          exit $codigo
