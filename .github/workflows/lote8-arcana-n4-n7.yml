name: Lote 8 - Arcana N4-N7
on:
  push:
    branches: ["tmp-lote8-arcana-n4-n10"]
permissions:
  contents: write
jobs:
  validar:
    if: contains(github.event.head_commit.message, '[run-lote8-arcana-n4-n7]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materializar Arcana N4-N7
        run: |
          python3 tools/lote8-arcana-n4-n7.py
          node tools/gerar-41-dominios.mjs
          node tools/gerar-47-contadores.mjs
          node tools/gerar-48-criacao.mjs
      - name: Checkers e diff
        run: |
          python3 tools/conferir-cartas-lote8.py
          python3 tools/conferir-classes-lote8.py
          node --check js/telas/ficha.js
          git diff --check
      - name: Testes backend
        run: node tools/testes-backend.mjs
      - name: Instalar Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Testes E2E
        run: node tools/testes-e2e.mjs
      - name: Conferir gerados e CSS
        run: |
          node tools/conferir-gerados.mjs
          node tools/conferir-css.mjs
      - name: Auditoria reduz cartas para 148
        run: |
          python3 tools/auditar-pendencias-lote8.py
          grep -F 'Cartas de domínio: **189 cartas**; **148** candidatas sem sinal de automação específica' docs/auditoria-lote8.md
          grep -F 'Classes/subclasses: **99 características**; **0** candidatas sem sinal de automação.' docs/auditoria-lote8.md
      - name: Proteger contra concorrencia
        run: |
          git fetch origin 'ediçãoclaude' 'tmp-lote8-arcana-n4-n10'
          test "$(git rev-parse 'origin/ediçãoclaude')" = '26324c6525a17796f1596b5ec11883a66f708dfc'
          test "$(git rev-parse 'origin/tmp-lote8-arcana-n4-n10')" = "$GITHUB_SHA"
      - name: Commitar funcional e limpar temporarios
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f tools/lote8-arcana-n4-n7.py
          git rm -f .github/workflows/lote8-arcana-n4-n7.yml
          git add -A
          git diff --cached --check
          git commit -m 'feat: revisar Arcana níveis 4 a 7 [lote8-generated]'
          git push origin HEAD:'tmp-lote8-arcana-n4-n10'
