name: patch-normalizar-dano

on:
  push:
    branches:
      - fix/dano-hud-cartas-cache
    paths:
      - .github/workflows/patch-normalizar-dano.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dano-hud-cartas-cache
          fetch-depth: 0
      - name: Corrigir normalizador
        run: python3 -c "from pathlib import Path; p=Path('js/telas/ficha.js'); s=p.read_text(encoding='utf-8'); old=\"normalizarNome_(carta.nome) === normalizarNome_('Levantar-Se')\"; new=\"dados.chave(carta.nome) === dados.chave('Levantar-Se')\"; assert s.count(old)==1, s.count(old); p.write_text(s.replace(old,new,1),encoding='utf-8')"
      - name: Commitar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/telas/ficha.js
          git commit -m "fix: usar normalizador existente no dano"
          git push origin HEAD:fix/dano-hud-cartas-cache
