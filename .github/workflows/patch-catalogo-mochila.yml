name: Patch temporário catálogo mochila

on:
  push:
    branches: [newedit]

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, '[run-catalogo]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: newedit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: python3 tools/patch-catalogo-mochila.py
      - name: Remover classe visual sem regra própria
        run: sed -i 's/chips ficha__catalogoAbas/chips/' js/telas/ficha.js
      - run: npm ci
      - run: npm run teste:sintaxe
      - run: npm run teste:css
      - name: Gravar patch e remover andaime temporário
        run: |
          rm tools/patch-catalogo-mochila.py
          rm .github/workflows/patch-catalogo-mochila.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/telas/ficha.js tools/testes-e2e.mjs tools/patch-catalogo-mochila.py .github/workflows/patch-catalogo-mochila.yml
          git commit -m "feat: completar catálogo da mochila com equipamentos"
          git push origin HEAD:newedit
