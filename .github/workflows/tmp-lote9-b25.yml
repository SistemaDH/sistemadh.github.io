name: TEMP Lote 9 B25 mochila em uso

on:
  push:
    branches: [tmp-lote9-b25-mochila-em-uso-sol]

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run teste:sintaxe
      - run: npm run teste:css
      - run: npx playwright install --with-deps chromium
      - name: Mochila mobile — itens em uso
        run: npm run teste:layout-mochila-em-uso-mobile
      - name: Guardar diagnóstico visual
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lote9-b25-mochila-em-uso
          path: artifacts/layout-mochila-em-uso-mobile
          if-no-files-found: warn
