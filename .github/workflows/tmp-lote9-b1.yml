name: TEMP Lote 9 B1 ficha mobile

on:
  push:
    branches: [tmp-lote9-b1-ficha-mobile-sol]

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci

      - name: Materializar L9-B1
        run: python3 tools/tmp-lote9-b1.py

      - name: Ajustar guarda de toast quando há modal
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/testes-layout-mobile.mjs')
          s = p.read_text(encoding='utf-8')
          inicio = "    const zonasFixas = [...document.querySelectorAll(\n"
          fim = "    /* O HUD mobile começa pelos recursos que mudam durante a cena. */\n"
          a = s.find(inicio)
          b = s.find(fim, a)
          if a < 0 or b < 0:
              raise SystemExit('não achei o bloco de zonas fixas do L9-B1')
          novo = r'''    /*
           * Com modal aberto, o fundo está inerte e escurecido. O toast pode ficar
           * sobre o cabeçalho que está ATRÁS dele; o que não pode cobrir é a caixa
           * ativa do próprio modal. Sem modal, topo e navegação voltam a ser as
           * zonas protegidas normalmente.
           */
          const modalAtivo = [...document.querySelectorAll('.modal')].filter(visivel).at(-1) || null;
          const zonasFixas = modalAtivo
            ? [modalAtivo.querySelector('.modal__caixa')].filter((x) => x && visivel(x))
            : [...document.querySelectorAll(
                '.ficha__topo, .ficha__abas, .mestre__topo, .mestre__abas, .criacao__topo, .criacao__rodape'
              )].filter(visivel);
          const sobrepoe = (a, b) => a.left < b.right && a.right > b.left && a.top < b.bottom && a.bottom > b.top;
          for (const aviso of [...document.querySelectorAll('.aviso')].filter(visivel)) {
            const ar = aviso.getBoundingClientRect();
            const zona = zonasFixas.find((z) => sobrepoe(ar, z.getBoundingClientRect()));
            if (zona) {
              erros.push(`aviso cobre área ativa: ${zona.className}`);
              break;
            }
          }

          '''
          p.write_text(s[:a] + novo + s[b:], encoding='utf-8')
          PY

      - name: Diff limpo
        run: git diff --check

      - run: npm run teste:sintaxe
      - run: npm run teste
      - run: npm run teste:gerados
      - run: npm run teste:css

      - name: Auditoria Core 1.0 zerada
        run: |
          python3 tools/auditar-pendencias-lote8.py > /tmp/auditoria.md
          grep -F 'Classes/subclasses: **99 características**; **0** candidatas' /tmp/auditoria.md
          grep -F 'Comunidades: **9 características**; **0** candidatas' /tmp/auditoria.md
          grep -F 'Cartas de domínio: **189 cartas**; **0** candidatas' /tmp/auditoria.md
          grep -F 'Características de armas/armaduras/molduras: **203 ocorrências**; **0** ocorrências candidatas' /tmp/auditoria.md
          grep -F 'Loot/consumíveis com texto mecânico detectado: **81**; **0** candidatos' /tmp/auditoria.md

      - run: npx playwright install --with-deps chromium
      - run: npm run teste:e2e

      - name: Layout mobile 360 / 390 / 430
        run: npm run teste:layout-mobile

      - name: Guardar diagnóstico visual B1
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lote9-b1-layout-mobile
          path: artifacts/layout-mobile
          if-no-files-found: warn

      - name: Guardar base de integração
        id: base
        run: echo 'sha=1f24fcb05614e0eccf6212ed939159fbdd498711' >> "$GITHUB_OUTPUT"

      - name: Bloquear concorrência em newedit
        run: |
          atual=$(git ls-remote origin refs/heads/newedit | cut -f1)
          test "$atual" = '${{ steps.base.outputs.sha }}' || {
            echo "newedit mudou: esperado ${{ steps.base.outputs.sha }}, atual $atual"
            exit 1
          }

      - name: Criar commit funcional limpo
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm tools/tmp-lote9-b1.py .github/workflows/tmp-lote9-b1.yml
          git add js/ui.js js/telas/ficha.js css/componentes.css css/ficha.css css/papel.css tools/testes-layout-mobile.mjs
          git diff --cached --check
          git commit -m 'feat: refinar ficha jogo mobile L9-B1'
          git push origin HEAD:tmp-lote9-b1-ficha-mobile-sol
