name: Lote 8 - Corrigir Gate Backend e Ronin v2

on:
  push:
    branches: [tmp-lote8-equip-defensivo-b-sol]

permissions:
  contents: write

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materializar correção do gate e Ronin
        run: |
          python3 tools/lote8-fix-gate-ronin.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('docs/HANDOFF.md')
          p.write_text(p.read_text(encoding='utf-8').rstrip()+'\n',encoding='utf-8')
          PY
          node tools/gerar-44-equipamento.mjs
          node tools/gerar-41-dominios.mjs
          node tools/gerar-47-contadores.mjs
          node tools/gerar-4B-descanso.mjs
          cp backend/4C_Ajustes.gs /tmp/4C_Ajustes.js
          node --check /tmp/4C_Ajustes.js
          node --check js/telas/ficha.js
          git diff --check

      - name: Conferir estrutura do gate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/testes-backend.mjs')
          s=p.read_text(encoding='utf-8')
          marcador='console.log(`\\n${passou} passaram, ${falhou} falharam.\\n`);'
          assert s.count(marcador)==1, s.count(marcador)
          i=s.index(marcador)
          assert 'teste(' not in s[i:], 'há teste depois do resumo final'
          assert 'process.exit(1)' in s[i:], 'exit de falha não está no bloco final'
          a=Path('backend/4C_Ajustes.gs').read_text(encoding='utf-8')
          assert 'registrarEstado((opcao || {}).estado || null);' in a
          PY
          python3 tools/auditar-pendencias-lote8.py > /tmp/auditoria.md
          if grep -Eq '^\| (Magia|Doloroso|Resiliente|Impenetrável) \|' /tmp/auditoria.md; then
            echo 'B1 voltou a aparecer como pendência na auditoria.' >&2
            grep -E '^\| (Magia|Doloroso|Resiliente|Impenetrável) \|' /tmp/auditoria.md >&2 || true
            exit 1
          fi

      - name: Testes backend completos
        shell: bash
        run: |
          set -o pipefail
          node tools/testes-backend.mjs | tee /tmp/backend.log
          if grep -q '✗' /tmp/backend.log; then
            echo 'Há falha impressa na suíte backend.' >&2
            grep '✗' /tmp/backend.log >&2 || true
            exit 1
          fi
          grep -q '✓ Livro do Ronin controla Transformação e encerra o estado ao sofrer dano' /tmp/backend.log
          grep -q 'Lote 8 — equipamento defensivo B1' /tmp/backend.log
          grep -q '✓ duas fontes Doloroso pedem dois Inabalável' /tmp/backend.log
          tail -n 100 /tmp/backend.log

      - name: Instalar Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install chromium

      - name: Testes E2E
        run: node tools/testes-e2e.mjs

      - name: Conferir gerados e CSS
        run: |
          node tools/conferir-gerados.mjs
          node tools/conferir-css.mjs
          git diff --check

      - name: Proteger contra concorrência
        run: |
          git fetch origin 'ediçãoclaude'
          test "$(git rev-parse 'origin/ediçãoclaude')" = '084b97f31967d01fa14f4b9f405094797cd6cf81'

      - name: Commitar funcional e limpar temporários
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f --ignore-unmatch tools/lote8-fix-gate-ronin.py
          git rm -f --ignore-unmatch .github/workflows/lote8-fix-gate-ronin.yml
          git rm -f --ignore-unmatch .github/workflows/lote8-fix-gate-ronin-v2.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          git add -A
          git diff --cached --check
          git commit -m 'fix: fechar gate backend e estado do Livro do Ronin [lote8-generated]'
          git push origin HEAD:tmp-lote8-equip-defensivo-b-sol
