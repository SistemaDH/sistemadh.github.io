name: Lote 8 - Bardo Maestro

on:
  push:
    branches: ['ediçãoclaude']

permissions:
  contents: write

jobs:
  validar-materializar:
    if: ${{ contains(github.event.head_commit.message, '[run-lote8-maestro]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'ediçãoclaude'
          fetch-depth: 0

      - name: Materializar Maestro
        run: |
          python3 tools/lote8-bardo-maestro-hotfix.py
          python3 tools/lote8-bardo-maestro-hotfix2.py
          python3 tools/lote8-bardo-maestro.py
          node tools/gerar-42-classes.mjs
          node tools/gerar-48-criacao.mjs
          python3 tools/conferir-classes-lote8.py
          python3 tools/conferir-comunidades-lote8.py
          python3 tools/conferir-ancestralidades-lote8.py
          grep -q "usarHabilidadeEmAliado" supabase/functions/engine-api/index.ts
          git diff --check

      - name: Testes backend
        run: node tools/testes-backend.mjs

      - name: Instalar Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium

      - name: Testes E2E
        run: node tools/testes-e2e.mjs

      - name: Conferir gerados e CSS
        run: |
          node tools/conferir-gerados.mjs
          node tools/conferir-css.mjs

      - name: Regenerar auditoria transversal
        run: |
          python3 tools/auditar-pendencias-lote8.py > docs/AUDITORIA-FINAL-LOTE8.md
          python3 -c "from pathlib import Path; p=Path('docs/AUDITORIA-FINAL-LOTE8.md'); p.write_text(p.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')"
          python3 -c "import re,pathlib; t=pathlib.Path('docs/AUDITORIA-FINAL-LOTE8.md').read_text(encoding='utf-8'); m=re.search(r'Classes/subclasses: \*\*99 características\*\*; \*\*(\d+)\*\* candidatas',t); assert m and int(m.group(1)) <= 36, m.group(0) if m else 'linha ausente'; assert '| Bardo |' not in t.split('## Candidatos — comunidades')[0].split('## Candidatos — classes e subclasses')[-1]; print('candidatos de classes:',m.group(1),'— Bardo fechado')"
          git diff --check

      - name: Proteger contra concorrência
        run: |
          git fetch origin 'ediçãoclaude'
          test "$(git rev-parse 'origin/ediçãoclaude')" = "$GITHUB_SHA"

      - name: Commitar funcional e limpar temporários
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f tools/lote8-bardo-maestro.py
          git rm -f tools/lote8-bardo-maestro-hotfix.py
          git rm -f tools/lote8-bardo-maestro-hotfix2.py
          git rm -f .github/workflows/lote8-bardo-maestro.yml
          git add -A
          git diff --cached --check
          git commit -m 'feat: automatizar Maestro do Bardo [lote8-generated]'
          git push origin HEAD:'ediçãoclaude'
