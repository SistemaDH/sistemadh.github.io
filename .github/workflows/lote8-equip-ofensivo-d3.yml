name: Lote 8 - Equipamento Ofensivo D3

on:
  push:
    branches: [tmp-lote8-equip-ofensivo-d3-sol]

permissions:
  contents: write

env:
  BASE_SHA: 2875a60523113a4ee23db6538048cc9fbb5caeeb

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materializar D3
        run: |
          python3 tools/lote8-equip-ofensivo-d3.py
          node tools/gerar-44-equipamento.mjs
          node tools/gerar-41-dominios.mjs
          node tools/gerar-47-contadores.mjs
          node tools/gerar-4B-descanso.mjs
          git diff --check

      - name: Conferir classificação e auditoria
        run: |
          python3 - <<'PY'
          import json, subprocess
          d=json.load(open('data/equipamentos.json',encoding='utf-8'))
          nomes={'Assustador','Brutal','Busca da verdade','Comprimento','De outro mundo','Direcionado','Distorção Temporal','Dobrado','Enganchado','Eruptivo','Espalha-chumbo','Gancho','Perfeccionista','Queimadura','Serra','Silencioso'}
          xs=[]; aparar=[]
          def walk(x):
            if isinstance(x,dict):
              c=x.get('caracteristica')
              if isinstance(c,dict):
                if c.get('nome') in nomes: xs.append((x,c))
                if c.get('nome')=='Aparar': aparar.append((x,c))
              for v in x.values(): walk(v)
            elif isinstance(x,list):
              for v in x: walk(v)
          walk(d)
          assert len(xs)==27, len(xs)
          assert all(c.get('automacao') and c['automacao'].get('rolaNoApp') is False for _,c in xs)
          assert all(not (c.get('efeitoEquipamento') or {}).get('usoAtivo') for _,c in xs)
          assert len(aparar)==1 and not aparar[0][1].get('automacao')
          out=subprocess.check_output(['python3','tools/auditar-pendencias-lote8.py'],text=True)
          print(out)
          assert 'Características de armas/armaduras/molduras: **203 ocorrências**; **1** ocorrências candidatas ativas/condicionais.' in out
          assert '| Aparar | 1 |' in out
          print('D3 invariantes OK: 27 classificadas; Aparar isolado.')
          PY

      - name: Testes backend
        run: node tools/testes-backend.mjs

      - name: Instalar Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Testes E2E
        run: node tools/testes-e2e.mjs

      - name: Conferir gerados e CSS
        run: |
          node tools/conferir-gerados.mjs
          node tools/conferir-css.mjs
          git diff --check

      - name: Proteger contra concorrencia
        run: |
          git fetch origin 'refs/heads/ediçãoclaude:refs/remotes/origin/ediçãoclaude'
          ATUAL="$(git rev-parse 'origin/ediçãoclaude')"
          echo "ediçãoclaude atual: $ATUAL"
          echo "base esperada:       $BASE_SHA"
          test "$ATUAL" = "$BASE_SHA"

      - name: Commitar funcional e limpar temporarios
        run: |
          rm tools/lote8-equip-ofensivo-d3.py
          rm .github/workflows/lote8-equip-ofensivo-d3.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo 'Nenhuma mudança funcional para commit.'; exit 1; } || true
          git commit -m 'feat: classificar equipamento ofensivo D3'
          git push origin HEAD:tmp-lote8-equip-ofensivo-d3-sol
