name: Lote 8 - Diagnostico Armadura Mitigacao

on:
  push:
    branches: [tmp-lote8-armadura-mitigacao-sol]

permissions:
  contents: read

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mapear mitigacao
        run: |
          echo '=== equipamentoAtivoDaFicha_ ==='
          grep -Rni -B8 -A45 'function equipamentoAtivoDaFicha_' backend tools js || true
          echo '=== pvDoDano_ ==='
          grep -Rni -B12 -A110 'function pvDoDano_' backend tools || true
          echo '=== testes de dano/armadura existentes ==='
          grep -n -B8 -A45 -E "aplicarDanoNaFicha_|Vontade de Ferro|Pele Grossa|Fortitude Aumentada|Escamas|armaduraMarcada" tools/testes-backend.mjs | tail -n 420 || true
