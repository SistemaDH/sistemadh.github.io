name: Lote 8 - Guardiao Protecoes em Aliado

on:
  push:
    branches: ["ediçãoclaude"]

permissions:
  contents: write

jobs:
  validar-materializar:
    if: contains(github.event.head_commit.message, '[run-lote8-guardiao-aliados]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "ediçãoclaude"
          fetch-depth: 0

      - name: Materializar protecoes do Guardiao
        run: |
          python3 tools/lote8-guardiao-aliados.py
          python3 tools/lote8-guardiao-aliados-auditoria.py
          node tools/gerar-42-classes.mjs
          python3 tools/conferir-classes-lote8.py
          python3 tools/conferir-comunidades-lote8.py
          python3 tools/conferir-ancestralidades-lote8.py
          grep -q "PROTECOES_DE_ALIADO" backend/42_Classes.gs
          grep -q "aplicarProtecaoEmAliado_" backend/4C_Ajustes.gs
          grep -q "mutarPersonagemEOutro_" backend/30_Personagens.gs
          grep -q "usarProtecaoEmAliado" backend/99_Api.gs
          grep -q "usarProtecaoEmAliado" supabase/functions/engine-api/index.ts
          grep -q "botaoDeProtecaoEmAliado" js/telas/ficha.js
          grep -q "protecaoEmAliadoDaCaracteristica" js/telas/ficha.js
          grep -q "protecaoAliado" tools/auditar-pendencias-lote8.py
          git diff --check

      - name: Testes backend
        run: node tools/testes-backend.mjs

      - name: Instalar Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium

      - name: Testes E2E
        run: node tools/testes-e2e.mjs

      - name: Conferir gerados e CSS
        run: |
          node tools/conferir-gerados.mjs
          node tools/conferir-css.mjs

      - name: Regenerar auditoria transversal
        run: |
          python3 tools/auditar-pendencias-lote8.py > docs/AUDITORIA-FINAL-LOTE8.md
          python3 -c "from pathlib import Path; p=Path('docs/AUDITORIA-FINAL-LOTE8.md'); p.write_text(p.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')"
          python3 - <<'PY'
          import re
          from pathlib import Path
          t=Path('docs/AUDITORIA-FINAL-LOTE8.md').read_text(encoding='utf-8')
          m=re.search(r'Classes/subclasses: \*\*99 características\*\*; \*\*(\d+)\*\* candidatas', t)
          assert m and int(m.group(1)) <= 25, m.group(0) if m else 'linha ausente'
          sec=t.split('## Candidatos — comunidades')[0].split('## Candidatos — classes e subclasses')[-1]
          assert '| Guardião | Robusto | especializacao | Parceiros de Armas |' not in sec, 'Parceiros de Armas ainda aparece'
          assert '| Guardião | Robusto | maestria | Protetor Leal |' not in sec, 'Protetor Leal ainda aparece'
          assert '| Guardião | Vingança | especializacao | Ato de Retaliação |' in sec, 'Ato de Retaliação sumiu antes de ser implementado'
          print('candidatos de classes:', m.group(1), '— proteções do Guardião fechadas')
          PY
          git diff --check

      - name: Proteger contra concorrencia
        run: |
          git fetch origin 'ediçãoclaude'
          test "$(git rev-parse 'origin/ediçãoclaude')" = "$GITHUB_SHA"

      - name: Commitar funcional e limpar temporarios
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f tools/lote8-guardiao-aliados.py
          git rm -f tools/lote8-guardiao-aliados-auditoria.py
          git rm -f .github/workflows/lote8-guardiao-aliados.yml
          git add -A
          git diff --cached --check
          git commit -m 'feat: automatizar protecoes em aliado do Guardiao [lote8-generated]'
          git push origin HEAD:'ediçãoclaude'
